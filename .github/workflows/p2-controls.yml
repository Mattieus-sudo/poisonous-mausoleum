          }
          - (void)layoutSubviews {
              [super layoutSubviews]; CGFloat d = MIN(self.bounds.size.width, self.bounds.size.height);
              self.layer.cornerRadius = d / 2; self.borderView.frame = self.bounds; self.tl.frame = CGRectInset(self.bounds, d * 0.1, d * 0.1); self.iv.frame = CGRectInset(self.bounds, d * 0.125, d * 0.125);
              self.cap.frame = CGRectMake(-d * 0.3, self.bounds.size.height + 1, self.bounds.size.width + d * 0.6, 14);
          }
          - (void)place {
              CGSize s = self.superview.bounds.size; if (self.dragging || s.width < 1 || s.height < 1) return;
              CGFloat W = self.fw * s.width, H = self.fh * s.height, d = MIN(W, H);   /* a circle inscribed in the box, centred in it */
              self.frame = CGRectMake(self.fx * s.width + (W - d) / 2, self.fy * s.height + (H - d) / 2, d, d);
          }
          - (void)look {
              BOOL sel = gCbEdit && gSelCb == self;
              BOOL hasCustomBorder = self.borderView.image != nil && !self.noBorder;
              BOOL renderHidden = self.hiddenButton && !gCbEdit;
              self.borderView.hidden = !hasCustomBorder || renderHidden;
              self.backgroundColor = (hasCustomBorder || self.noBorder || renderHidden) ? UIColor.clearColor : [UIColor colorWithWhite:self.pressed ? 1.0 : 0.0 alpha:self.pressed ? 0.45 : 0.25];
              self.layer.borderColor = (sel ? UIColor.whiteColor : [UIColor colorWithWhite:1 alpha:0.8]).CGColor;
              self.layer.borderWidth = renderHidden ? 0 : (self.noBorder ? (sel ? 3 : 0) : (hasCustomBorder ? (gCbEdit && sel ? 3 : 0) : (sel ? 3 : 2)));
              self.layer.shadowOpacity = 0; self.layer.shadowRadius = 0; self.layer.shadowPath = nil;
              UIImage *ic = icoForDik(self.dik);   /* icons: a picture for this action replaces the key name (and, flat, the circle) */
              self.iv.image = (self.hiddenButton && gCbEdit) ? [UIImage systemImageNamed:@"eye.slash"] : ic; self.iv.hidden = renderHidden || (self.hiddenButton ? !gCbEdit : ic == nil); self.tl.hidden = renderHidden || self.hiddenButton || (ic != nil);
              self.cap.text = icoCaption(self.dik); self.cap.hidden = renderHidden || self.hiddenButton || self.cap.text == nil;
              if (ic) {
                  if (self.noBorder) { self.backgroundColor = UIColor.clearColor; self.layer.borderWidth = sel ? 3 : 0; } else if (gIcoFlat) { self.backgroundColor = UIColor.clearColor; self.layer.borderWidth = hasCustomBorder ? (gCbEdit && sel ? 3 : 0) : (gCbEdit ? (sel ? 3 : 2) : 0); }
                  self.iv.layer.shadowOpacity = 0; self.iv.layer.shadowRadius = 0; self.iv.layer.shadowPath = nil;
                  self.iv.alpha = self.pressed ? 0.65 : 1.0; self.iv.transform = self.pressed ? CGAffineTransformMakeScale(0.9, 0.9) : CGAffineTransformIdentity;
              }
          }
          - (void)press:(BOOL)down {
              if (down == self.pressed) return;
              self.pressed = down; if (self.dik >= CB_LMB) p2_mouse(self.dik == CB_LMB ? 0 : 1, down ? 1 : 0); else p2_btn_edge(self.dik, down ? 1 : 0); [self look];
          }
          - (void)touchesBegan:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e { if (gCbEdit) { self.dragging = YES; cbSelCb(self); } else [self press:YES]; }
          - (void)touchesMoved:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e {
              if (!gCbEdit || !self.dragging || gCbPinch) return;
              UITouch *t = ts.anyObject; CGPoint p = [t locationInView:self.superview], q = [t previousLocationInView:self.superview];
              CGRect b = self.superview.bounds, f = self.frame; f.origin.x += p.x - q.x; f.origin.y += p.y - q.y;
              f.origin.x = MAX(0, MIN(f.origin.x, b.size.width - f.size.width)); f.origin.y = MAX(0, MIN(f.origin.y, b.size.height - f.size.height));
