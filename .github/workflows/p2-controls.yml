          static void cbSelClear(void) { gSelCb = nil; gSelOwn = -1; cbSelRestyle(); cbSelUpdate(); }
          static void cbSelCb(CbButton *b) { gSelCb = b; gSelOwn = -1; cbSelRestyle(); cbSelUpdate(); }
          static void cbSelOwn(int i) { gSelCb = nil; gSelOwn = i; cbSelRestyle(); cbSelUpdate(); }
          static void cbSelDelete(void) {
              if (gSelCb) { CbButton *b = gSelCb; gSelCb = nil; cbRemove(b); }
              else if (gSelOwn >= 0) { int i = gSelOwn; gSelOwn = -1; ownDeleteAt(i); }
              cbSelRestyle(); cbSelUpdate();
          }
          static void ownRebuild(void) {   /* v88: the layers of the own elements are made when the view is first shown; after the stick is added, drop them and let the layout pass make them again */
              for (int i = 0; i < OWN_MAX; i++) gOwnLay[i] = nil;
              gOwnKnob = gOwnKnob2 = nil; if (gOwnView) { [gOwnView removeFromSuperview]; gOwnView = nil; }
              [gGame setNeedsLayout]; [gGame layoutIfNeeded];
          }
          static void rsToggle(void) {   /* the add list's Right stick row: adds the stick, or takes it away if it is already there */
              int at = -1; for (int i = 0; i < gOwnN; i++) if (gOwn[i].kind == 3) at = i;
              if (at >= 0) { if (gSelOwn == at) gSelOwn = -1; ownDeleteAt(at); cbSelClear(); return; }
              if (gOwnN >= OWN_MAX) return;
              OwnEl r; memset(&r, 0, sizeof r); r.kind = 3; r.x = 0.90f; r.y = 0.30f; r.w = 0.13f; gOwn[gOwnN++] = r;
              ownSave(); ownRebuild(); if (!gCbEdit) cbSetEdit(YES);
              for (int i = 0; i < gOwnN; i++) if (gOwn[i].kind == 3) cbSelOwn(i);   /* selected: its x and its sensitivity window show */
              p2_note("RSTICK: right stick added from the add list");
          }
          static CGFloat gPinchBase[2], gPinchLast = 1.0;   /* v85: the last scale the fingers reached */
          static void cbPinchBegin(void) {
              gCbPinch = YES; gPinchLast = 1.0;
              for (CbButton *b in gCbList) b.dragging = NO;
              for (int q = 0; q < 10; q++) gOwnDrag[q] = 0;
              if (gSelCb) { gPinchBase[0] = gSelCb.fw; gPinchBase[1] = gSelCb.fh; }
              else if (gSelOwn >= 0 && gSelOwn < gOwnN) { gPinchBase[0] = gOwn[gSelOwn].w; gPinchBase[1] = gOwn[gSelOwn].h; }
          }
          static void cbPinchApply(CGFloat sc, BOOL final) {
              gPinchLast = sc;
              CGFloat w0 = gPinchBase[0], h0 = gPinchBase[1];
              if (gSelCb) {
                  CbButton *b = gSelCb; if (w0 < 0.001 || h0 < 0.001) return;
                  CGFloat cx = b.fx + b.fw / 2, cy = b.fy + b.fh / 2;
                  CGFloat m = MAX(MAX(0.04 / w0, 0.08 / h0), MIN(sc, MIN(0.30 / w0, 0.45 / h0)));
                  b.fw = w0 * m; b.fh = h0 * m;
                  b.fx = MAX(0, MIN(cx - b.fw / 2, 1.0 - b.fw)); b.fy = MAX(0, MIN(cy - b.fh / 2, 1.0 - b.fh));
                  [b place]; if (final) cbSave();
              } else if (gSelOwn >= 0 && gSelOwn < gOwnN) {
                  OwnEl *e = &gOwn[gSelOwn];
                  if (e->kind == 1 || e->kind == 3) e->w = (float)MAX(0.08, MIN(0.30, w0 * sc));   /* the stick: radius as a fraction of the screen height */
                  else if (e->kind == 0 && w0 > 0.001 && h0 > 0.001) {
                      float cx = e->x + e->w / 2, cy = e->y + e->h / 2;
                      CGFloat m = MAX(MAX(0.04 / w0, 0.08 / h0), MIN(sc, MIN(0.30 / w0, 0.45 / h0)));
                      e->w = (float)(w0 * m); e->h = (float)(h0 * m);
                      e->x = MAX(0.0f, MIN(cx - e->w / 2, 1.0f - e->w)); e->y = MAX(0.0f, MIN(cy - e->h / 2, 1.0f - e->h));
                  } else return;
                  if (gOwnView) ownLayoutAll(gOwnView.bounds.size);
                  if (final) ownSave();
              }
              cbSelUpdate();
          }
          /* v85 fix: v84 finished with cbPinchApply(1.0, YES), i.e. scale 1.0 = the size from before the pinch, so every resize snapped back on release. It now saves the last scale reached. */
          static void cbPinchEnd(void) { cbPinchApply(gPinchLast, YES); gCbPinch = NO; }

          @implementation CbButton
          - (instancetype)initWithDik:(int)dik title:(NSString *)t fx:(CGFloat)fx fy:(CGFloat)fy fw:(CGFloat)fw fh:(CGFloat)fh {
              self = [super initWithFrame:CGRectMake(0, 0, 60, 60)];
              _dik = dik; _title = cbShort(dik); _fx = fx; _fy = fy; _fw = fw; _fh = fh;
              self.userInteractionEnabled = YES; self.multipleTouchEnabled = NO;
              self.layer.borderWidth = 2;
              _tl = [UILabel new]; _tl.text = _title; _tl.font = [UIFont systemFontOfSize:14 weight:UIFontWeightBold]; _tl.textColor = UIColor.whiteColor;
              _tl.textAlignment = NSTextAlignmentCenter; _tl.adjustsFontSizeToFitWidth = YES; _tl.minimumScaleFactor = 0.5; _tl.userInteractionEnabled = NO;
              _iv = [UIImageView new]; _iv.contentMode = UIViewContentModeScaleAspectFit; _iv.userInteractionEnabled = NO; [self addSubview:_iv];
              _cap = [UILabel new]; _cap.font = [UIFont systemFontOfSize:10 weight:UIFontWeightBold]; _cap.textColor = [UIColor colorWithWhite:1 alpha:0.9]; _cap.textAlignment = NSTextAlignmentCenter; _cap.userInteractionEnabled = NO;
              _cap.layer.shadowColor = UIColor.blackColor.CGColor; _cap.layer.shadowOpacity = 1; _cap.layer.shadowRadius = 2; _cap.layer.shadowOffset = CGSizeZero; [self addSubview:_cap];
              [self addSubview:_tl]; [self look];
              return self;
          }
          - (void)layoutSubviews {
              [super layoutSubviews]; CGFloat d = MIN(self.bounds.size.width, self.bounds.size.height);
              self.layer.cornerRadius = d / 2; self.tl.frame = CGRectInset(self.bounds, d * 0.1, d * 0.1); self.iv.frame = gIcoFlat ? self.bounds : CGRectInset(self.bounds, d * 0.17, d * 0.17);
              self.cap.frame = CGRectMake(-d * 0.3, self.bounds.size.height + 1, self.bounds.size.width + d * 0.6, 14);
          }
          - (void)place {
              CGSize s = self.superview.bounds.size; if (self.dragging || s.width < 1 || s.height < 1) return;
              CGFloat W = self.fw * s.width, H = self.fh * s.height, d = MIN(W, H);   /* a circle inscribed in the box, centred in it */
              self.frame = CGRectMake(self.fx * s.width + (W - d) / 2, self.fy * s.height + (H - d) / 2, d, d);
          }
          - (void)look {
              BOOL sel = gCbEdit && gSelCb == self;
              self.backgroundColor = [UIColor colorWithWhite:self.pressed ? 1.0 : 0.0 alpha:self.pressed ? 0.45 : 0.25];
              self.layer.borderColor = (sel ? UIColor.whiteColor : gCbEdit ? UIColor.systemYellowColor : [UIColor colorWithWhite:1 alpha:0.8]).CGColor;
              self.layer.borderWidth = sel ? 3 : 2;
              UIImage *ic = icoForDik(self.dik);   /* icons: a picture for this action replaces the key name (and, flat, the circle) */
              self.iv.image = ic; self.iv.hidden = ic == nil; self.tl.hidden = ic != nil;
              self.cap.text = icoCaption(self.dik); self.cap.hidden = self.cap.text == nil;
              if (ic) {
                  if (gIcoFlat) { self.backgroundColor = UIColor.clearColor; self.layer.borderWidth = gCbEdit ? (sel ? 3 : 2) : 0; }
                  self.iv.alpha = self.pressed ? 0.65 : 1.0; self.iv.transform = self.pressed ? CGAffineTransformMakeScale(0.9, 0.9) : CGAffineTransformIdentity;
              }
          }
          - (void)press:(BOOL)down {
              if (down == self.pressed) return;
              self.pressed = down; if (self.dik >= CB_LMB) p2_mouse(self.dik == CB_LMB ? 0 : 1, down ? 1 : 0); else p2_key(self.dik, down ? 1 : 0); [self look];
          }
          - (void)touchesBegan:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e { if (gCbEdit) { self.dragging = YES; cbSelCb(self); } else [self press:YES]; }
          - (void)touchesMoved:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e {
              if (!gCbEdit || !self.dragging || gCbPinch) return;
              UITouch *t = ts.anyObject; CGPoint p = [t locationInView:self.superview], q = [t previousLocationInView:self.superview];
              CGRect b = self.superview.bounds, f = self.frame; f.origin.x += p.x - q.x; f.origin.y += p.y - q.y;
              f.origin.x = MAX(0, MIN(f.origin.x, b.size.width - f.size.width)); f.origin.y = MAX(0, MIN(f.origin.y, b.size.height - f.size.height));
              self.frame = f; cbSelUpdate();
          }
          - (void)finishTouch {
              if (gCbEdit) {
                  if (!self.dragging) return;
                  self.dragging = NO; CGSize s = self.superview.bounds.size;
                  if (s.width > 1 && s.height > 1) { self.fx = (CGRectGetMidX(self.frame) - self.fw * s.width / 2) / s.width; self.fy = (CGRectGetMidY(self.frame) - self.fh * s.height / 2) / s.height; cbSave(); }
              } else [self press:NO];
          }
          - (void)touchesEnded:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e { [self finishTouch]; }
          - (void)touchesCancelled:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e { [self finishTouch]; }
          @end

          /* ---- v84: the "+" list. Translucent, same look as the settings panel, left centred; no byte values. Mouse buttons first, then the keys by group. ---- */
          @interface KeyPickerVC : UITableViewController
          @property (nonatomic, copy) void (^onPick)(int code);
          @property (nonatomic, copy) void (^onClose)(void);
          @end
          @implementation KeyPickerVC {
              NSMutableArray<NSString *> *_groups;
              NSMutableArray<NSMutableArray<NSNumber *> *> *_idx;   /* -1 left click, -2 right click, otherwise an index into kCbK */
          }
          - (instancetype)init {
              self = [super initWithStyle:UITableViewStyleInsetGrouped];
              NSMutableArray<NSNumber *> *acts = [NSMutableArray new]; for (int i = 0; i < ICO_NACT; i++) [acts addObject:@(-100 - i)];   /* icons: every game action, by name */
              _groups = [NSMutableArray arrayWithObjects:@"GAME ACTIONS", @"MOUSE", @"CAMERA", nil]; _idx = [NSMutableArray arrayWithObjects:acts, [NSMutableArray arrayWithObjects:@(-1), @(-2), nil], [NSMutableArray arrayWithObject:@(-3)], nil];
              for (int i = 0; i < CB_N; i++) {
                  NSString *g = @(kCbK[i].g).uppercaseString; NSUInteger gi = [_groups indexOfObject:g];
                  if (gi == NSNotFound) { [_groups addObject:g]; [_idx addObject:[NSMutableArray new]]; gi = _groups.count - 1; }
                  [_idx[gi] addObject:@(i)];
              }
              return self;
          }
          - (void)viewDidLoad {
              [super viewDidLoad]; self.overrideUserInterfaceStyle = UIUserInterfaceStyleDark;
              self.tableView.backgroundColor = UIColor.clearColor; self.tableView.backgroundView = nil;
              self.tableView.rowHeight = 50; self.navigationItem.title = @"Add button";
              self.navigationItem.leftBarButtonItem = [[UIBarButtonItem alloc] initWithImage:[UIImage systemImageNamed:@"xmark"] style:UIBarButtonItemStylePlain target:self action:@selector(closePicker)];
          }
          - (void)closePicker { if (self.onClose) self.onClose(); }
          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tv { return (NSInteger)_groups.count; }
          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return (NSInteger)_idx[(NSUInteger)s].count; }
          - (NSString *)tableView:(UITableView *)tv titleForHeaderInSection:(NSInteger)s { return _groups[(NSUInteger)s]; }
          - (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
              UITableViewCell *c = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:nil];
              c.backgroundColor = [UIColor colorWithWhite:1 alpha:0.035]; c.textLabel.textColor = UIColor.labelColor;
              int v = _idx[(NSUInteger)ip.section][(NSUInteger)ip.row].intValue;
              if (v <= -100) { int dk = icoActDik(-100 - v); c.textLabel.text = [NSString stringWithFormat:@"%@  ·  %@", @(kAct[-100 - v].name), cbKeyName(dk)]; c.imageView.image = icoThumb(dk); return c; }
              c.textLabel.text = v == -1 ? @"Left Click" : v == -2 ? @"Right Click" : v == -3 ? @"Right stick" : @(kCbK[v].n);
              if (v < 0) { c.imageView.image = [UIImage systemImageNamed:v == -3 ? @"gamecontroller" : @"computermouse"]; c.imageView.tintColor = [UIColor colorWithRed:0.35 green:0.68 blue:1 alpha:1]; if (v == -3 && ownHasR()) c.accessoryType = UITableViewCellAccessoryCheckmark; }
              return c;
          }
          - (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
              [tv deselectRowAtIndexPath:ip animated:YES];
              int v = _idx[(NSUInteger)ip.section][(NSUInteger)ip.row].intValue;
              if (self.onPick) self.onPick(v <= -100 ? icoActDik(-100 - v) : v == -1 ? CB_LMB : v == -2 ? CB_RMB : v == -3 ? CB_RSTICK : kCbK[v].d);
          }
          @end
