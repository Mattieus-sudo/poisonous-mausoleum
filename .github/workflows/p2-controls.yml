                  } else if (p.count >= 9 && ([p[p.count - 2] isEqualToString:@"0"] || [p[p.count - 2] isEqualToString:@"1"]) && ([p.lastObject isEqualToString:@"0"] || [p.lastObject isEqualToString:@"1"])) {
                      hidden = [p[p.count - 2] boolValue]; noBorder = [p.lastObject boolValue]; labelEnd = p.count - 2; hasStyle = YES;
                  }
