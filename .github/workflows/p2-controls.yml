                              if (leftStick) {
                                  l.contents = (__bridge id)leftStick.CGImage;
                                  l.contentsGravity = kCAGravityResizeAspect; l.contentsScale = leftStick.scale;
                                  l.backgroundColor = UIColor.clearColor.CGColor; l.borderWidth = 0;
                                  l.shadowOpacity = 0; l.shadowRadius = 0; l.shadowPath = nil;
                              }
                              /* Lstick.png replaces only the outer sprint boundary. The moving centre knob is a translucent deep-crimson disc with a soft outer shadow. */
                          }
                          if (gOwn[i].kind == 3) {
                              UIImage *rightStick = icoLoad(@"Rstick");
                              if (rightStick) {
                                  /* Rstick.png is the moving knob itself, not a static background/boundary. */
                                  kn.contents = (__bridge id)rightStick.CGImage;
                                  kn.contentsGravity = kCAGravityResizeAspect; kn.contentsScale = rightStick.scale;
                                  kn.backgroundColor = UIColor.clearColor.CGColor; kn.cornerRadius = 0;
