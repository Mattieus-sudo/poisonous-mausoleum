          + (Class)layerClass { return [CAMetalLayer class]; }
          - (void)layoutSubviews { [super layoutSubviews]; layStart(self); ownLoad(); if (ownAny()) ownShow(self); }
          static void *gSlot[10];
          static int slotFor(UITouch *t, BOOL create) {
              for (int i = 0; i < 10; i++) if (gSlot[i] == (__bridge void *)t) return i;
              if (!create) return -1;
              for (int i = 0; i < 10; i++) if (!gSlot[i]) { gSlot[i] = (__bridge void *)t; return i; }
              return -1;
          }
          - (void)feed:(NSSet<UITouch *> *)ts phase:(int)ph event:(UIEvent *)ev {
              tcInit(); ownLoad();
