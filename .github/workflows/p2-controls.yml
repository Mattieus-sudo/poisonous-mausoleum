          static void ownKnobs(void) {   /* only the two knobs: all a stick MOVE changes. Running the whole ownRefresh on every touch sample (120 a second) was main-thread work the touch never needed. */
              if (gOwnKnob2) for (int i = 0; i < gOwnN; i++) if (gOwn[i].kind == 3 && gOwnLay[i]) {
                  gOwnKnob2.opacity = gOwn[i].hidden && !gCbEdit ? 0.0f : 1.0f;
                  CGSize sz = gOwnView.bounds.size; float r = gOwn[i].w * sz.height;
                  [CATransaction begin]; [CATransaction setDisableActions:YES];
                  gOwnKnob2.position = CGPointMake(gOwn[i].x * sz.width + gKnob2X * r, gOwn[i].y * sz.height + gKnob2Y * r);
                  [CATransaction commit];
              }
              if (gOwnKnob) for (int i = 0; i < gOwnN; i++) if (gOwn[i].kind == 1 && gOwnLay[i]) {
                  CGSize sz = gOwnView.bounds.size; float r = gOwn[i].w * sz.height;
                  [CATransaction begin]; [CATransaction setDisableActions:YES];
                  gOwnKnob.position = CGPointMake(gOwn[i].x * sz.width + gKnobX * r, gOwn[i].y * sz.height + gKnobY * r);
