              static CGPoint empStart[10]; static BOOL empOn[10];
              BOOL hit = ownEditFeed(ph, s, p, self.bounds.size);
              if (ph == 0) { empOn[s] = !hit; empStart[s] = p; }
              else if (ph == 1) { if (empOn[s] && hypot(p.x - empStart[s].x, p.y - empStart[s].y) > 12) empOn[s] = NO; }
              else { if (empOn[s] && !gCbPinch && ph == 2) cbSelClear(); empOn[s] = NO; }
              if (gCbPinch) for (int q = 0; q < 10; q++) empOn[q] = NO;
