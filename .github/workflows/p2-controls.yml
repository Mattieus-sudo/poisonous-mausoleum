              sh_looper_addfd(lp, gInPipe[0], ident, 1, cb, data); gInAttached = 1;
              L("PLAT AInputQueue_attachLooper ident=%d cb=%p data=%p (touch input is live)", ident, (void *)cb, data);
          }
          static void sh_inq_detach(void *q, void *lp) {
