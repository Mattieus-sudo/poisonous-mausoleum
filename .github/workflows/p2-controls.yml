                          if (gOwn[i].kind == 1) { kn.shadowColor = [UIColor colorWithRed:0.12 green:0.0 blue:0.025 alpha:1].CGColor; kn.shadowOpacity = 0.62f; kn.shadowRadius = 7.0f; kn.shadowOffset = CGSizeMake(0, 0); kn.shadowPath = [UIBezierPath bezierPathWithOvalInRect:kn.bounds].CGPath; }
