          }
          /* v97: SWIPE CAMERA = DIRECT DRAG, always. The floating-stick swipe (v88, held a touch back, turned a swipe into a stick rate, delayed taps by 0.3 s / 60 ms) is gone: a touch in the right half goes
             straight to the game as a finger, its samples timestamped and resampled once per frame (pan_resample_locked). The fixed right stick (own controls) is unchanged. p2.cfg line swipe_classic is now the only behaviour. */
