                          CALayer *hm = [CALayer layer]; hm.name = @"hiddenMark"; UIImage *eye = [UIImage systemImageNamed:@"eye.slash"]; hm.contents = (__bridge id)eye.CGImage; hm.contentsGravity = kCAGravityResizeAspect; hm.contentsScale = eye.scale; hm.bounds = CGRectMake(0, 0, 30, 30); hm.position = CGPointMake(0, 0); hm.hidden = YES; [l addSublayer:hm];
                      } else {
