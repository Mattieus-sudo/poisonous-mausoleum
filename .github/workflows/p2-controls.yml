          static void ownStick(OwnEl *e, int mask) {   /* e->down holds the key mask: 1 W, 2 A, 4 S, 8 D, 16 Shift (the outer ring) */
              static const int dik[5] = {0x11, 0x1E, 0x1F, 0x20, 0x2A};
              for (int b = 0; b < 5; b++) { int was = (e->down >> b) & 1, now = (mask >> b) & 1; if (was != now) p2_btn_edge(dik[b], now); }
              e->down = mask;
          }
          static void ownReleaseAll(void) {
              for (int i = 0; i < gOwnN; i++) {
                  OwnEl *e = &gOwn[i];
                  if (e->kind == 0 && e->down) { e->down = 0; p2_btn_edge(e->dik, 0); }
                  else if (e->kind == 1 && e->down) ownStick(e, 0);
              }
              gKnobX = gKnobY = gKnob2X = gKnob2Y = 0; p2_rstick(0, 0); gRsFixedHeld = NO; for (int s = 0; s < 10; s++) gOwnBy[s] = 0;
          }
          static void ownSave(void) {
              camSave();
              if (!gOwnFile) return;
              NSMutableString *s = [NSMutableString stringWithString:@"# own layout (v79). Fractions of the screen. stick cx cy r (radius as a fraction of the screen HEIGHT); btn KEY x y w h LABEL (a circle inside the box, the key name is drawn in the middle); block x y w h.\n"];
              for (int i = 0; i < gOwnN; i++) {
                  OwnEl *e = &gOwn[i];
                  if (e->kind == 1) [s appendFormat:@"stick %.4f %.4f %.4f\n", e->x, e->y, e->w];
                  else if (e->kind == 3) { }   /* v88: saved in camera.txt */
                  else if (e->kind == 0) [s appendFormat:@"btn %02X %.4f %.4f %.4f %.4f %s H=%d B=%d\n", e->dik, e->x, e->y, e->w, e->h, e->label[0] ? e->label : "KEY", e->hidden, e->noBorder];
                  else [s appendFormat:@"block %.4f %.4f %.4f %.4f\n", e->x, e->y, e->w, e->h];
              }
              [s writeToFile:layPath(gOwnFile, @"own_layout.txt", YES) atomically:YES encoding:NSUTF8StringEncoding error:nil];
              p2_note("OWNLAYOUT: layout saved after a move");
          }
          static BOOL ownEditFeed(int ph, int s, CGPoint p, CGSize sz) {   /* Edit mode: a touch selects and drags the stick or button under it; nothing reaches the game. YES = the touch is on an element */
              if (!ownAny()) return NO;
              if (ph == 0) {
                  gOwnDrag[s] = 0;
                  for (int i = 0; i < gOwnN && !gOwnDrag[s]; i++) {
                      OwnEl *e = &gOwn[i];
                      if (e->kind == 0 && ownInCircle(e, p, sz)) { CGRect c = ownCircle(e, sz); gOwnDrag[s] = i + 1; gOwnOff[s] = CGPointMake(p.x - CGRectGetMidX(c), p.y - CGRectGetMidY(c)); }
                      else if ((e->kind == 1 || e->kind == 3) && hypotf(p.x - e->x * sz.width, p.y - e->y * sz.height) <= e->w * sz.height) { gOwnDrag[s] = i + 1; gOwnOff[s] = CGPointMake(p.x - e->x * sz.width, p.y - e->y * sz.height); }
                  }
                  if (gOwnDrag[s]) { cbSelOwn(gOwnDrag[s] - 1); return YES; }
                  return NO;
              }
              int k = gOwnDrag[s]; if (!k || k > gOwnN) { gOwnDrag[s] = 0; return NO; }
              if (gCbPinch) return YES;
              OwnEl *e = &gOwn[k - 1];
              if (ph == 1) {
                  float cx = (float)(p.x - gOwnOff[s].x) / sz.width, cy = (float)(p.y - gOwnOff[s].y) / sz.height;
                  if (e->kind == 1 || e->kind == 3) { e->x = MAX(0.02f, MIN(0.98f, cx)); e->y = MAX(0.02f, MIN(0.98f, cy)); }
                  else { e->x = MAX(0.0f, MIN(1.0f - e->w, cx - e->w / 2)); e->y = MAX(0.0f, MIN(1.0f - e->h, cy - e->h / 2)); }
                  ownLayoutAll(sz); cbSelUpdate();
              } else { gOwnDrag[s] = 0; ownSave(); }
              return YES;
          }
          static BOOL ownFeed(int ph, int s, CGPoint p, CGSize sz) {   /* YES = the touch is ours, the dev never sees it */
              if (ph == 0) {
                  gOwnBy[s] = 0;
                  for (int i = 0; i < gOwnN && !gOwnBy[s]; i++) {
                      OwnEl *e = &gOwn[i];
                      if (e->kind == 0 && ownInCircle(e, p, sz)) gOwnBy[s] = i + 1;
                      else if ((e->kind == 1 || e->kind == 3) && hypotf(p.x - e->x * sz.width, p.y - e->y * sz.height) <= e->w * sz.height * 1.4f) gOwnBy[s] = i + 1;
                  }
                  for (int i = 0; i < gOwnN && !gOwnBy[s]; i++) { OwnEl *e = &gOwn[i]; if (e->kind == 2 && CGRectContainsPoint(CGRectMake(e->x * sz.width, e->y * sz.height, e->w * sz.width, e->h * sz.height), p)) gOwnBy[s] = i + 1; }
              }
              int k = gOwnBy[s]; if (!k) return NO;
              OwnEl *e = &gOwn[k - 1];
              { static int n; if (n++ < 30) { char b[160]; snprintf(b, sizeof b, "OWNLAYOUT: touch phase %d slot %d consumed by element %d (%s%s)", ph, s, k - 1, e->kind == 0 ? "btn " : e->kind == 1 ? "stick" : e->kind == 3 ? "rstick" : "block", e->kind == 0 ? e->label : ""); p2_note(b); } }
              if (e->kind == 0) {
                  if (ph == 0 && !e->down) { e->down = 1; p2_btn_edge(e->dik, 1); }
                  else if (ph >= 2 && e->down) { e->down = 0; p2_btn_edge(e->dik, 0); }
              } else if (e->kind == 3) {   /* v87: right camera stick, a fixed stick: the push from its centre is the camera rate */
                  if (ph >= 2) { p2_rstick_ts(0, 0, gFeedTs); gKnob2X = gKnob2Y = 0; gRsFixedHeld = NO; }
                  else {
                      float r = e->w * sz.height, dx = (p.x - e->x * sz.width) / r, dy = (p.y - e->y * sz.height) / r, m = hypotf(dx, dy);
                      if (m > 1.0f) { dx /= m; dy /= m; }
                      gKnob2X = dx; gKnob2Y = dy; gRsFixedHeld = YES; p2_rstick_ts(dx, dy, gFeedTs);
                  }
              } else if (e->kind == 1) {
                  if (ph >= 2) { ownStick(e, 0); gKnobX = gKnobY = 0; }
                  else {
                      float r = e->w * sz.height, dx = (p.x - e->x * sz.width) / r, dy = (p.y - e->y * sz.height) / r, m = hypotf(dx, dy);
                      if (m > 1.0f) { dx /= m; dy /= m; }
                      gKnobX = dx; gKnobY = dy;
                      int dirs = (dy < -0.35f ? 1 : 0) | (dx < -0.35f ? 2 : 0) | (dy > 0.35f ? 4 : 0) | (dx > 0.35f ? 8 : 0);
                      BOOL out = m > (((e->down >> 4) & 1) ? 0.70f : 0.75f);   /* inner ring: W A S D only; past 3/4 of the radius: Shift as well (sprint). A little hysteresis so it does not flicker on the ring */
                      ownStick(e, dirs | ((out && dirs) ? 16 : 0));
                  }
              }
              if (ph >= 2) gOwnBy[s] = 0;
              if (ph == 1) { if (e->kind != 0) ownKnobs(); }   /* a move changes nothing on a button, and only the knob on a stick */
              else ownRefresh();
