                  BOOL customStick = hasLStick || hasRStick;
                  BOOL customBorder = gOwn[i].kind == 0 && !gOwn[i].noBorder && icoLoad(@"border") != nil;
                  gOwnLay[i].borderColor = sel ? UIColor.whiteColor.CGColor : edge;
                  BOOL hiddenEdit = gOwn[i].kind == 0 && gOwn[i].hidden && gCbEdit;
                  gOwnLay[i].opacity = (gOwn[i].kind != 1 && gOwn[i].hidden && !gCbEdit) ? 0.0f : 1.0f;
                  for (CALayer *sub in gOwnLay[i].sublayers) { if ([sub.name isEqualToString:@"hiddenMark"]) sub.hidden = !hiddenEdit; else if (hiddenEdit && gOwn[i].kind == 0) sub.hidden = YES; else if (gOwn[i].kind == 0) sub.hidden = NO; }
                  gOwnLay[i].borderWidth = (gOwn[i].kind == 0 && gOwn[i].noBorder) ? (sel ? 3 : 0) : (customStick || customBorder ? (sel ? 3 : 0) : (sel ? 3 : 2));
                  if (gOwn[i].kind == 0) {
                      gOwnLay[i].backgroundColor = (customBorder || (gOwn[i].hidden && sel) || gOwn[i].noBorder) ? UIColor.clearColor.CGColor : [UIColor colorWithWhite:gOwn[i].down ? 1.0 : 0.0 alpha:gOwn[i].down ? 0.45 : 0.25].CGColor;
                      gOwnLay[i].shadowOpacity = 0; gOwnLay[i].shadowRadius = 0; gOwnLay[i].shadowPath = nil;
                      icoRefreshLayer(gOwnLay[i], gOwn[i].down != 0, gCbEdit, gCbEdit && i == gSelOwn);
                      for (CALayer *sub in gOwnLay[i].sublayers) if ([sub.name isEqualToString:@"iconBorder"]) sub.hidden = gOwn[i].noBorder;   /* icons: flat look, pressed look */
