                  CALayer *l = gOwnLay[i]; if (!l) continue; OwnEl *e = &gOwn[i];
                  if (e->kind == 0) {
                      CGRect c = ownCircle(e, sz); l.frame = c; l.cornerRadius = c.size.width / 2;
                      for (CALayer *s2 in l.sublayers) if ([s2.name isEqualToString:@"label"]) s2.frame = CGRectMake(0, c.size.height / 2 - 9, c.size.width, 20);
                      icoLayoutLayer(l);   /* icons: picture and caption */
                      for (CALayer *sub in l.sublayers) if ([sub.name isEqualToString:@"hiddenMark"]) { CGFloat z = c.size.width * 0.42; sub.bounds = CGRectMake(0, 0, z, z); sub.position = CGPointMake(c.size.width / 2, c.size.height / 2); }
                  } else {
                      float r = e->w * sz.height; l.frame = CGRectMake(e->x * sz.width - r, e->y * sz.height - r, 2 * r, 2 * r); l.cornerRadius = r;
