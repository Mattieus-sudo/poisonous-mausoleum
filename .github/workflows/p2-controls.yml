name: "P2 controls source (v104 dynamic menu render space)"
# (icons and layouts hook in here: the picture code is in p2-icons.yml, the per-layout code in p2-layouts.yml; both are joined into main.m around this piece)
# CONTROLS: the touch input path in p2core.c (pan smoothing, right stick, swipe feed) and, in main.m, the own controls, the right stick and its menu, custom buttons and the add list.
# Called by build-loader.yml (uses: ./.github/workflows/p2-controls.yml). It only writes source text and uploads it; the loader joins the pieces and compiles.
on:
  workflow_call:
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - name: Write the source pieces
        run: |
          set -e
          mkdir -p parts
          cat > parts/ctl_core.c <<'EOF_CTL_CORE_C'
          #define IQ_MAX 256
          #define IQ_EDGE_RESERVE 16       /* leave room for DOWN/UP/CANCEL during a move burst */
          #define IQ_PTRS 10
          /* v100 TOUCH TIMING DIAGNOSTICS: preserve the physical UIKit timestamp and
             measure queue age + callback lifetime without changing event ordering. */
          typedef struct { int type, action, n, touch_id; int id[IQ_PTRS]; float x[IQ_PTRS], y[IQ_PTRS];
                           uint64_t trace_seq, enq_ns, deq_ns; double ui_ts; } InEv;
          static InEv gIq[IQ_MAX]; static unsigned gIqH, gIqT;
          static uint64_t gTouchTraceSeq; static unsigned gTouchTraceLines;
          #define TT_ON() (flg()->touch_trace)   /* TOUCHTRACE / BTNTRACE lines and their clock reads only run with the p2.cfg line touch_trace */
          static pthread_mutex_t gInMu = PTHREAD_MUTEX_INITIALIZER;
          static int gInPipe[2] = {-1, -1};
          static volatile int gInAttached;
          static struct { int id; float x, y; } gTp[IQ_PTRS]; static int gTn;
          /* v81: PAN SMOOTHING (default ON, p2.cfg line pan_smooth_off = raw). Moves are kept per finger with their real touch times; once per frame the game thread gets ONE move per finger,
             placed on the finger path at (now - lag), so the step per frame follows finger speed x real frame time. Down, up and cancel are never delayed. p2.cfg line pan_lag_N = fixed lag in ms. */
          typedef struct { double t; float x, y; } PSm;
          #define PH_N 16
          static PSm gPH[IQ_PTRS][PH_N]; static unsigned gPHn[IQ_PTRS];
          static struct { float x, y; } gOut[IQ_PTRS];   /* what the dev's handler last saw for each finger (only for the INPUTTAP numbers) */
          static int gPanOn = -1, gPanLagMs = -1;
          static int gMvPend, gMvArmed, gMvServed;       /* all under gInMu */
          static double gPanEma = 1.0 / 120.0;           /* measured touch sample interval, seconds */
          static double gPanT, gPanLag = 0.008, gPanPeak, gPanLastNow;   /* resample clock (never runs backwards), current lag, recent worst age of the newest sample */
          static float gItFedDx, gItFedDy;
          /* v90: MENU TOUCH state (all under gInMu). One finger owns the game's cursor while the game is in a menu; the game thread (menu_touch_tick) turns it into SetTouchMouse calls. */
          static int gMtId = -1, gMt2Id = -1, gMtWarp, gMtPressed, gMtUp, gMtMoved; static float gMtX, gMtY; static long long gMtPressAt, gMtRelAt, gMtUpAt;
          typedef struct { double t; float x, y; } RsS;   /* v97: the stick's deflection with the touch's hardware timestamp */
          #define RS_H 16
          static RsS gRsH[RS_H]; static unsigned gRsHn; static int gRsTail; static double gRsT0;   /* gRsTail: a push that was let go before the game thread saw it keeps its one last move; gRsT0: the hardware time of the touch that started the push, until its first frame */
          static float gRsX, gRsY, gRsPx, gRsPy; static int gRsStickOn, gRsDown, gRsInit, gRsSpeed = 100, gRsVert = 100, gRsInv; static double gRsLast;   /* v87 right camera stick, see rs_emit_locked */
          /* v82: PAN CLOCK. The sample time advances by the game thread's gap rounded to WHOLE SCREEN TICKS and is nudged gently toward the real clock, so drain-time wobble does not
             change the camera step; a dropped frame is still followed. p2.cfg line pan_clock_off = the v81 way. */
          static volatile double gPanTick = 1.0 / 60.0;   /* screen refresh period in seconds, set by the display setup */
          static int gPanClockOn = -1;
          static double gPanGapEma;                       /* smoothed game-thread gap (steady frames), seconds */
          static double gPanDrainLast;                    /* when the game thread last drained a resampled move (0 = new gesture) */
          static double gPsN, gPsSumGap, gPsSumGap2, gPsSumAdv, gPsSumAdv2, gPsSnaps, gPsSteerMax;   /* per-gesture numbers for the PAN log line */
          static double pan_now(void) { return (double)fx_now_ns(CLOCK_UPTIME_RAW) / 1e9; }   /* same clock as UITouch.timestamp */
          void p2_set_tick(double seconds) { if (seconds > 0.002 && seconds < 0.05) gPanTick = seconds; }   /* display setup tells the loader the refresh period */
          static void ph_push(int i, double t, float x, float y) {
              unsigned n = gPHn[i];
              if (n) { PSm *p = &gPH[i][(n - 1) % PH_N]; if (t <= p->t) t = p->t + 1e-6; double d = t - p->t; if (d > 0.002 && d < 0.05) gPanEma += (d - gPanEma) * 0.1; }
              gPH[i][n % PH_N].t = t; gPH[i][n % PH_N].x = x; gPH[i][n % PH_N].y = y; gPHn[i] = n + 1;
          }
          static int ph_at(int i, double T, float *ox, float *oy) {   /* finger i on its touch path at time T; 1 = T is at or past the newest sample (nothing left to catch up) */
              unsigned n = gPHn[i]; if (!n) { *ox = *oy = 0.0f; return 1; }
              unsigned cnt = n < PH_N ? n : PH_N; const PSm *nw = &gPH[i][(n - 1) % PH_N];
              if (T >= nw->t) { *ox = nw->x; *oy = nw->y; return 1; }
              for (unsigned k = 1; k < cnt; k++) {
                  const PSm *a = &gPH[i][(n - 1 - k) % PH_N], *b = &gPH[i][(n - k) % PH_N];
                  if (a->t <= T) { float u = (float)((T - a->t) / (b->t - a->t)); *ox = a->x + (b->x - a->x) * u; *oy = a->y + (b->y - a->y) * u; return 0; }
              }
              { const PSm *o = &gPH[i][(n - cnt) % PH_N]; *ox = o->x; *oy = o->y; }   /* T is older than everything kept */
              return 0;
          }
          static void inq_push_locked(const InEv *e) {
              InEv traced = *e;
              traced.trace_seq = ++gTouchTraceSeq;
              traced.enq_ns = TT_ON() ? (uint64_t)(pan_now() * 1000000000.0) : 0;
              /* v100: log lifecycle edges at enqueue, then again at dequeue/finish. */
              /* v99: never let a burst of MOVE samples consume the queue slot needed by UP/CANCEL.
                 Motion moves are replaceable; lifecycle edges are not. On a full queue, discard the
                 oldest queued MOVE while preserving the order of every DOWN/UP/CANCEL. If the incoming
                 event is itself a MOVE and the queue is full, drop that sample rather than an edge. */
              unsigned used = gIqT - gIqH;
              int edge = ((e->action & 0xff) != 2);
              if (!edge && used >= IQ_MAX - IQ_EDGE_RESERVE) return;
              if (used >= IQ_MAX) {
                  if (!edge) return;
                  unsigned k;
                  for (k = gIqH; k < gIqT; k++) {
                      if ((gIq[k % IQ_MAX].action & 0xff) == 2) break;
                  }
                  if (k < gIqT) {
                      for (; k + 1 < gIqT; k++) gIq[k % IQ_MAX] = gIq[(k + 1) % IQ_MAX];
                      gIqT--;
                  } else {
                      /* All queued items are lifecycle edges. Keep the queue bounded, but make
                         the overflow explicit rather than silently pretending the event was sent. */
                      static unsigned lostEdges;
                      if (lostEdges++ < 8) L("TOUCHQ: lifecycle edge queue overflow (%u pending); incoming action 0x%x seq=%llu could not be queued", used, traced.action, (unsigned long long)traced.trace_seq);
                      return;
                  }
              }
              gIq[gIqT % IQ_MAX] = traced; gIqT++;
              if (TT_ON() && (traced.action & 0xff) != 2 && gTouchTraceLines < 600) {
                  gTouchTraceLines++;
                  L("TOUCHTRACE: ENQ seq=%llu action=0x%x touch=%d n=%d ui_age_at_enq=%.2fms q=%u", (unsigned long long)traced.trace_seq, traced.action, traced.touch_id, traced.n, traced.ui_ts > 0.0 ? (pan_now() - traced.ui_ts) * 1000.0 : -1.0, gIqT - gIqH);
              }
              if (gInPipe[1] >= 0) { char c = 1; if (write(gInPipe[1], &c, 1) < 0) {} }
          }
          static void pan_arm_locked(void) { if (!gMvArmed && gInPipe[1] >= 0) { char c = 1; if (write(gInPipe[1], &c, 1) < 0) {} gMvArmed = 1; } }   /* one wake-up byte; the queue-empty path of sh_inq_get drains it */
          static void pan_flush_locked(void) {   /* a held-back move goes out at the newest raw position, ahead of whatever event is about to be queued */
              InEv e; memset(&e, 0, sizeof e); e.type = 2; e.action = 2; e.n = gTn;
              for (int i = 0; i < gTn; i++) {
                  e.id[i] = gTp[i].id; e.x[i] = gTp[i].x; e.y[i] = gTp[i].y;
                  if (gItOn && gTp[i].x > (float)p2_win_w * 0.5f) { gItFedDx += gTp[i].x - gOut[i].x; gItFedDy += gTp[i].y - gOut[i].y; }
                  gOut[i].x = gTp[i].x; gOut[i].y = gTp[i].y;
              }
              gMvPend = 0; inq_push_locked(&e);
          }
          static void inq_rearm(void) {   /* called once per presented frame: a finger still behind its newest sample gets another move next frame even if it did not move */
              if (!gInAttached) return;
              pthread_mutex_lock(&gInMu); if ((gPanOn > 0 && gMvPend) || gRsStickOn || gRsTail || gMtId >= 0 || gMtWarp) pan_arm_locked(); pthread_mutex_unlock(&gInMu);
          }
          static int pan_resample_locked(InEv *e) {   /* the one move per frame the game thread gets */
              double now = pan_now(), newest = 0.0;
              for (int i = 0; i < gTn; i++) if (gPHn[i]) { double t = gPH[i][(gPHn[i] - 1) % PH_N].t; if (t > newest) newest = t; }
              /* Lag = how old the newest sample can get when the game thread asks (touch interval plus how late UIKit hands samples over). Tracked as a slowly decaying peak,
                 moved toward in small steps so the picture does not lurch, and the sample time never goes backwards. A fixed p2.cfg line value wins. */
              double age = newest > 0.0 ? now - newest : 1.0, dtn = gPanLastNow > 0.0 ? now - gPanLastNow : 0.0; gPanLastNow = now;
              gPanPeak -= dtn * 0.002; if (age < 0.04 && age > gPanPeak) gPanPeak = age; if (gPanPeak < 0.0) gPanPeak = 0.0;
              if (gPanLagMs >= 0) gPanLag = gPanLagMs / 1000.0;
              else { double want = gPanPeak + 0.004; if (want < 0.004) want = 0.004; if (want > 0.036) want = 0.036;
                     double st = want - gPanLag; if (st > 0.002) st = 0.002; if (st < -0.0002) st = -0.0002; gPanLag += st; }
              double T = now - gPanLag;
              double dd = gPanDrainLast > 0.0 ? now - gPanDrainLast : 0.0; gPanDrainLast = now;
              if (gPanClockOn > 0 && gPanT > 0.0 && dd > 0.0 && dd < 0.25) {
                  double tk = gPanTick, use = dd;
                  if (gPanGapEma > 0.0 && fabs(dd - gPanGapEma) <= 0.6 * gPanGapEma) { gPanGapEma += (dd - gPanGapEma) * 0.2; use = gPanGapEma; }   /* steady frames: the smoothed gap, so wobble cannot flip the tick count */
                  else { gPanGapEma = gPanGapEma > 0.0 ? gPanGapEma + (dd - gPanGapEma) * 0.05 : dd; }   /* a real change (a dropped frame, a rate switch): follow the raw gap at once */
                  double nt = floor(use / tk + 0.5); if (nt < 1.0) nt = 1.0;
                  double adv = nt * tk;                       /* the gap since the last frame, in whole screen ticks */
                  double Tc = gPanT + adv, err = T - Tc;      /* err = how far the steady clock has drifted from the real one */
                  if (err > 1.5 * tk || err < -1.5 * tk) { gPsSnaps += 1.0; }   /* too far off (a long stall): take the real clock */
                  else { double st = err * 0.2, lim = tk * 0.15; if (st > lim) st = lim; if (st < -lim) st = -lim; if (st < 0 ? -st > gPsSteerMax : st > gPsSteerMax) gPsSteerMax = st < 0 ? -st : st; T = Tc + st; }
                  gPsN += 1.0; gPsSumGap += dd; gPsSumGap2 += dd * dd; gPsSumAdv += adv; gPsSumAdv2 += adv * adv;
              }
              if (gPanClockOn > 0 && newest > 0.0 && T > newest) T = newest;   /* never past the newest real sample */
              if (T < gPanT) T = gPanT; gPanT = T;
              int caught = 1;
              memset(e, 0, sizeof *e); e->type = 2; e->action = 2; e->n = gTn;
              for (int i = 0; i < gTn; i++) {
                  float px, py; if (!ph_at(i, T, &px, &py)) caught = 0;
                  e->id[i] = gTp[i].id; e->x[i] = px; e->y[i] = py;
                  if (gItOn && px > (float)p2_win_w * 0.5f) { gItFedDx += px - gOut[i].x; gItFedDy += py - gOut[i].y; }
                  gOut[i].x = px; gOut[i].y = py;
              }
              gMvPend = !caught;
              return 1;
          }
          /* v90: MENU MODE (automatic only, there is no Menu button any more), real Left Click, real Right Click, finger = cursor in menus.
             Menu mode is decided from three things the game itself exposes: its touch layout (GameScreen() -> EO_CTXTAB, layout 2 = menu), GameCursorShown() (the game is showing its mouse
             cursor, which is what the settings and pause screens do even when the layout table still says gameplay) and GamePauseMenuOpen(). Any one of them = menu.
             In menu mode the loader does NOT hand touches to the dev's touch handler (that handler only warps the cursor in its own menu layout, which is why direct touches failed on
             screens outside it). It drives the game's own cursor setter SetTouchMouse(x, y, leftHeld) (elf+0x5a69d70, the call the stick and Left Click already use) from the finger: DOWN warps the
             cursor under the finger (finger scaled to the game's client size), the left button goes down 50 ms later, every MOVE drags the cursor with the button held (sliders, scroll bars),
             and the button comes up 80 ms after the finger lifts, the same timing the game's own menu touch code uses. The stick moves the same cursor.
             Right Click: the game keeps its mouse in a ring of {type, value, ms} entries (SetTouchMouse writes type 0 = X, 4 = Y, 0xC = button 0 with value 0x80 down / 0 up, i.e. DirectInput
             offsets), so button 1 is type 0xD. p2_mouse writes that entry itself under the game's mouse mutex and posts WM_RBUTTONDOWN / UP.
             p2.cfg lines: menu_auto_off (never menu mode), menu_force (always menu mode), menu_cursor_off (do not use GameCursorShown / GamePauseMenuOpen, layout only), menu_speed_N (stick, percent of
             the screen width per second at full push, default 90). Elf offsets are 1.0.7 only and are guarded by p2_layout_ok(). */
          #define EO_SETTOUCHMOUSE 0x5a69d70UL   /* _Z13SetTouchMouseiib (int x, int y, bool left) */
          #define EO_POSTMOUSEMSG  0x5abc320UL   /* _Z16PostMouseMessagejjii (msg, wParam, x, y): the queue entry is {hwnd, msg, wParam, x | y << 16} */
          #define EO_GAMESCREEN    0x5a80f70UL   /* _Z10GameScreenv */
          #define EO_GAMEINVEH     0x5a80f60UL   /* _Z13GameInVehiclev */
          #define EO_GUESTWIN      0x5abcfe0UL   /* _Z15GuestMainWindowv */
          #define EO_GUESTWINSIZE  0x5abbb20UL   /* _Z15GuestWindowSizejPiS_ (hwnd, int *w, int *h) */
          #define EO_CTXTAB        0x647910UL    /* int[5]: GameScreen() -> touch layout (rodata) */
          #define EO_CURSX         0x5e41c84UL   /* the game's cursor x, client pixels (int) */
          #define EO_CURSY         0x5e41c88UL   /* cursor y */
          #define EO_BTNST         0x5e41ca4UL   /* byte, bit 0 = left button held */
          #define EO_CURSORSHOWN   0x5abcef0UL   /* _Z15GameCursorShownv (the game's own TouchCursor reads it for its arrow) */
          #define EO_PAUSEOPEN     0x5a80f50UL   /* _Z17GamePauseMenuOpenv */
          #define EO_MOUSEMU       0x5e41340UL   /* the game's mouse std::mutex (SetTouchMouse takes it around its ring writes) */
          #define EO_MOUSERING     0x5e41ca8UL   /* 256 entries of {u32 type, u32 value, u32 ms} */
          #define EO_MOUSERINGIDX  0x5e428a8UL   /* u32 write index (entry = idx & 0xff) */
          #define EO_NOWNS         0x5a7b440UL   /* _Z5NowNsv: the game's own clock (ARM counter = CLOCK_UPTIME_RAW; it does NOT count device sleep) */
          #define EO_POSTRAWBTN    0x5ac36a0UL   /* _Z18PostRawMouseButtonib (button, down): the dev's own left click calls it right after writing its ring entry */
          int p2_layout_ok(void);
          static int gMenuInit, gMenuAutoOff, gMenuForce, gMenuCurOff, gMenuAuto, gMcSpeed = 90, gCliW = 1616, gCliH = 728, gCliReal;
          static long long gMenuAt, gCliAt;
          static double gMcDx, gMcDy;   /* pixels the stick still owes the cursor (client space), under gInMu */
          static volatile float gTvW, gTvH;   /* v91: the REAL size of the touch view in pixels (bounds x nativeScale), set by the UI thread from every touch. p2_win_w/h is a hardcoded 2556x1179 and is only right on that one phone. */
          void p2_touch_view(float w, float h) { if (w > 16.0f && h > 16.0f) { gTvW = w; gTvH = h; } }
          static volatile int gCtxId = -1;   /* layouts: the touch layout the game is in (0 foot, 1 vehicle, 2 menu, 3 and up = the dev's other layouts), -1 = not read yet */
          static int menu_poll(void) {   /* 1 = the game is in a menu */
              unsigned scr = ((unsigned (*)(void))(gBase + EO_GAMESCREEN))();
              unsigned long veh = ((unsigned long (*)(void))(gBase + EO_GAMEINVEH))() & 1UL;
              int ctx = 0;
              if (scr == 0 && veh) ctx = 1;
              else { uint32_t v = 0; if (!safe_rd(gBase + EO_CTXTAB + 4UL * (scr > 4 ? 0 : scr), &v, 4)) return 0; ctx = (int)v; }
              int cur = 0, pau = 0;
              if (!gMenuCurOff) {
                  cur = (int)(((unsigned long (*)(void))(gBase + EO_CURSORSHOWN))() & 1UL);
                  pau = (int)(((unsigned long (*)(void))(gBase + EO_PAUSEOPEN))() & 1UL);
              }
              int menu = ctx == 2 || cur || pau;
              gCtxId = menu ? 2 : ctx;
              { static unsigned lastScr = 0xffffffffu; static int lastCtx = -9, lastCur = -9, lastPau = -9, n;
                if ((scr != lastScr || ctx != lastCtx || cur != lastCur || pau != lastPau) && n++ < 120) L("MENU: game screen %u, in vehicle %d -> touch layout %d, cursor shown %d, pause menu %d => %s", scr, (int)veh, ctx, cur, pau, menu ? "MENU (finger moves the cursor, stick moves the cursor)" : "gameplay");
                lastScr = scr; lastCtx = ctx; lastCur = cur; lastPau = pau; }
              return menu;
          }
          int p2_menu_on(void) {   /* any thread; the answer is at most 40 ms old */
              if (!gMenuInit && gDocs[0]) {
                  gMenuInit = 1; gMenuAutoOff = sw_has("menu_auto_off"); gMenuForce = sw_has("menu_force"); gMenuCurOff = sw_has("menu_cursor_off");
                  int v = sw_val("menu_speed_"); if (v >= 10 && v <= 400) gMcSpeed = v;
                  L("MENU: automatic detection %s (p2.cfg line menu_auto_off = never), forced %s (p2.cfg line menu_force), cursor/pause signals %s (p2.cfg line menu_cursor_off = layout only), stick cursor %d percent of the screen width per second (p2.cfg line menu_speed_N)", gMenuAutoOff ? "off" : "ON", gMenuForce ? "ON" : "off", gMenuCurOff ? "off" : "ON", gMcSpeed);
              }
              if (gMenuForce) return 1;
              if (gMenuAutoOff || !gBase || !p2_layout_ok()) return 0;
              long long now = fx_now_ns(CLOCK_UPTIME_RAW);
              if (now - gMenuAt > 40000000LL) { gMenuAt = now; gMenuAuto = menu_poll(); }
              return gMenuAuto;
          }
          int p2_ctx(void) { int m = p2_menu_on(); return m ? 2 : (gCtxId < 0 ? 0 : gCtxId); }   /* layouts: any thread, same 40 ms freshness as p2_menu_on */
          int p2_ctx_known(void) {   /* 1 once the game's layout has really been read (or menu detection is forced / off); layouts: do not show a guessed "on foot" before that */
              if (gMenuForce || gMenuAutoOff) return 1;
              if (!gBase || !p2_layout_ok()) return 0;
              p2_menu_on();
              return gCtxId >= 0;
          }
          static int cur_rd(int *x, int *y, int *left) {   /* the game's cursor and left-button state, 0 = unreadable */
              int a = 0, b = 0; uint8_t bt = 0;
              if (!safe_rd(gBase + EO_CURSX, &a, 4) || !safe_rd(gBase + EO_CURSY, &b, 4) || !safe_rd(gBase + EO_BTNST, &bt, 1)) return 0;
              *x = a; *y = b; *left = bt & 1; return 1;
          }
          void p2_btn_edge(int ch, int down);
          static void p2_mouse_now(int button, int down) {   /* UI thread: the Left Click / Right Click buttons. 0 = left, 1 = right */
              int x = 0, y = 0, l = 0; static int nbad, nl, nr;
              if (!gBase || !p2_layout_ok() || !cur_rd(&x, &y, &l)) { if (nbad++ < 20) L("OWNMOUSE: %s %s NOT sent (layout not confirmed or the cursor cannot be read)", button ? "right" : "left", down ? "down" : "up"); return; }
              if (button == 0) {
                  ((void (*)(int, int, unsigned char))(gBase + EO_SETTOUCHMOUSE))(x, y, down ? 1 : 0);
                  int x2 = 0, y2 = 0, l2 = 0; cur_rd(&x2, &y2, &l2);
                  if (nl++ < 60) L("OWNMOUSE: left %s at the cursor %d,%d via SetTouchMouse -> the game's button state is now %d (was %d): %s", down ? "down" : "up", x, y, l2, l, l2 == (down ? 1 : 0) ? "registered" : "NOT registered");
              } else {
                  /* v90: the same ring entry SetTouchMouse writes for button 0, with the DirectInput offset of button 1 (0xD). Under the game's own mouse mutex so the index cannot race SetTouchMouse. */
                  uint32_t i0 = 0; uint8_t *mu = (uint8_t *)(gBase + EO_MOUSEMU); volatile uint32_t *ip = (volatile uint32_t *)(gBase + EO_MOUSERINGIDX);
                  if (!safe_rd(gBase + EO_MOUSERINGIDX, &i0, 4)) { if (nbad++ < 20) L("OWNMOUSE: right %s NOT sent (the mouse ring index cannot be read)", down ? "down" : "up"); return; }
                  sh_mx_lock(mu);
                  uint32_t i1 = *ip; volatile uint32_t *e = (volatile uint32_t *)(gBase + EO_MOUSERING + (uint64_t)(i1 & 0xffu) * 12u);
                  *(volatile uint8_t *)(gBase + EO_BTNST + 1) = down ? 1 : 0;   /* v92: THE FIX. The game polls GetDeviceState, which builds the buttons from the bytes Input()+0x964 (left), +0x965 (right), +0x966 (middle) = elf 0x5e41ca4/5/6, never from the ring. The dev's own button function (elf 0x5a69c30) writes the ring entry AND this byte; v90/v91 wrote only the ring, so the game never saw Right Click. */
                  e[0] = 0xD; e[1] = down ? 0x80u : 0u; e[2] = (uint32_t)(((unsigned long long (*)(void))(gBase + EO_NOWNS))() / 1000000ULL);   /* v91: the game's own NowNs, exactly what SetTouchMouse stamps its entries with. v90 used CLOCK_MONOTONIC, which on iOS includes sleep time, so the entry could be hours away from the game's clock and be dropped. */
                  __atomic_store_n(ip, i1 + 1u, __ATOMIC_RELEASE);
                  sh_mx_unlock(mu);
                  ((void (*)(unsigned, unsigned, int, int))(gBase + EO_POSTMOUSEMSG))(down ? 0x204u : 0x205u, down ? 2u : 0u, x, y);   /* WM_RBUTTONDOWN / UP */
