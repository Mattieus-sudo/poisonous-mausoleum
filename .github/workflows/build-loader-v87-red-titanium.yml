          /* ===== v86: native Liquid Glass. UIGlassEffect and the glass button configurations are iOS 26 APIs; they are looked up at runtime so the build compiles on any SDK
             and iOS 15 to 25 keep the previous dark blur / filled look. ===== */
          static BOOL p2HasGlass(void) { return NSClassFromString(@"UIGlassEffect") != nil; }
          static UIVisualEffect *p2GlassEffect(void) {
              Class gc = NSClassFromString(@"UIGlassEffect"); SEL sel = NSSelectorFromString(@"effectWithStyle:");
              if (gc) {
                  id e = nil;
                  if ([gc respondsToSelector:sel]) e = ((id (*)(Class, SEL, NSInteger))objc_msgSend)(gc, sel, 0);   /* 0 = regular glass */
                  else e = [[gc alloc] init];
                  if ([e isKindOfClass:UIVisualEffect.class]) return e;
              }
              return [UIBlurEffect effectWithStyle:UIBlurEffectStyleSystemMaterialDark];
          }
          static void p2StyleGlassView(UIVisualEffectView *v, CGFloat radius) {
              v.clipsToBounds = YES; v.layer.cornerRadius = radius; v.layer.cornerCurve = kCACornerCurveContinuous;v.layer.borderWidth = 1.0;
              v.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.24].CGColor;
              v.contentView.backgroundColor = [UIColor colorWithWhite:0 alpha:0.07];
              v.layer.shadowColor = [UIColor colorWithWhite:1 alpha:0.18].CGColor;
              v.layer.shadowOpacity = 0.22; v.layer.shadowRadius = 14; v.layer.shadowOffset = CGSizeMake(0, 2);
              /* A narrow specular edge keeps the panel reading as glass, not frost. */
              CALayer *edgeGlint = [CALayer layer]; edgeGlint.name = @"p2-glass-edge-glint";
              edgeGlint.frame = CGRectMake(1, 1, MAX(0, v.bounds.size.width - 2), 1);
              edgeGlint.backgroundColor = [UIColor colorWithWhite:1 alpha:0.24].CGColor;
               [v.layer addSublayer:edgeGlint];
          }
          static UIButtonConfiguration *p2GlassButtonConfig(BOOL prominent) {   /* nil below iOS 26 */
              SEL sel = NSSelectorFromString(prominent ? @"prominentGlassButtonConfiguration" : @"glassButtonConfiguration");
              if (![UIButtonConfiguration respondsToSelector:sel]) return nil;
              return ((UIButtonConfiguration *(*)(Class, SEL))objc_msgSend)(UIButtonConfiguration.class, sel);
          }
          static void p2GlassCircleButton(UIButton *b, CGFloat fgAlpha, UIColor *fallbackBg) {   /* b already has its image set */
              UIButtonConfiguration *cf = p2GlassButtonConfig(NO);
              if (cf) {
                  cf.image = [b imageForState:UIControlStateNormal]; cf.baseForegroundColor = [UIColor colorWithWhite:1 alpha:fgAlpha];
                  cf.cornerStyle = UIButtonConfigurationCornerStyleCapsule; cf.contentInsets = NSDirectionalEdgeInsetsMake(0, 0, 0, 0);
                  b.configuration = cf; b.backgroundColor = UIColor.clearColor;
