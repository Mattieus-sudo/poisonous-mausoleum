name: "Build loader v87 (Madeira-style right camera stick)"
# PRIVATE REPOS ONLY. The IPA artifact contains the patched game code. Delete the artifact after downloading.
# Pushes run the download/disassembly/prep inspection. A full IPA build requires manual dispatch with inspect_only=false.
on:
  push:
    branches:
      - chatgpt
    paths:
      - .github/workflows/build-loader-v84.yml
  workflow_dispatch:
    inputs:
      apk_url:
        description: Drive share link to the target APK (libp2re.so SHA-256 is checked)
        default: https://drive.google.com/file/d/1fRUv76Ykc6-sKM-qR2VDfQZgO9b8C1Sl/view?usp=share_link
      disasm_ranges:
        description: "Disassemble the UNTOUCHED libp2re.so for these elf ranges, space separated START-STOP in hex (printed in the job log, uploaded as artifact p2-disasm)"
        default: "0x10c0520-0x10c24a0 0x5a95900-0x5a95b00 0x5b11380-0x5b11a00"
      skip_build:
        description: "Skip the macOS IPA build (inspection only)"
        type: boolean
        default: false
      inspect_only:
        description: "Run download, disassembly and prep.py against the new APK, but DO NOT compile or package an IPA"
        type: boolean
        default: true
      icon_url:
        description: "Optional: Drive share link or direct URL of a square PNG for the app icon. Empty = p2-icon.png in the repo root, else the best launcher PNG found inside the APK"
        default: ""
jobs:
  build:
    if: ${{ !inputs.skip_build }}
    runs-on: macos-latest
    steps:
      - name: Download APK and extract libp2re.so
        env:
          APK_URL: ${{ inputs.apk_url || 'https://drive.google.com/file/d/1fRUv76Ykc6-sKM-qR2VDfQZgO9b8C1Sl/view?usp=share_link' }}
        run: |
          set -e
          python3 -m venv .venv && . .venv/bin/activate && pip install -q gdown numpy
          ID=$(echo "$APK_URL" | sed -E 's#.*/d/([^/]+).*#\1#')
          gdown "https://drive.google.com/uc?id=$ID" -O game.apk
          unzip -tq game.apk >/dev/null || { echo "not a zip, first bytes:"; head -c 400 game.apk; exit 1; }
          mkdir -p work && unzip -o -j game.apk lib/arm64-v8a/libp2re.so -d work
          SHA=$(shasum -a 256 work/libp2re.so | cut -d' ' -f1)
          echo "libp2re sha256 $SHA"
          if [ "$SHA" != "767b1552fc3c965d9dada8e0dd1528f2f018aa5263dd232b7ddc8710f35b9a16" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.inspect_only }}" = "false" ]; then
              echo "libp2re.so SHA-256 mismatch for target APK, stopping (IPA build needs the pinned APK)"; exit 1
            fi
            echo "NOTE: libp2re.so SHA-256 differs from the pinned one. Inspect-only run: continuing so prep.py can report on this APK."
          fi
      - name: Disassemble requested ranges of the untouched libp2re.so
        env:
          RANGES: ${{ inputs.disasm_ranges || '0x10c0520-0x10c24a0 0x5a95900-0x5a95b00 0x5b11380-0x5b11a00' }}
        run: |
          mkdir -p disasm
          OBJ="$(xcrun -f llvm-objdump 2>/dev/null || command -v llvm-objdump || true)"
          echo "objdump: ${OBJ:-NOT FOUND}"
          if [ -z "$OBJ" ]; then echo "no llvm-objdump on this runner" > disasm/disasm.txt; exit 0; fi
          for R in $RANGES; do
            A="${R%-*}"; B="${R#*-}"
            echo "=== elf range $A - $B ===" | tee -a disasm/disasm.txt
            "$OBJ" -d --no-show-raw-insn --start-address="$A" --stop-address="$B" work/libp2re.so 2>&1 | grep -v '^$' | tee -a disasm/disasm.txt || true
          done
          echo "NOTE: the library is not patched here; patched builds differ only in the guest-base immediates (0x2000000000 -> 0x7800000000) and the 613 tpidr_el0 stubs." >> disasm/disasm.txt
        continue-on-error: true
      - name: Dump exported guest function symbols (dynamic symbol table; stripped .symtab is absent)
        run: |
          mkdir -p disasm
          NM="$(xcrun -f llvm-nm 2>/dev/null || command -v llvm-nm || true)"
          if [ -z "$NM" ]; then echo "no llvm-nm" > disasm/guest-syms.txt; exit 0; fi
          # The game library is stripped: use .dynsym, not objdump -t / .symtab.
          # -S emits symbol sizes; -n sorts by address; keep mangled names intact.
          "$NM" -D --defined-only -S -n work/libp2re.so 2>disasm/guest-syms.err |
            awk 'NF >= 4 && $1 ~ /^[[:xdigit:]]+$/ && $2 ~ /^[[:xdigit:]]+$/ { print $1, $2, $4 }' |
            sort -k1,1 > disasm/guest-syms.txt
          echo "defined dynamic function symbols: $(wc -l < disasm/guest-syms.txt)  (columns: address size name, hex, sorted by address)"
          if [ -s disasm/guest-syms.err ]; then
            echo "llvm-nm diagnostics:"; head -n 10 disasm/guest-syms.err
          fi
          head -n 10 disasm/guest-syms.txt
        continue-on-error: true
      - name: Upload disassembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-disasm
          path: disasm/
          if-no-files-found: ignore
      - name: Patch guest base and split into build inputs
        run: |
          set -e
          . .venv/bin/activate
          mkdir -p src
          cd src
          cat > prep.py <<'EOF_PREP_PY'
          #!/usr/bin/env python3
          """v11. Patch guest base in a COPY of libp2re.so, split it into iOS build inputs, report. Usage: prep.py libp2re.so outdir"""
          import sys, struct, os
          import numpy as np

          SRC, OUT = sys.argv[1], sys.argv[2]
          os.makedirs(OUT, exist_ok=True)
          OLD, NEW, M64 = 0x2000000000, 0x7800000000, (1 << 64) - 1
          OLD_IMMR, OLD_IMMS, NEW_IMMR, NEW_IMMS = 27, 0, 29, 3
          OLD16, NEW16 = 0x20, 0x78
          EXPECT = {"orr": 1906130, "movk": 58657, "movz": 303}   # observed in the 1.0.7 libp2re.so (sha 767b1552...)
          PG = 0x4000
          R = []
          def rep(s=""):
              print(s); R.append(s)

          def decode_bitmask(N, imms, immr):
              x = (N << 6) | ((~imms) & 0x3F)
              ln = x.bit_length() - 1
              assert ln >= 1
              esize = 1 << ln; lv = esize - 1
              S, Rr = imms & lv, immr & lv
              w = (1 << (S + 1)) - 1
              w = ((w >> Rr) | (w << (esize - Rr))) & ((1 << esize) - 1)
              v = 0
              for i in range(0, 64, esize): v |= w << i
              return v & M64
          assert decode_bitmask(1, OLD_IMMS, OLD_IMMR) == OLD
          assert decode_bitmask(1, NEW_IMMS, NEW_IMMR) == NEW

          import re, bisect, subprocess
          from concurrent.futures import ThreadPoolExecutor

          # ---- v8: thread-pointer (TPIDR_EL0) canary caves ----
          CANARY = 0x2A7F3C91B5D8E600          # constant stack-protector value (low byte 0, like a normal canary)
          INS_RE = re.compile(r"^\s*([0-9a-f]+):\s+([0-9a-f]{8})\s+(\S+)\s*(.*?)\s*(?://.*)?$")

          def parse_dis(text):
              out = []
              for l in text.splitlines():
                  m = INS_RE.match(l)
                  if m: out.append((int(m.group(1), 16), int(m.group(2), 16), m.group(3), m.group(4)))
              return out

          MEM_RE = re.compile(r"^(?P<pre>[^\[]*)\[(?P<addr>[^\]]*)\](?P<post>.*)$")
          LOADS = ("ldr", "ldp", "ldur", "ldrb", "ldrh", "ldrsw", "ldrsb", "ldrsh", "ldpsw", "ldar", "ldapr")
          STORES = ("str", "stp", "stur")

          PUREDEF = {"mov", "movz", "movn", "csel", "csinc", "csinv", "csneg", "cset", "csetm", "cinc", "cinv", "cneg", "ubfx", "sbfx",
                     "ubfm", "sbfm", "ubfiz", "sbfiz", "lsl", "lsr", "asr", "ror", "add", "sub", "adds", "subs", "orr", "and", "ands", "eor",
                     "bic", "orn", "eon", "mul", "madd", "msub", "mneg", "udiv", "sdiv", "neg", "mvn", "adrp", "adr", "sxtw", "sxtb", "sxth",
                     "uxtb", "uxth", "clz", "cls", "rbit", "rev", "rev16", "rev32", "umulh", "smulh", "umull", "smull", "umaddl", "smaddl"}

          def _classify(mn, ops, r):
              """How does this instruction treat register r (which holds the canary-block pointer)? None = does not mention r.
              ("kind", name) = safe use, ("kill",) = r overwritten / dead, ("copy", Y) = r copied into xY, ("bad",) = unsafe/unknown."""
              rx = re.compile(r"(?<![0-9A-Za-z_])[xw]%d(?![0-9])" % r)
              rxx = re.compile(r"(?<![0-9A-Za-z_])x%d(?![0-9])" % r)
              if not rx.search(ops): return None
              if mn == "mrs" and re.match(r"^x%d, TPIDR_EL0$" % r, ops, re.I): return ("kill",)
              m = MEM_RE.match(ops)
              if m:
                  pre, addr, post = m.group("pre"), m.group("addr"), m.group("post").strip()
                  if rx.search(addr):
                      base = re.match(r"^x%d(?:, (.*))?$" % r, addr)
                      off = base.group(1) if base else None
                      if post or not base or not off: return ("bad",)
                      if off == "#0x28" and mn == "ldr":
                          t = re.match(r"^x(\d+),", pre)
                          return ("kill", "canary") if t and int(t.group(1)) == r else ("kind", "canary")
                      if re.match(r"^[xw]\d+(, (lsl|sxtw|uxtw|sxtx)( #\d+)?)?$", off):
                          return ("kill", "tls-regoffset") if mn in LOADS and rx.search(pre) else ("kind", "tls-regoffset")   # ldr x8,[x8,x0] overwrites x8
                      return ("bad",)
                  if mn in LOADS and rx.search(pre): return ("kill",)                              # reloaded / overwritten: dead
                  if mn in STORES and rxx.search(pre) and not re.search(r"(?<![0-9A-Za-z_])w%d(?![0-9])" % r, pre): return ("kind", "spill")
                  return ("bad",)
              if mn == "add" and re.match(r"^x\d+, x%d, x\d+(, (lsl|uxtx|sxtx)( #\d+)?)?$" % r, ops):
                  return ("kill", "tls-add") if re.match(r"^x%d," % r, ops) else ("kind", "tls-add")           # xN,xN,xM: now a thread-memory pointer
              c = re.match(r"^x(\d+), x%d$" % r, ops)
              if mn == "mov" and c and int(c.group(1)) != 31: return ("copy", int(c.group(1)))
              first = re.match(r"^[xw]%d, (.*)$" % r, ops)
              if mn in PUREDEF and first and not rx.search(first.group(1)): return ("kill",)         # write-only first operand: xN dead here
              return ("bad",)

          def tp_scan(ins, site, n):
              """Follow the block pointer in xN (and registers it is copied into) after the mrs at `site`.
              Returns (ok, why): why = comma-joined kinds when ok, else the offending instruction text."""
              live, kinds = {n}, set()
              for a, w, mn, ops in ins:
                  if a <= site: continue
                  if not live: break
                  for r in sorted(live):
                      c = _classify(mn, ops, r)
                      if c is None: continue
                      if c[0] == "bad": return False, f"{mn} {ops} @0x{a:x}"
                      if c[0] == "kill":
                          live.discard(r)
                          if len(c) > 1: kinds.add(c[1])
                      elif c[0] == "copy": live.add(c[1]); kinds.add("copy")
                      else: kinds.add(c[1])
              return True, ",".join(sorted(kinds)) or "no other use"

          def ctx_lines(ins, site, upto, limit=8):
              seq = [f"{a:x}: {mn} {ops}" for a, w, mn, ops in ins if site <= a <= upto + 8]
              return seq if len(seq) <= limit else seq[:3] + ["..."] + seq[-(limit - 4):]

          # ---- function bounds from .eh_frame FDEs (covers unexported functions too) ----
          def eh_ranges(data, off, size, addr):
              import struct
              def uleb(p):
                  v = s = 0
                  while True:
                      b = data[p]; p += 1; v |= (b & 0x7F) << s; s += 7
                      if not b & 0x80: return v, p
              def rd(p, enc, field_va):
                  f = enc & 0x0F; sz = {0x0: 8, 0x2: 2, 0x3: 4, 0x4: 8, 0xb: 4, 0xc: 8, 0xa: 2}.get(f)
                  if sz is None: raise ValueError(f"fde enc 0x{enc:x}")
                  v = int.from_bytes(data[p:p + sz], "little", signed=f in (0xb, 0xc, 0xa))
                  if enc & 0x70 == 0x10: v += field_va
                  return v, p + sz, sz
              out, cies, p, end = [], {}, off, off + size
              while p + 4 <= end:
                  ln = struct.unpack_from("<I", data, p)[0]
                  if ln == 0: break
                  hdr = 4
                  if ln == 0xFFFFFFFF: ln = struct.unpack_from("<Q", data, p + 4)[0]; hdr = 12
                  body = p + hdr; cid = struct.unpack_from("<I", data, body)[0]
                  if cid == 0:
                      ver = data[body + 4]; q = data.index(b"\0", body + 5); aug = bytes(data[body + 5:q]).decode("latin1"); q += 1
                      _, q = uleb(q); _, q = uleb(q)                                   # code align, data align (sleb: same byte walk)
                      q += 1 if ver == 1 else 0
                      if ver != 1: _, q = uleb(q)
                      enc = 0
                      if aug.startswith("z"):
                          alen, q = uleb(q); q0 = q
                          for ch in aug[1:]:
                              if ch == "R": enc = data[q]; q += 1
                              elif ch == "L": q += 1
                              elif ch == "P":
                                  pe = data[q]; q += 1; q += {0x0: 8, 0x2: 2, 0x3: 4, 0x4: 8, 0xb: 4, 0xc: 8, 0xa: 2}.get(pe & 0x0F, 8)
                      cies[p] = enc
                  else:
                      cp = body - cid
                      if cp in cies:
                          e = cies[cp]
                          try:
                              pc, q, _ = rd(body + 4, e, addr + (body + 4 - off))
                              rg, q, _ = rd(q, e & 0x0F, 0)
                              if rg > 0: out.append((pc & ((1 << 64) - 1), (pc + rg) & ((1 << 64) - 1)))
                          except ValueError: pass
                  p = body + ln
              return out

          def plan_tpidr(sites, fn_ranges, obj, elf, workers=4):
              """sites: [(va, n)]. fn_ranges: sorted [(lo, hi)]. Returns (accepted [(va,n)], refused [(va,n,why)])."""
              starts = [r[0] for r in fn_ranges]
              groups, refused = {}, []
              for va, n in sites:
                  k = bisect.bisect_right(starts, va) - 1
                  while k >= 0 and k > bisect.bisect_right(starts, va) - 6 and va >= fn_ranges[k][1]: k -= 1   # overlapping/nested ranges
                  if k < 0 or va >= fn_ranges[k][1]: refused.append((va, n, "no function bounds (neither FDE nor sized symbol)")); continue
                  groups.setdefault(fn_ranges[k], []).append((va, n))
              if not obj:
                  return [], refused + [(va, n, "no disassembler") for g in groups.values() for va, n in g], {}, {}
              def work(item):
                  (lo, hi), ss = item
                  try:
                      o = subprocess.run([obj, "-d", f"--start-address=0x{lo:x}", f"--stop-address=0x{hi:x}", elf],
                                         capture_output=True, text=True, timeout=300).stdout
                      ins = parse_dis(o)
                  except Exception as e:
                      return [(va, n, False, f"objdump failed: {e}", None) for va, n in ss]
                  if not ins: return [(va, n, False, "empty disassembly", None) for va, n in ss]
                  out = []
                  for va, n in ss:
                      ok, why = tp_scan(ins, va, n)
                      cx = None
                      if not ok and "@0x" in why: cx = ctx_lines(ins, va, int(why.rsplit("@0x", 1)[1], 16))
                      out.append((va, n, ok, why, cx))
                  return out
              accepted, kinds, ctxs = [], {}, {}
              with ThreadPoolExecutor(max_workers=workers) as ex:
                  for res in ex.map(work, list(groups.items())):
                      for va, n, ok, why, cx in res:
                          if ok: accepted.append((va, n)); kinds[va] = why
                          else: refused.append((va, n, why)); ctxs[va] = cx
              return sorted(accepted), sorted(refused), kinds, ctxs

          def enc_adrp(rd, pc, target):
              imm = ((target & ~0xFFF) - (pc & ~0xFFF)) >> 12
              assert -(1 << 20) <= imm < (1 << 20)
              imm &= 0x1FFFFF
              return 0x90000000 | ((imm & 3) << 29) | ((imm >> 2) << 5) | rd

          def build_tpidr_caves(accepted, cave_end, text_page_end):
              """Put per-site TPIDR stubs in a dedicated RX prefix page before _p2_code_start.
              The canary block stays in the original guest text-page tail, preserving the ELF data offset.
              Returns (negative stub base, stubs_bytes, blk_va, block_bytes, [(site, n, stub_va)]).
              """
              import struct
              prefix_size = 0x4000
              base = -prefix_size
              blk = (cave_end + 15) & ~15
              assert blk + 0x40 <= text_page_end, f"TPIDR canary block does not fit: need up to 0x{blk+0x40:x}, page ends 0x{text_page_end:x}"
              assert 16 * len(accepted) <= prefix_size, f"TPIDR stubs exceed prefix page: need 0x{16*len(accepted):x}, have 0x{prefix_size:x}"
              stubs, where = bytearray(), []
              for k, (va, n) in enumerate(accepted):
                  c = base + 16 * k
                  stubs += struct.pack("<IIII", enc_adrp(n, c, blk), 0x91000000 | ((blk & 0xFFF) << 10) | (n << 5) | n,
                                       0x14000000 | ((((va + 4) - (c + 8)) // 4) & 0x3FFFFFF), 0xD503201F)
                  where.append((va, n, c))
              block = bytearray(0x40); struct.pack_into("<Q", block, 0x28, CANARY)
              return base, bytes(stubs), blk, bytes(block), where

          canary_blk, canary_val = 0, 0

          data = bytearray(open(SRC, "rb").read())
          assert data[:4] == b"\x7fELF" and data[4] == 2
          (e_type, e_machine, _, _, e_phoff, e_shoff, _, _, e_phentsize, e_phnum, e_shentsize, e_shnum, e_shstrndx) = \
              struct.unpack_from("<HHIQQQIHHHHHH", data, 16)
          ARM = (e_machine == 183)
          rep(f"# prep report\n\ninput {len(data)} bytes, e_machine={e_machine}" + ("" if ARM else "  **TEST MODE (not aarch64): no patching, no layout asserts**"))

          loads = []
          tls = None
          for i in range(e_phnum):
              p_type, p_flags, p_off, p_va, _, p_fsz, p_msz, p_al = struct.unpack_from("<IIQQQQQQ", data, e_phoff + i * e_phentsize)
              if p_type == 1: loads.append(dict(flags=p_flags, off=p_off, va=p_va, fsz=p_fsz, msz=p_msz))
              elif p_type == 7: tls = dict(off=p_off, fsz=p_fsz, msz=p_msz, al=p_al)
          secs = {}
          shs = [struct.unpack_from("<IIQQQQIIQQ", data, e_shoff + i * e_shentsize) for i in range(e_shnum)]
          strtab = shs[e_shstrndx]
          def cstr(base, o):
              a = base + o
              return bytes(data[a:data.index(b"\0", a)]).decode("latin1")
          secl = []
          for (nm, ty, fl, ad, of, sz, lk, inf, al, es) in shs:
              n = cstr(strtab[4], nm)
              secs[n] = dict(name=n, type=ty, addr=ad, off=of, size=sz)
              secl.append(secs[n])
          def v2o(va):
              for l in loads:
                  if l["va"] <= va < l["va"] + l["fsz"]: return l["off"] + va - l["va"]
              raise ValueError(hex(va))

          # ---------------- patch .text ----------------
          cnt = {}
          if ARM:
              t = secs[".text"]; assert t["off"] % 4 == 0 and t["size"] % 4 == 0
              arr = np.frombuffer(data, dtype="<u4", count=t["size"] // 4, offset=t["off"])
              lg = (arr & 0x9FC00000) == 0x92400000          # 64-bit logical imm, N=1
              opc = (arr >> 29) & 3; immr = (arr >> 16) & 0x3F; imms = (arr >> 10) & 0x3F
              oldm = lg & (immr == OLD_IMMR) & (imms == OLD_IMMS)
              by = {o: int((oldm & (opc == o)).sum()) for o in range(4)}
              orr = oldm & (opc == 1)
              hw2 = ((arr >> 21) & 3) == 2; imm = (arr >> 5) & 0xFFFF
              movk = ((arr & 0xFF800000) == 0xF2800000) & hw2
              movz = ((arr & 0xFF800000) == 0xD2800000) & hw2
              mk, mz = movk & (imm == OLD16), movz & (imm == OLD16)
              cnt = dict(orr=int(orr.sum()), movk=int(mk.sum()), movz=int(mz.sum()))
              rep(f"\n## sites in .text (0x{t['off']:x}, {t['size']//4} words)")
              rep(f"- logical-imm with old base by opc (and/orr/eor/ands): {by}")
              for k in EXPECT:
                  rep(f"- {k}: {cnt[k]} (1.0.7 baseline {EXPECT[k]}) " + ("OK" if cnt[k] == EXPECT[k] else "**MISMATCH**"))
              # extra forms that a pure orr/movk patch would miss
              tb = (((arr >> 31) & 1) == 1) & (((arr >> 19) & 0x1F) == 5) & (((arr & 0x7E000000) == 0x36000000))
              ub = ((arr & 0xFFC00000) == 0xD3400000) & (immr == 37)
              rep(f"- tbz/tbnz on bit 37: {int(tb.sum())}; ubfm/lsr with immr=37: {int(ub.sum())}")
              for nm, m in (("movz", movz), ("movk", movk)):
                  h = np.bincount(imm[m], minlength=65536); top = np.argsort(-h)[:10]
                  rep(f"- hw=2 {nm} imm16 histogram top: " + ", ".join(f"0x{int(i):x}:{int(h[i])}" for i in top if h[i]))
              lg2 = (arr & 0x9F800000) == 0x92000000
              key = (((arr >> 29) & 3) << 13) | (((arr >> 22) & 1) << 12) | ((arr >> 10) & 0xFFF)
              u, c = np.unique(key[lg2], return_counts=True)
              flag = []
              for k, n in zip(u.tolist(), c.tolist()):
                  try: v = decode_bitmask((k >> 12) & 1, k & 0x3F, (k >> 6) & 0x3F)
                  except AssertionError: continue
                  hi = v >> 32
                  if ((hi >> 5) & 1 and bin(hi).count("1") <= 7) or v == M64 ^ OLD:
                      flag.append((n, ["and", "orr", "eor", "ands"][k >> 13], hex(v)))
              rep("- logical-imm values that look base-like: " + "; ".join(f"{o} {v} x{n}" for n, o, v in sorted(flag, reverse=True)[:15]))
              # ---- Turn 13 extra scan: other instruction forms that may encode the window (runs BEFORE the patch) ----
              import subprocess, shutil
              OBJ = os.environ.get("OBJDUMP") or shutil.which("llvm-objdump") or shutil.which("objdump")
              rep(f"\n## extra scan (disassembler: {OBJ or 'none, hex only'})")
              def va_of(i): return t["addr"] + i * 4
              def ctx(i, title, before=4, after=4):
                  lo, hi = max(0, i - before), i + after + 1
                  rep(f"### {title} @ va 0x{va_of(i):x}")
                  got = None
                  if OBJ:
                      try:
                          o = subprocess.run([OBJ, "-d", f"--start-address=0x{va_of(lo):x}", f"--stop-address=0x{va_of(hi):x}", SRC],
                                             capture_output=True, text=True, timeout=120).stdout
                          got = [l for l in o.splitlines() if ":" in l and l.strip()[:1] in "0123456789abcdef" and "\t" in l]
                      except Exception as e:
                          rep(f"(objdump failed: {e})")
                  if not got:
                      got = [f"  {va_of(j):x}: {int(arr[j]):08x}" for j in range(lo, hi)]
                  for l in got: rep("    " + l.replace("\t", "  ").strip())
              def sites(mask, title, cap):
                  ix = np.nonzero(mask)[0]
                  rep(f"- {title}: {len(ix)} sites" + (f" (showing first {cap})" if len(ix) > cap else ""))
                  for i in ix[:cap].tolist(): ctx(i, title)
              sites(ub, "ubfm with immr=37 (lsr/ubfx #37: window-membership checks?)", 24)
              keyv = {}
              for k in np.unique(key[lg2]).tolist():
                  try: keyv[k] = decode_bitmask((k >> 12) & 1, k & 0x3F, (k >> 6) & 0x3F)
                  except AssertionError: pass
              tgt = lambda opcode, val: [k for k, v in keyv.items() if v == val and (k >> 13) == opcode]
              sites(lg2 & np.isin(key, tgt(0, 0x7fffffffff)), "and #0x7fffffffff", 12)
              tmask = lg2 & np.isin(key, tgt(1, 0x2000000020))
              sites(tmask, "orr #0x2000000020 (base|0x20)", 12)
              sites(lg2 & np.isin(key, tgt(3, 0x2000000000)), "ands #0x2000000000 (bit-37 test?)", 4)
              sites((movk | movz) & (imm == 0x21), "movz/movk #0x21,lsl32 (window end?)", 10)
              mrs0 = (arr & 0xFFFFFFE0) == 0xD53BD040; mrs1 = (arr & 0xFFFFFFE0) == 0xD53BD060; msr0 = (arr & 0xFFFFFFE0) == 0xD51BD040
              rep(f"- thread-pointer use: mrs tpidr_el0 x{int(mrs0.sum())}; mrs tpidrro_el0 x{int(mrs1.sum())}; msr tpidr_el0 x{int(msr0.sum())}")
              sites(mrs0, "mrs tpidr_el0", 3)
              u32 = np.frombuffer(bytes(data[: len(data) // 4 * 4]), dtype="<u4")
              p4 = np.nonzero((u32[:-1] == 0) & (u32[1:] == 0x20))[0]
              rep(f"- (0x00000000,0x00000020) word pairs: {len(p4)} total, {int((p4 % 2 == 1).sum())} only 4-byte aligned (v4's 138 probably counted these)")
              # patch
              arr[orr] = (arr[orr] & np.uint32(~((0x3F << 16) | (0x3F << 10)) & 0xFFFFFFFF)) | np.uint32((NEW_IMMR << 16) | (NEW_IMMS << 10))
              for m in (mk, mz):
                  arr[m] = (arr[m] & np.uint32(~(0xFFFF << 5) & 0xFFFFFFFF)) | np.uint32(NEW16 << 5)
              left = int((oldm & (opc == 1)).sum())  # recomputed below
              lg = (arr & 0x9FC00000) == 0x92400000
              left = int((lg & (((arr >> 16) & 0x3F) == OLD_IMMR) & (((arr >> 10) & 0x3F) == OLD_IMMS) & (((arr >> 29) & 3) == 1)).sum())
              rep(f"- after patch: old orr left={left}, old movk left={int((((arr & 0xFF800000) == 0xF2800000) & (((arr >> 21) & 3) == 2) & (((arr >> 5) & 0xFFFF) == OLD16)).sum())}")
              assert left == 0
              # ---- Turn 14: base|0x20 constants cannot be re-encoded for the new base (only 0x2000000000 has base and base|0x20 both as one logical immediate).
              # Each `mov xd,#0x2000000020` becomes `b cave`; cave: movz xd,#0x20; movk xd,#0x78,lsl#32; b back. Caves live in the free tail of the code page.
              text_end0 = loads[0]["fsz"]; cave_start = (text_end0 + 15) & ~15
              cave = bytearray(); tramps = []
              for i in np.nonzero(tmask)[0].tolist():
                  w = int(arr[i]); rd, rn = w & 31, (w >> 5) & 31
                  if rn != 31: rep(f"- **TRAMPOLINE SKIPPED** va 0x{va_of(i):x}: Rn={rn} (not a plain mov); needs manual handling"); continue
                  site, c = va_of(i), cave_start + len(cave)
                  assert abs(c - site) < 128 * 2**20
                  arr[i] = np.uint32(0x14000000 | (((c - site) // 4) & 0x3FFFFFF))
                  cave += struct.pack("<IIII", 0xD2800000 | (0x20 << 5) | rd, 0xF2C00000 | (NEW16 << 5) | rd,
                                      0x14000000 | ((((site + 4) - (c + 8)) // 4) & 0x3FFFFFF), 0xD503201F)
                  tramps.append((site, rd, c))
              assert cave_start + len(cave) <= (text_end0 + PG - 1) & ~(PG - 1), "caves do not fit in the page tail"
              rep(f"\n## trampolines for base|0x20 constants: {len(tramps)} of {int(tmask.sum())} patched; caves at 0x{cave_start:x}, {len(cave)} bytes")
              for s_, r_, c_ in tramps: rep(f"- site 0x{s_:x} x{r_} -> cave 0x{c_:x}")

              # ---- v11: every `mrs xN,tpidr_el0` -> `b stub`; stub = adrp/add xN -> read-only block with a constant canary at +0x28, then b back ----
              text_page_end = (text_end0 + PG - 1) & ~(PG - 1)
              dsx = secs[".dynsym"]; fr_sym = set()
              for k_ in range(dsx["size"] // 24):
                  _n, inf_, _o, shn_, val_, sz_ = struct.unpack_from("<IBBHQQ", data, dsx["off"] + 24 * k_)
                  if (inf_ & 0xF) == 2 and shn_ != 0 and sz_ > 0: fr_sym.add((val_, val_ + sz_))
              ehs = secs.get(".eh_frame"); fr_eh = set(eh_ranges(data, ehs["off"], ehs["size"], ehs["addr"])) if ehs else set()
              fr_all = sorted(fr_eh | fr_sym)
              rep(f"\n## thread pointer: mrs tpidr_el0 -> stub -> constant canary block\n- function bounds: {len(fr_eh)} from .eh_frame FDEs, {len(fr_sym)} from sized dynsym, {len(fr_all)} union")
              tsites = [(va_of(i), int(arr[i]) & 31) for i in np.nonzero(mrs0)[0].tolist()]
              acc, ref, kinds_, ctxs_ = plan_tpidr(tsites, fr_all, OBJ, SRC)
              # v74 (1.0.7): the old 1.0.6 force (0x5a8a3f0, touch handler) is gone; that site does not exist in this build and the touch handler was patched normally.
              # The scanner refused 3 sites that are stack-protector reads: `mrs xN, tpidr_el0` followed by `ldr x, [xN, #0x28]` (0x5a95960 shows it three instructions later).
              # Left raw, mrs returns Darwin's TPIDR_EL0 (a small integer) and the canary load faults when that function runs. Patched, xN is a valid pointer exactly like the
              # other 872 sites; if the refusing use (mov/stur/cmp of wN) treats it as a plain integer it just sees another arbitrary value, as it would with the raw register.
              FORCE_TP = {0x10c0550: 20, 0x5a95960: 22, 0x5b113c0: 5}
              for f_va, f_n in FORCE_TP.items():
                  hit_ = [r_ for r_ in ref if r_[0] == f_va]
                  if hit_ and hit_[0][1] == f_n:
                      ref.remove(hit_[0]); acc.append((f_va, f_n)); kinds_[f_va] = "forced"
                      rep(f"- FORCED patch of refused site 0x{f_va:x} x{f_n} (was: {hit_[0][2]})")
                  elif not hit_ and not any(a_[0] == f_va for a_ in acc):
                      rep(f"- WARNING: forced site 0x{f_va:x} is not a tpidr site in this ELF")
              acc.sort()
              base_, stubs_, blk_, block_, where_ = build_tpidr_caves(acc, cave_start + len(cave), text_page_end)
              for va_, n_, c_ in where_:
                  assert abs(c_ - va_) < 128 * 2**20
                  arr[(va_ - t["addr"]) // 4] = np.uint32(0x14000000 | (((c_ - va_) // 4) & 0x3FFFFFF))
              prefix_size = 0x4000
              prefix = bytearray(b"\x1f\x20\x03\xd5" * (prefix_size // 4))
              prefix[:len(stubs_)] = stubs_
              open(os.path.join(OUT, "prefix.bin"), "wb").write(prefix)
              cave += b"\0" * (blk_ - (cave_start + len(cave))); cave += block_
              assert cave_start + len(cave) <= text_page_end and len(acc) + len(ref) == int(mrs0.sum())
              canary_blk, canary_val = blk_, CANARY
              rep(f"- patched {len(acc)} of {len(tsites)}, refused {len(ref)}; prefix stubs 0x{base_ & 0xffffffffffffffff:x}..0x{(base_ + 16 * len(acc)) & 0xffffffffffffffff:x} relative to _p2_code_start; block at 0x{blk_:x} (canary 0x{CANARY:x} at +0x28); free bytes left in code-page tail: {text_page_end - (cave_start + len(cave))}")
              kc_ = {}
              for v_ in kinds_.values():
                  for k_ in v_.split(","): kc_[k_] = kc_.get(k_, 0) + 1
              rep(f"- what the patched sites do with xN afterwards (a site can have several): {kc_}")
              rep(f"- sites that use xN for TLS (need the TLSDESC resolver to return thread_block - block): {sum(1 for v_ in kinds_.values() if 'tls' in v_)}")
              hist_ = {}
              for va_, n_, why_ in ref:
                  k_ = why_.split(" ")[0] if "@" in why_ else why_
                  hist_[k_] = hist_.get(k_, 0) + 1
              rep("- refusal reasons (mnemonic of the offending use): " + str(dict(sorted(hist_.items(), key=lambda kv: -kv[1])[:15])))
              for va_, n_, why_ in ref[:80]: rep(f"- REFUSED site 0x{va_:x} x{n_}: {why_}")
              for va_, n_, why_ in ref[:20]:
                  if ctxs_.get(va_): rep(f"\n  context of refused site 0x{va_:x} x{n_}:\n    " + "\n    ".join(ctxs_[va_]))

          # ---------------- leftover 8-byte literals ----------------
          u64 = np.frombuffer(bytes(data[: len(data) // 8 * 8]), dtype="<u8")
          hits = (np.nonzero(u64 == OLD)[0] * 8).tolist()
          def sec_of(o):
              for s in secl:
                  if s["type"] != 8 and s["off"] <= o < s["off"] + s["size"] and s["size"]: return s["name"]
              return "(none)"
          bysec = {}
          for o in hits: bysec.setdefault(sec_of(o), []).append(o)
          rep(f"\n## aligned 8-byte literals equal to 0x2000000000: {len(hits)} by section: " + str({k: len(v) for k, v in bysec.items()}))
          for k, v in bysec.items():
              if k in (".dynsym", ".gnu.hash", ".eh_frame"): continue
              for o in v[:24]:
                  pv = struct.unpack_from("<Q", data, o - 8)[0] if o >= 8 else 0
                  nx = struct.unpack_from("<Q", data, o + 8)[0] if o + 16 <= len(data) else 0
                  rep(f"- {k} file 0x{o:x}: prev=0x{pv:x} next=0x{nx:x}")

          # ---------------- relocations + symbols ----------------
          T = dict(REL=1027, ABS=257, GOT=1025, JMP=1026, TLSD=1031, IREL=1032) if ARM else dict(REL=8, ABS=1, GOT=6, JMP=7, TLSD=36, IREL=37)
          ds, dstr = secs[".dynsym"], secs[".dynstr"]
          syms = [struct.unpack_from("<IBBHQQ", data, ds["off"] + 24 * i) for i in range(ds["size"] // 24)]
          sname = lambda i: cstr(dstr["off"], syms[i][0])
          names = bytearray(b"\0"); nmoff = {}
          def nm_off(n):
              if n not in nmoff:
                  nmoff[n] = len(names); names.extend(n.encode() + b"\0")
              return nmoff[n]
          recs = []; types = {}
          for sn in (".rela.dyn", ".rela.plt"):
              s = secs.get(sn)
              if not s: continue
              for i in range(s["size"] // 24):
                  ro, info, add = struct.unpack_from("<QQq", data, s["off"] + 24 * i)
                  ty, si = info & 0xFFFFFFFF, info >> 32
                  types[ty] = types.get(ty, 0) + 1
                  if ty == T["REL"]: recs.append((ro, 1, 0, add))
                  elif ty in (T["ABS"], T["GOT"], T["JMP"]):
                      _, inf, _, shn, val, _ = syms[si]
                      if inf & 0xF == 6: recs.append((ro, 9, 0, 0))              # TLS symbol: unsupported
                      elif shn != 0: recs.append((ro, 1, 0, val + add))
                      else: recs.append((ro, 3 if (inf >> 4) == 2 else 2, nm_off(sname(si)), add))
                  elif ty == T["TLSD"]:
                      # record: addend = offset of the variable inside the PT_TLS block
                      if si == 0: recs.append((ro, 4, 0, add))
                      else:
                          _, inf, _, shn, val, _ = syms[si]
                          recs.append((ro, 4, 0, val + add) if shn != 0 else (ro, 9, 0, 0))
                  elif ty == T["IREL"]: recs.append((ro, 5, 0, add))
                  else: recs.append((ro, 9, 0, 0))
          nrelr = 0
          rs = secs.get(".relr.dyn")
          if rs:
              ent = struct.unpack_from(f"<{rs['size']//8}Q", data, rs["off"]); where = 0
              def addrel(va):
                  global nrelr
                  recs.append((va, 1, 0, struct.unpack_from("<Q", data, v2o(va))[0])); nrelr += 1
              for e in ent:
                  if e & 1 == 0: addrel(e); where = e + 8
                  else:
                      for b in range(1, 64):
                          if (e >> b) & 1: addrel(where + (b - 1) * 8)
                      where += 63 * 8
          rep(f"\n## relocations\n- RELA by type: {types}; RELR expanded: {nrelr}; total records {len(recs)}")
          kinds = {}
          for r in recs: kinds[r[1]] = kinds.get(r[1], 0) + 1
          rep(f"- record kinds (1 rel, 2 import, 3 weak import, 4 tlsdesc, 5 irelative, 9 unsupported): {kinds}")
          imports = sorted({sname(i) for i, s in enumerate(syms) if s[3] == 0 and i and sname(i)})
          exports = {sname(i): s[4] for i, s in enumerate(syms) if s[3] != 0 and s[2] is not None and (s[1] >> 4) in (1, 2) and sname(i)}
          rep(f"- undefined dynsyms (imports): {len(imports)}; defined exports: {len(exports)}")
          dem = [n for n in exports if "demangle" in n]
          rep(f"- demangle-ish exports: {dem[:8]}")
          dem_off = exports.get("__cxa_demangle", 0)
          naoc_off = exports.get("ANativeActivity_onCreate", 0)
          rep(f"- ANativeActivity_onCreate export offset: 0x{naoc_off:x}")

          if not ARM:
              open(os.path.join(OUT, "prep-report.md"), "w").write("\n".join(R)); sys.exit(0)

          # ---------------- layout + outputs ----------------
          L1, rest = loads[0], loads[1:]
          assert L1["va"] == 0 and L1["off"] == 0 and (L1["flags"] & 1), "first LOAD not R+E at 0"
          text_end = L1["fsz"]
          D0 = rest[0]["va"] & ~(PG - 1)
          assert D0 == (text_end + PG - 1) & ~(PG - 1), f"data page 0x{D0:x} != text end rounded"
          dend = max(l["va"] + l["msz"] for l in rest); dend = (dend + PG - 1) & ~(PG - 1)
          DS = dend - D0
          img = bytearray(DS)
          for l in rest: img[l["va"] - D0: l["va"] - D0 + l["fsz"]] = data[l["off"]: l["off"] + l["fsz"]]
          bad = [r for r in recs if r[1] != 9 and not (D0 <= r[0] and r[0] + 8 <= dend)]
          rep(f"\n## layout\n- text 0x0..0x{text_end:x}; data page 0x{D0:x}; data size 0x{DS:x}; relocs outside data: {len(bad)}")
          rep(f"- imports ({len(imports)}): " + " ".join(imports))
          open(os.path.join(OUT, "code.bin"), "wb").write(bytes(data[:text_end]) + b"\0" * (cave_start - text_end) + bytes(cave))
          open(os.path.join(OUT, "p2data.bin"), "wb").write(img)
          open(os.path.join(OUT, "p2relocs.bin"), "wb").write(b"".join(struct.pack("<QIIq", *r) for r in recs))
          open(os.path.join(OUT, "p2names.bin"), "wb").write(names)
          # ---- v12: TLS image, init_array, import stubs ----
          tlsimg = b""; tls_fsz = tls_msz = 0; tls_al = 16
          if tls:
              tlsimg = bytes(data[tls["off"]: tls["off"] + tls["fsz"]]); tls_fsz, tls_msz, tls_al = tls["fsz"], tls["msz"], max(tls["al"], 16)
          open(os.path.join(OUT, "p2tls.bin"), "wb").write(tlsimg)
          open(os.path.join(OUT, "p2phdr.bin"), "wb").write(bytes(data[e_phoff: e_phoff + e_phnum * e_phentsize]))
          ia = secs.get(".init_array"); ia_va = ia["addr"] if ia else 0; ia_n = ia["size"] // 8 if ia else 0
          ntls = sum(1 for r in recs if r[1] == 4)
          tlsmax = max([r[3] for r in recs if r[1] == 4] or [0])
          rep(f"\n## TLS / init (v12)\n- PT_TLS: filesz 0x{tls_fsz:x} memsz 0x{tls_msz:x} align {tls_al}; TLSDESC records {ntls}; max var offset 0x{tlsmax:x}; .init_array at 0x{ia_va:x}, {ia_n} entries")
          assert not ntls or (tls and tlsmax < tls_msz), "TLSDESC offset outside PT_TLS block"
          open(os.path.join(OUT, "p2imports.c"), "w").write("const char *const p2_import_names[] = {\n" + "".join('"%s",\n' % n for n in imports) + "0};\nconst unsigned p2_import_count = %d;\n" % len(imports))
          stubsrc = ".text\n.p2align 2\n.globl _p2_stubs_start\n_p2_stubs_start:\n" + "".join("mov w16, #%d\nb _p2_stub_common\n" % i for i in range(len(imports)))
          open(os.path.join(OUT, "p2stubs.s"), "w").write(stubsrc)
          EXTRA = f"#define P2_TLS_FILESZ 0x{tls_fsz:x}ULL\n#define P2_TLS_MEMSZ 0x{tls_msz:x}ULL\n#define P2_TLS_ALIGN {tls_al}\n#define P2_INIT_VA 0x{ia_va:x}ULL\n#define P2_INIT_N {ia_n}\n#define P2_PHNUM {e_phnum}\n"
          open(os.path.join(OUT, "layout.h"), "w").write(
              f"#define P2_TEXT_SIZE 0x{text_end:x}ULL\n#define P2_DATA_VADDR 0x{D0:x}ULL\n#define P2_DATA_SIZE 0x{DS:x}ULL\n"
              f"#define P2_NREL {len(recs)}\n#define P2_OFF_DEMANGLE 0x{dem_off:x}ULL\n#define P2_OFF_NAOC 0x{naoc_off:x}ULL\n#define P2_CANARY_BLK 0x{canary_blk:x}ULL\n#define P2_CANARY_VAL 0x{canary_val:x}ULL\n" + EXTRA)
          open(os.path.join(OUT, "p2code.s"), "w").write(
              ".section __TEXT,__text,regular,pure_instructions\n.p2align 14\n_p2_tp_prefix_start:\n"
              '.incbin "prefix.bin"\n.p2align 14\n.globl _p2_code_start\n_p2_code_start:\n'
              '.incbin "code.bin"\n.globl _p2_data_start\n.zerofill __DATA,__p2data,_p2_data_start,0x%x,14\n' % DS)
          open(os.path.join(OUT, "data_vaddr.txt"), "w").write(f"{D0}\n")
          import hashlib
          rep(f"- patched libp2re sha256: {hashlib.sha256(data).hexdigest()}")
          open(os.path.join(OUT, "prep-report.md"), "w").write("\n".join(R))
          EOF_PREP_PY
          set +e
          export OBJDUMP="$(xcrun -f llvm-objdump 2>/dev/null || command -v llvm-objdump || command -v objdump || true)"
          echo "Using OBJDUMP=$OBJDUMP"
          python3 prep.py ../work/libp2re.so . > prep-full.log 2>&1
          PREP_RC=$?
          echo "prep.py exit code: $PREP_RC"
          echo "---- full prep.py output (last 180 lines) ----"
          tail -180 prep-full.log
          echo "---- end prep.py output ----"
          if [ "$PREP_RC" -eq 0 ]; then
            test -s code.bin && test -s layout.h
          fi
          exit "$PREP_RC"
      - name: Compare new ELF layout with v63 hardcoded code-size bound
        if: always()
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path('src/prep-report.md')
          if not p.exists():
              print('prep-report.md was not produced; prep.py likely stopped before layout analysis')
              sys.exit(0)
          report = p.read_text()
          m = re.search(r'text 0x0\.\.0x([0-9a-fA-F]+)', report)
          if not m:
              print('Could not find PT_LOAD text size in prep-report.md')
              sys.exit(0)
          actual = int(m.group(1), 16)
          m2 = re.search(r'data page 0x([0-9a-fA-F]+)', report)
          dpage = int(m2.group(1), 16) if m2 else 0
          line = f"\n\n## v64 code-size bound\n- executable PT_LOAD file size: 0x{actual:x}\n- data page (= the bound the native C now uses, P2_DATA_VADDR): 0x{dpage:x}\n- the old hardcoded 0x5b2c000 is gone; nothing to compare\n"
          with p.open('a') as f: f.write(line)
          print(line)
          PY
      - name: Upload prep failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-prep-debug
          path: |
            src/prep-full.log
            src/prep-report.md
          if-no-files-found: warn
          retention-days: 3
      - name: Build code dylib (framework) and verify layout
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.inspect_only }}
        run: |
          set -e
          cd src
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          D0=$(cat data_vaddr.txt)
          link() { clang -target arm64-apple-ios15.0 -isysroot "$SDK" -dynamiclib -install_name @rpath/P2Code.framework/P2Code "$@" -o P2Code p2code.s; }
          sym() { nm -g P2Code | awk -v s="$1" '$3==s{print $1}'; }
          link
          CS=$((16#$(sym _p2_code_start))); DS=$((16#$(sym _p2_data_start)))
          echo "pass1: code=0x$(printf %x $CS) data=0x$(printf %x $DS) delta=0x$(printf %x $((DS-CS))) want=0x$(printf %x $D0)"
          if [ $((DS-CS)) -ne $D0 ]; then
            link -Wl,-segaddr,__DATA,0x$(printf %x $((CS+D0)))
            CS=$((16#$(sym _p2_code_start))); DS=$((16#$(sym _p2_data_start)))
            echo "pass2: code=0x$(printf %x $CS) data=0x$(printf %x $DS) delta=0x$(printf %x $((DS-CS)))"
            [ $((DS-CS)) -eq $D0 ] || { echo "LAYOUT FAILED"; otool -l P2Code | grep -A6 -E 'segname'; exit 1; }
          fi
          [ $((CS % 16384)) -eq 0 ] || { echo "code start not 16K aligned"; exit 1; }
          echo "LAYOUT OK"; otool -l P2Code | grep -E 'segname|vmaddr|vmsize|initprot' | head -24
      - name: Fetch MoltenVK v1.4.2 (iOS)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.inspect_only }}
        run: |
          set -e
          mkdir -p src/mvk && cd src/mvk
          curl -sfL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/KhronosGroup/MoltenVK/releases/tags/v1.4.2 -o rel.json
          python3 - <<'PY'
          import json, sys
          a = json.load(open('rel.json'))['assets']
          print("release assets:", [(x['name'], x['size']) for x in a])
          pick = [x for x in a if 'ios' in x['name'].lower()] or [x for x in a if 'all' in x['name'].lower()]
          if not pick: sys.exit("no ios/all asset in the release")
