          @implementation GameView
          + (Class)layerClass { return [CAMetalLayer class]; }
          - (void)layoutSubviews { [super layoutSubviews]; ownLoad(); if (gOwnOn) ownShow(self); }
          static void *gSlot[10];
          static int slotFor(UITouch *t, BOOL create) {
              for (int i = 0; i < 10; i++) if (gSlot[i] == (__bridge void *)t) return i;
              if (!create) return -1;
              for (int i = 0; i < 10; i++) if (!gSlot[i]) { gSlot[i] = (__bridge void *)t; return i; }
              return -1;
          }
          - (void)feed:(NSSet<UITouch *> *)ts phase:(int)ph event:(UIEvent *)ev {
              tcInit(); ownLoad();
              CGFloat sc = UIScreen.mainScreen.nativeScale;
              for (UITouch *t in ts) {
                  int s = slotFor(t, ph == 0); if (s < 0) continue;
                  CGPoint p = [t locationInView:self];
                  CGPoint pp = CGPointMake(p.x * sc, p.y * sc);
          if (gCbEdit) {   /* v84 editor: a tap on empty space deselects, but not when it was the start of a pinch or a drag */
              static CGPoint empStart[10]; static BOOL empOn[10];
              BOOL hit = ownEditFeed(ph, s, p, self.bounds.size);
              if (ph == 0) { empOn[s] = !hit; empStart[s] = p; }
              else if (ph == 1) { if (empOn[s] && hypot(p.x - empStart[s].x, p.y - empStart[s].y) > 12) empOn[s] = NO; }
              else { if (empOn[s] && !gCbPinch && ph == 2) cbSelClear(); empOn[s] = NO; }
              if (gCbPinch) for (int q = 0; q < 10; q++) empOn[q] = NO;
              if (ph >= 2) gSlot[s] = NULL; continue;
          }
                  if (gOwnOn && ownFeed(ph, s, p, self.bounds.size)) { if (ph >= 2) gSlot[s] = NULL; continue; }   /* v76: our own element, the dev never sees this touch */
                  if (ph == 1) {
                      gTcUiMoves++;
                      if (p2_pan_smooth()) {   /* v81: every intermediate sample (about 120 a second) with its hardware timestamp; the loader resamples them once per game frame */
                          NSArray<UITouch *> *co = [ev coalescedTouchesForTouch:t];
                          if (co.count == 0) co = @[ t ];
                          for (UITouch *c in co) { CGPoint q = [c locationInView:self]; p2_touch_ts(1, s, (float)(q.x * sc), (float)(q.y * sc), c.timestamp); gTcSent++; }
                          continue;
                      }
                      if (gTcCoalesce && gTcLink) { gTcPend[s] = pp; gTcPendOn[s] = YES; continue; }   /* v69: keep only the newest position, the display link tick sends it */
                      tcSend(s, pp); continue;
                  }
                  if (gTcPendOn[s]) { gTcPendOn[s] = NO; tcSend(s, gTcPend[s]); }   /* send the last held move before a down, up or cancel */
                  p2_touch_ts(ph, s, (float)pp.x, (float)pp.y, t.timestamp);
                  if (ph >= 2) gSlot[s] = NULL;
              }
              if (gTcTrace) tcReport(CACurrentMediaTime());
          }
          - (void)touchesBegan:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:0 event:e]; }
          - (void)touchesMoved:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:1 event:e]; }
          - (void)touchesEnded:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:2 event:e]; }
          - (void)touchesCancelled:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:3 event:e]; }
          @end
