                      }];
                      a.state = (i == cur) ? UIMenuElementStateOn : UIMenuElementStateOff; [acts addObject:a];
                  }
                  UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
                  [b setTitle:shown forState:UIControlStateNormal];
                  [b setImage:[UIImage systemImageNamed:@"chevron.up.chevron.down"] forState:UIControlStateNormal];
                  b.semanticContentAttribute = UISemanticContentAttributeForceRightToLeft;   /* arrows after the text */
                  b.titleLabel.font = [UIFont systemFontOfSize:17];
                  b.menu = [UIMenu menuWithChildren:acts]; b.showsMenuAsPrimaryAction = YES;
                  [b sizeToFit]; b.frame = CGRectMake(0, 0, b.bounds.size.width + 14, MAX(b.bounds.size.height, 36));
                  c.accessoryView = b;
              } else if (r.kind == SKLink) {
                  c.accessoryType = UITableViewCellAccessoryDisclosureIndicator; c.selectionStyle = UITableViewCellSelectionStyleDefault;
              } else if (r.kind == SKButton) {
                  c.textLabel.textColor = [r.flag isEqualToString:@"caches"] ? UIColor.systemBlueColor : UIColor.systemRedColor; c.textLabel.textAlignment = NSTextAlignmentCenter; c.selectionStyle = UITableViewCellSelectionStyleDefault;
              }
              return c;
          }
          - (void)flip:(UISwitch *)s {
              SRow *r = self.rows[s.tag / 1000][s.tag % 1000];
              uiSet(r.flag, r.onWhenPresent ? s.on : !s.on);
          }
          - (void)say:(NSString *)title message:(NSString *)msg {
              UIAlertController *al = [UIAlertController alertControllerWithTitle:title message:msg preferredStyle:UIAlertControllerStyleAlert];
              [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:al animated:YES completion:nil];
          }
          - (void)askClearCaches {
              if (self.isRunning && self.isRunning()) {
                  [self say:@"Close the app first" message:@"The game has already started in this session. Swipe the app away, open it again and clear the caches before pressing Play."]; return;
              }
              UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Clear caches?" message:@"Deletes the spirv and vkpddi_cache folders. They are rebuilt the next time the game starts, so that start can take longer." preferredStyle:UIAlertControllerStyleAlert];
              [al addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
              [al addAction:[UIAlertAction actionWithTitle:@"Clear" style:UIAlertActionStyleDestructive handler:^(UIAlertAction *x) {
                  NSFileManager *fm = NSFileManager.defaultManager; unsigned long long total = 0; int gone = 0, failed = 0;
                  for (NSString *n in @[@"spirv", @"vkpddi_cache"]) {
                      NSString *path = [uiDocs() stringByAppendingPathComponent:n];
                      if (![fm fileExistsAtPath:path]) continue;
                      unsigned long long sz = uiDirSize(path);
                      if ([fm removeItemAtPath:path error:nil]) { gone++; total += sz; } else failed++;
                  }
                  NSString *msg = failed ? @"Some cache folders could not be deleted. Fully close the app and try again."
                                : gone ? [NSString stringWithFormat:@"Freed %@. The caches will be rebuilt on the next start.", [NSByteCountFormatter stringFromByteCount:(long long)total countStyle:NSByteCountFormatterCountStyleFile]]
                                : @"There were no cache folders to delete.";
                  [self say:@"Caches" message:msg];
              }]];
              [self presentViewController:al animated:YES completion:nil];
          }
          - (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
              SRow *r = self.rows[ip.section][ip.row]; [tv deselectRowAtIndexPath:ip animated:YES];
              if (r.kind == SKLink && self.onLogs) self.onLogs();
              if (r.kind == SKButton && [r.flag isEqualToString:@"caches"]) { [self askClearCaches]; return; }
              if (r.kind == SKButton) {
                  UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Reset to defaults?" message:@"Removes every switch folder this screen controls, then turns Skip splash back on and the traces off (their defaults). Your game files and caches are not touched." preferredStyle:UIAlertControllerStyleAlert];
                  [al addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
                  [al addAction:[UIAlertAction actionWithTitle:@"Reset" style:UIAlertActionStyleDestructive handler:^(UIAlertAction *x) {
                      for (NSArray<SRow *> *sec in self.rows) for (SRow *q in sec) {
                          if (q.kind == SKSwitch) uiSet(q.flag, NO);
                          if (q.kind == SKMenu) { for (NSString *f in q.folders) if (f.length) uiSet(f, NO); if (q.prefix.length) for (NSString *f in uiWithPrefix(q.prefix)) uiSet(f, NO); }
                      }
                      uiSet(@"nosplash", YES);   /* default is ON */
                      uiSet(@"rbtrace_off", YES); uiSet(@"waittrace_off", YES); uiSet(@"textrace_off", YES);   /* traces default to OFF */
                      if (self.onHz) self.onHz();
                      [self.tableView reloadData];
                  }]];
                  [self presentViewController:al animated:YES completion:nil];
              }
          }
          @end

          /* ================= v79: CUSTOM BUTTONS =================
             A gear at the top left of the game screen opens "Custom buttons". You pick any key, the button is a circle with that key in the middle, then drag it where you want it.
             A button only presses its key (p2_key, the same path the own controls use); nothing is tied to a game function. Move mode also drags the own_layout stick and buttons.
             Buttons are real UIKit views above the game view, so a touch on one never reaches the dev's input handler or the own_layout code.
             Saved in Documents/custom_buttons.txt, one line each: btn KEY x y w h LABEL (KEY = DirectInput scancode in hex, x y w h are fractions of the screen). ---- */
          static const struct { const char *g; const char *n; int d; } kCbK[] = {
              {"Letters","A",0x1E},{"Letters","B",0x30},{"Letters","C",0x2E},{"Letters","D",0x20},{"Letters","E",0x12},{"Letters","F",0x21},{"Letters","G",0x22},
              {"Letters","H",0x23},{"Letters","I",0x17},{"Letters","J",0x24},{"Letters","K",0x25},{"Letters","L",0x26},{"Letters","M",0x32},{"Letters","N",0x31},
              {"Letters","O",0x18},{"Letters","P",0x19},{"Letters","Q",0x10},{"Letters","R",0x13},{"Letters","S",0x1F},{"Letters","T",0x14},{"Letters","U",0x16},
              {"Letters","V",0x2F},{"Letters","W",0x11},{"Letters","X",0x2D},{"Letters","Y",0x15},{"Letters","Z",0x2C},
              {"Numbers","1",0x02},{"Numbers","2",0x03},{"Numbers","3",0x04},{"Numbers","4",0x05},{"Numbers","5",0x06},{"Numbers","6",0x07},{"Numbers","7",0x08},
              {"Numbers","8",0x09},{"Numbers","9",0x0A},{"Numbers","0",0x0B},
              {"Common","Space",0x39},{"Common","Enter",0x1C},{"Common","Esc",0x01},{"Common","Tab",0x0F},{"Common","Backspace",0x0E},{"Common","Caps Lock",0x3A},
              {"Modifiers","Left Shift",0x2A},{"Modifiers","Right Shift",0x36},{"Modifiers","Left Ctrl",0x1D},{"Modifiers","Right Ctrl",0x9D},
              {"Modifiers","Left Alt",0x38},{"Modifiers","Right Alt",0xB8},
              {"Arrows and navigation","Up",0xC8},{"Arrows and navigation","Down",0xD0},{"Arrows and navigation","Left",0xCB},{"Arrows and navigation","Right",0xCD},
              {"Arrows and navigation","Home",0xC7},{"Arrows and navigation","End",0xCF},{"Arrows and navigation","Page Up",0xC9},{"Arrows and navigation","Page Down",0xD1},
              {"Arrows and navigation","Insert",0xD2},{"Arrows and navigation","Delete",0xD3},
              {"Function keys","F1",0x3B},{"Function keys","F2",0x3C},{"Function keys","F3",0x3D},{"Function keys","F4",0x3E},{"Function keys","F5",0x3F},
              {"Function keys","F6",0x40},{"Function keys","F7",0x41},{"Function keys","F8",0x42},{"Function keys","F9",0x43},{"Function keys","F10",0x44},
              {"Function keys","F11",0x57},{"Function keys","F12",0x58},
              {"Punctuation","- (minus)",0x0C},{"Punctuation","= (equals)",0x0D},{"Punctuation","[",0x1A},{"Punctuation","]",0x1B},{"Punctuation","; (semicolon)",0x27},
              {"Punctuation","' (apostrophe)",0x28},{"Punctuation","` (grave)",0x29},{"Punctuation","\\ (backslash)",0x2B},{"Punctuation",", (comma)",0x33},
              {"Punctuation",". (period)",0x34},{"Punctuation","/ (slash)",0x35},
              {"Numpad","Numpad 0",0x52},{"Numpad","Numpad 1",0x4F},{"Numpad","Numpad 2",0x50},{"Numpad","Numpad 3",0x51},{"Numpad","Numpad 4",0x4B},
              {"Numpad","Numpad 5",0x4C},{"Numpad","Numpad 6",0x4D},{"Numpad","Numpad 7",0x47},{"Numpad","Numpad 8",0x48},{"Numpad","Numpad 9",0x49},
              {"Numpad","Numpad +",0x4E},{"Numpad","Numpad -",0x4A},{"Numpad","Numpad *",0x37},{"Numpad","Numpad /",0xB5},{"Numpad","Numpad .",0x53},{"Numpad","Numpad Enter",0x9C},
          };
          #define CB_N ((int)(sizeof kCbK / sizeof kCbK[0]))
          #define CB_MAX 24
          #define CB_LMB 0x101   /* v84: not scancodes; a button with one of these sends a mouse click */
          #define CB_RMB 0x102
          static NSString *cbKeyName(int dik) {
              if (dik == CB_LMB) return @"Left Click"; if (dik == CB_RMB) return @"Right Click";
              for (int i = 0; i < CB_N; i++) if (kCbK[i].d == dik) return @(kCbK[i].n);
              return [NSString stringWithFormat:@"Key %02X", dik & 0xff];
          }
          static NSString *cbShort(int dik) {   /* what is written in the middle of a button */
              if (dik == CB_LMB) return @"L Click"; if (dik == CB_RMB) return @"R Click";
              switch (dik & 0xff) {
                  case 0xC8: return @"↑"; case 0xD0: return @"↓"; case 0xCB: return @"←"; case 0xCD: return @"→";
                  case 0xC9: return @"PgUp"; case 0xD1: return @"PgDn"; case 0x0E: return @"Bksp"; case 0x3A: return @"Caps";
                  case 0x2A: case 0x36: return @"Shift"; case 0x1D: case 0x9D: return @"Ctrl"; case 0x38: case 0xB8: return @"Alt";
              }
              NSString *n = cbKeyName(dik);
              if ([n hasPrefix:@"Numpad "]) return [@"Num" stringByAppendingString:[n substringFromIndex:7]];
              if (n.length > 1 && [n characterAtIndex:1] == ' ') return [n substringToIndex:1];
              return n;
          }

          @interface CbButton : UIView
          @property (nonatomic) int dik;
          @property (nonatomic, copy) NSString *title;
          @property (nonatomic) CGFloat fx, fy, fw, fh;      /* position and size as fractions of the screen */
          @property (nonatomic) BOOL pressed, dragging;
          @property (nonatomic, strong) UILabel *tl;
          - (instancetype)initWithDik:(int)dik title:(NSString *)t fx:(CGFloat)fx fy:(CGFloat)fy fw:(CGFloat)fw fh:(CGFloat)fh;
          - (void)place;
          - (void)look;
          - (void)press:(BOOL)down;
          @end
          static CbButton *gSelCb;   /* v84: the custom button selected in the editor */
          static void cbSelCb(CbButton *b);
          @interface CbHost : UIView @end
          @implementation CbHost
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e { UIView *v = [super hitTest:p withEvent:e]; return v == self ? nil : v; }   /* empty space passes the touch on to the game */
          @end

          static NSMutableArray<CbButton *> *gCbList;
          static UIView *gCbHost;
          static UIView *gCbGear, *gCbDone, *gCbPlus; static UIButton *gXBtn;
          static NSString *cbPath(void) { return [uiDocs() stringByAppendingPathComponent:@"custom_buttons.txt"]; }
          static void cbSave(void) {
              NSMutableString *s = [NSMutableString stringWithString:@"# custom buttons (v79). btn KEY x y w h LABEL. KEY = DirectInput scancode in hex, x y w h are fractions of the screen.\n"];
              for (CbButton *b in gCbList) [s appendFormat:@"btn %02X %.4f %.4f %.4f %.4f %@\n", b.dik, b.fx, b.fy, b.fw, b.fh, b.title];
              [s writeToFile:cbPath() atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static void cbSetEdit(BOOL on) {
              gCbEdit = on; ownReleaseAll(); cbSelClear();
              for (CbButton *b in gCbList) { b.dragging = NO; [b press:NO]; [b look]; }
              ownRefresh();
              [NSNotificationCenter.defaultCenter postNotificationName:@"P2CbEdit" object:nil];
          }
          static void cbReleaseAll(void) { for (CbButton *b in gCbList) [b press:NO]; }
          static void cbFront(void) { if (gXBtn) [gCbHost bringSubviewToFront:gXBtn]; if (gCbGear) [gCbHost bringSubviewToFront:gCbGear]; if (gCbPlus) [gCbHost bringSubviewToFront:gCbPlus]; if (gCbDone) [gCbHost bringSubviewToFront:gCbDone]; }
          static BOOL cbAdd(int dik, NSString *title) {
              if (!gCbHost || gCbList.count >= CB_MAX) return NO;
              NSUInteger n = gCbList.count % 5;
              CbButton *b = [[CbButton alloc] initWithDik:dik title:title fx:0.42 + 0.03 * n fy:0.34 + 0.05 * n fw:0.08 fh:0.17];
              [gCbList addObject:b]; [gCbHost addSubview:b]; [b place]; cbFront(); cbSave();
              p2_note([NSString stringWithFormat:@"CUSTOMBTN: added \"%@\" -> key 0x%02X (%d buttons)", b.title, dik & 0xff, (int)gCbList.count].UTF8String);
              if (!gCbEdit) cbSetEdit(YES);   /* v84: the editor is already open when this comes from the + list */
              cbSelCb(b);                      /* the new button is selected: its x shows and a pinch resizes it */
              return YES;
          }
          static void cbRemove(CbButton *b) {
              [b press:NO]; [b removeFromSuperview]; [gCbList removeObject:b]; cbSave();
              p2_note([NSString stringWithFormat:@"CUSTOMBTN: removed \"%@\" (%d buttons left)", b.title, (int)gCbList.count].UTF8String);
          }
          static void cbLoad(UIView *host) {
              if (!gCbList) gCbList = [NSMutableArray new];
              NSString *txt = [NSString stringWithContentsOfFile:cbPath() encoding:NSUTF8StringEncoding error:nil];
              for (NSString *line in [txt componentsSeparatedByString:@"\n"]) {
                  if (gCbList.count >= CB_MAX) break;
                  if (![line hasPrefix:@"btn "]) continue;
                  NSArray *p = [line componentsSeparatedByString:@" "];
                  if (p.count < 7) continue;
                  unsigned k = 0;
                  if (![[NSScanner scannerWithString:p[1]] scanHexInt:&k] || k < 1 || k > CB_RMB) continue;
                  CGFloat fx = [p[2] doubleValue], fy = [p[3] doubleValue], fw = [p[4] doubleValue], fh = [p[5] doubleValue];
                  if (fw < 0.03 || fh < 0.05 || fw > 0.5 || fh > 0.6) continue;
                  NSString *t = [[p subarrayWithRange:NSMakeRange(6, p.count - 6)] componentsJoinedByString:@" "];
                  CbButton *b = [[CbButton alloc] initWithDik:(int)k title:t fx:fx fy:fy fw:fw fh:fh];
                  [gCbList addObject:b]; [host addSubview:b];
              }
              p2_note([NSString stringWithFormat:@"CUSTOMBTN: %d buttons loaded from %@", (int)gCbList.count, cbPath()].UTF8String);
          }

          /* ---- v84: selection, the little x, pinch resize ---- */
          @interface CbXBtn : UIButton @end
          @implementation CbXBtn
          - (BOOL)pointInside:(CGPoint)p withEvent:(UIEvent *)e { return CGRectContainsPoint(CGRectInset(self.bounds, -8, -8), p); }   /* the circle is small, give the finger some slack */
          @end
          static void ownDeleteAt(int i) {
              if (i < 0 || i >= gOwnN || gOwn[i].kind != 0) return;
              if (gOwnLay[i]) [gOwnLay[i] removeFromSuperlayer];
              for (int j = i; j < gOwnN - 1; j++) { gOwn[j] = gOwn[j + 1]; gOwnLay[j] = gOwnLay[j + 1]; }
              gOwnN--; gOwnLay[gOwnN] = nil;
              for (int q = 0; q < 10; q++) { gOwnDrag[q] = 0; gOwnBy[q] = 0; }
              ownSave(); if (gOwnView) ownLayoutAll(gOwnView.bounds.size);
          }
          static void cbSelRestyle(void) { for (CbButton *b in gCbList) [b look]; ownRefresh(); }
          static void cbSelUpdate(void) {   /* the x sits on the circle's edge at the top right (45 degrees) and grows with the button; the stick never gets one */
              if (!gXBtn || !gCbHost) return;
              CGRect c = CGRectZero; BOOL show = NO;
              if (gCbEdit) {
                  if (gSelCb && gSelCb.superview) { c = gSelCb.frame; show = YES; }
                  else if (gSelOwn >= 0 && gSelOwn < gOwnN && gOwn[gSelOwn].kind == 0) { c = ownCircle(&gOwn[gSelOwn], gCbHost.bounds.size); show = YES; }
              }
              gXBtn.hidden = !show; if (!show) return;
              CGFloat r = c.size.width / 2, d = MAX(22.0, c.size.width * 0.36); static CGFloat lastD;
              gXBtn.bounds = CGRectMake(0, 0, d, d); gXBtn.layer.cornerRadius = d / 2;
              gXBtn.center = CGPointMake(CGRectGetMidX(c) + r * 0.7071, CGRectGetMidY(c) - r * 0.7071);
              if (fabs(d - lastD) > 0.5) { lastD = d; [gXBtn setImage:[UIImage systemImageNamed:@"xmark" withConfiguration:[UIImageSymbolConfiguration configurationWithPointSize:d * 0.45 weight:UIImageSymbolWeightBold]] forState:UIControlStateNormal]; }
              [gCbHost bringSubviewToFront:gXBtn];
          }
          static void cbSelClear(void) { gSelCb = nil; gSelOwn = -1; cbSelRestyle(); cbSelUpdate(); }
          static void cbSelCb(CbButton *b) { gSelCb = b; gSelOwn = -1; cbSelRestyle(); cbSelUpdate(); }
          static void cbSelOwn(int i) { gSelCb = nil; gSelOwn = i; cbSelRestyle(); cbSelUpdate(); }
          static void cbSelDelete(void) {
              if (gSelCb) { CbButton *b = gSelCb; gSelCb = nil; cbRemove(b); }
              else if (gSelOwn >= 0) { int i = gSelOwn; gSelOwn = -1; ownDeleteAt(i); }
              cbSelRestyle(); cbSelUpdate();
          }
          static CGFloat gPinchBase[2], gPinchLast = 1.0;   /* v85: the last scale the fingers reached */
          static void cbPinchBegin(void) {
              gCbPinch = YES; gPinchLast = 1.0;
              for (CbButton *b in gCbList) b.dragging = NO;
              for (int q = 0; q < 10; q++) gOwnDrag[q] = 0;
              if (gSelCb) { gPinchBase[0] = gSelCb.fw; gPinchBase[1] = gSelCb.fh; }
              else if (gSelOwn >= 0 && gSelOwn < gOwnN) { gPinchBase[0] = gOwn[gSelOwn].w; gPinchBase[1] = gOwn[gSelOwn].h; }
          }
          static void cbPinchApply(CGFloat sc, BOOL final) {
              gPinchLast = sc;
              CGFloat w0 = gPinchBase[0], h0 = gPinchBase[1];
              if (gSelCb) {
                  CbButton *b = gSelCb; if (w0 < 0.001 || h0 < 0.001) return;
                  CGFloat cx = b.fx + b.fw / 2, cy = b.fy + b.fh / 2;
                  CGFloat m = MAX(MAX(0.04 / w0, 0.08 / h0), MIN(sc, MIN(0.30 / w0, 0.45 / h0)));
                  b.fw = w0 * m; b.fh = h0 * m;
                  b.fx = MAX(0, MIN(cx - b.fw / 2, 1.0 - b.fw)); b.fy = MAX(0, MIN(cy - b.fh / 2, 1.0 - b.fh));
                  [b place]; if (final) cbSave();
              } else if (gSelOwn >= 0 && gSelOwn < gOwnN) {
                  OwnEl *e = &gOwn[gSelOwn];
                  if (e->kind == 1 || e->kind == 3) e->w = (float)MAX(0.08, MIN(0.30, w0 * sc));   /* the stick: radius as a fraction of the screen height */
                  else if (e->kind == 0 && w0 > 0.001 && h0 > 0.001) {
                      float cx = e->x + e->w / 2, cy = e->y + e->h / 2;
                      CGFloat m = MAX(MAX(0.04 / w0, 0.08 / h0), MIN(sc, MIN(0.30 / w0, 0.45 / h0)));
                      e->w = (float)(w0 * m); e->h = (float)(h0 * m);
                      e->x = MAX(0.0f, MIN(cx - e->w / 2, 1.0f - e->w)); e->y = MAX(0.0f, MIN(cy - e->h / 2, 1.0f - e->h));
                  } else return;
                  if (gOwnView) ownLayoutAll(gOwnView.bounds.size);
                  if (final) ownSave();
              }
              cbSelUpdate();
          }
          /* v85 fix: v84 finished with cbPinchApply(1.0, YES), i.e. scale 1.0 = the size from before the pinch, so every resize snapped back on release. It now saves the last scale reached. */
          static void cbPinchEnd(void) { cbPinchApply(gPinchLast, YES); gCbPinch = NO; }

          @implementation CbButton
          - (instancetype)initWithDik:(int)dik title:(NSString *)t fx:(CGFloat)fx fy:(CGFloat)fy fw:(CGFloat)fw fh:(CGFloat)fh {
              self = [super initWithFrame:CGRectMake(0, 0, 60, 60)];
              _dik = dik; _title = cbShort(dik); _fx = fx; _fy = fy; _fw = fw; _fh = fh;
              self.userInteractionEnabled = YES; self.multipleTouchEnabled = NO;
              self.layer.borderWidth = 2;
              _tl = [UILabel new]; _tl.text = _title; _tl.font = [UIFont systemFontOfSize:14 weight:UIFontWeightBold]; _tl.textColor = UIColor.whiteColor;
              _tl.textAlignment = NSTextAlignmentCenter; _tl.adjustsFontSizeToFitWidth = YES; _tl.minimumScaleFactor = 0.5; _tl.userInteractionEnabled = NO;
              [self addSubview:_tl]; [self look];
              return self;
          }
          - (void)layoutSubviews {
              [super layoutSubviews]; CGFloat d = MIN(self.bounds.size.width, self.bounds.size.height);
              self.layer.cornerRadius = d / 2; self.tl.frame = CGRectInset(self.bounds, d * 0.1, d * 0.1);
          }
          - (void)place {
              CGSize s = self.superview.bounds.size; if (self.dragging || s.width < 1 || s.height < 1) return;
              CGFloat W = self.fw * s.width, H = self.fh * s.height, d = MIN(W, H);   /* a circle inscribed in the box, centred in it */
              self.frame = CGRectMake(self.fx * s.width + (W - d) / 2, self.fy * s.height + (H - d) / 2, d, d);
          }
          - (void)look {
              BOOL sel = gCbEdit && gSelCb == self;
              self.backgroundColor = [UIColor colorWithWhite:self.pressed ? 1.0 : 0.0 alpha:self.pressed ? 0.45 : 0.25];
              self.layer.borderColor = (sel ? UIColor.whiteColor : gCbEdit ? UIColor.systemYellowColor : [UIColor colorWithWhite:1 alpha:0.8]).CGColor;
              self.layer.borderWidth = sel ? 3 : 2;
          }
          - (void)press:(BOOL)down {
              if (down == self.pressed) return;
              self.pressed = down; if (self.dik >= CB_LMB) p2_mouse(self.dik == CB_LMB ? 0 : 1, down ? 1 : 0); else p2_key(self.dik, down ? 1 : 0); [self look];
          }
          - (void)touchesBegan:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e { if (gCbEdit) { self.dragging = YES; cbSelCb(self); } else [self press:YES]; }
          - (void)touchesMoved:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e {
              if (!gCbEdit || !self.dragging || gCbPinch) return;
              UITouch *t = ts.anyObject; CGPoint p = [t locationInView:self.superview], q = [t previousLocationInView:self.superview];
              CGRect b = self.superview.bounds, f = self.frame; f.origin.x += p.x - q.x; f.origin.y += p.y - q.y;
              f.origin.x = MAX(0, MIN(f.origin.x, b.size.width - f.size.width)); f.origin.y = MAX(0, MIN(f.origin.y, b.size.height - f.size.height));
              self.frame = f; cbSelUpdate();
          }
          - (void)finishTouch {
              if (gCbEdit) {
                  if (!self.dragging) return;
                  self.dragging = NO; CGSize s = self.superview.bounds.size;
                  if (s.width > 1 && s.height > 1) { self.fx = (CGRectGetMidX(self.frame) - self.fw * s.width / 2) / s.width; self.fy = (CGRectGetMidY(self.frame) - self.fh * s.height / 2) / s.height; cbSave(); }
              } else [self press:NO];
          }
          - (void)touchesEnded:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e { [self finishTouch]; }
          - (void)touchesCancelled:(NSSet<UITouch *> *)ts withEvent:(UIEvent *)e { [self finishTouch]; }
          @end

