                  for (size_t i = 0; i < sizeof K / sizeof K[0]; i++)
                      if (K[i].pre ? strncmp(c, K[i].n, strlen(K[i].n)) == 0 : strcmp(c, K[i].n) == 0) { meaning = K[i].m; break; }
                  [self note:[NSString stringWithFormat:@"  %@  ->  %s", nm, meaning ? meaning : "not a known switch (ignored)"].UTF8String]; n++;
              }
              if (!n) [self note:"  (no flag folders)"];
              [self note:"  no folder = defaults: 120 Hz lock on, RBTRACE on, WAITTRACE on, waitspin 1000 us, QoS interactive, rt_render off, futex on, LOAD_OP rewrite on"];
          }
          - (void)hzTick:(CADisplayLink *)l { tcTick(l); }   /* v69: still no real work unless touch_trace or touch_coalesce is on; the link mainly tells iOS which refresh rate this app wants */
          - (void)publishFlags { if (gFlags.length > 1000) [gFlags deleteCharactersInRange:NSMakeRange(1000, gFlags.length - 1000)]; p2_boot_flags = strdup(gFlags.UTF8String); }
          - (void)startHz {
              NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];
              NSFileManager *fm = NSFileManager.defaultManager;
              NSInteger maxHz = UIScreen.mainScreen.maximumFramesPerSecond;
              p2_set_tick(1.0 / (double)(maxHz > 0 ? maxHz : 60));   /* v82: the pan clock steps in whole screen refreshes */
              float want = 120;
              BOOL off = [fm fileExistsAtPath:[docs stringByAppendingPathComponent:@"hz_off"]];
              if ([fm fileExistsAtPath:[docs stringByAppendingPathComponent:@"hz_90"]]) want = 90;
              if ([fm fileExistsAtPath:[docs stringByAppendingPathComponent:@"hz_60"]]) want = 60;
              if (off) { [self note:"HZ: hz_off folder present, display rate left to iOS"]; [self publishFlags]; return; }
              if (maxHz < 120 && want > maxHz) { [self note:[NSString stringWithFormat:@"HZ: display tops out at %ld Hz, nothing to lock (need a ProMotion screen)", (long)maxHz].UTF8String]; [self publishFlags]; return; }
              gHzLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(hzTick:)];
              gHzLink.preferredFrameRateRange = CAFrameRateRangeMake(want, want, want);
              p2_set_tick(1.0 / (double)want);
              [gHzLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              [self note:[NSString stringWithFormat:@"HZ: locked display to %.0f Hz (screen max %ld Hz, CADisableMinimumFrameDurationOnPhone set). Folders: hz_off, hz_90, hz_60", want, (long)maxHz].UTF8String]; [self publishFlags];
          }
          - (void)applicationDidReceiveMemoryWarning:(UIApplication *)a { p2_note("iOS: MEMORY WARNING received"); }
          - (void)applicationWillResignActive:(UIApplication *)a { p2_note("iOS: app will resign active (home gesture, control centre or a system overlay)"); }
          - (void)applicationDidEnterBackground:(UIApplication *)a { p2_note("iOS: app entered the background"); }
          - (void)applicationWillTerminate:(UIApplication *)a { p2_note("iOS: applicationWillTerminate"); }
          - (void)applyHz { gTcLink = NO; tcFlush(); [gHzLink invalidate]; gHzLink = nil; [self startHz]; }
          - (BOOL)application:(UIApplication *)a didFinishLaunchingWithOptions:(NSDictionary *)o {
              gText = [NSMutableString string];
              { NSUserDefaults *ud = NSUserDefaults.standardUserDefaults;   /* nosplash is ON by default: create the folder once, on the first launch of v66; after that the user's choice sticks */
                if (![ud boolForKey:@"nosplash_seeded"]) { uiSet(@"nosplash", YES); [ud setBool:YES forKey:@"nosplash_seeded"]; }
                if (![ud boolForKey:@"traces_off_seeded"]) { uiSet(@"rbtrace_off", YES); uiSet(@"waittrace_off", YES); uiSet(@"textrace_off", YES); [ud setBool:YES forKey:@"traces_off_seeded"]; } }
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              gView = [[UITextView alloc] initWithFrame:CGRectZero];
              gView.editable = NO; gView.selectable = YES; gView.font = [UIFont fontWithName:@"Menlo" size:10]; gView.backgroundColor = UIColor.blackColor; gView.textColor = UIColor.greenColor;
              gGame = [[GameView alloc] initWithFrame:UIScreen.mainScreen.bounds];
              CAMetalLayer *ml = (CAMetalLayer *)gGame.layer; ml.device = MTLCreateSystemDefaultDevice(); ml.pixelFormat = MTLPixelFormatBGRA8Unorm;
              ml.contentsScale = UIScreen.mainScreen.nativeScale; gGame.backgroundColor = UIColor.blackColor; gGame.multipleTouchEnabled = YES; gGame.userInteractionEnabled = YES;
              RootVC *vc = [RootVC new]; vc.game = gGame;
              vc.onPlay = ^{ [self run]; };
              vc.onHz = ^{ [self applyHz]; };
              self.window.rootViewController = vc; [self.window makeKeyAndVisible]; [self startFlags]; [self startHz]; return YES;
          }
          - (void)run {
              if (gRan) { emit("(already ran in this launch: close the app from the app switcher and open it again to repeat)"); return; }
              gRan = YES;
              NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];
              sFw = [[NSBundle mainBundle].privateFrameworksPath stringByAppendingString:@"/P2Code.framework/P2Code"];
              sRes = [NSBundle mainBundle].resourcePath;
              sRep = [docs stringByAppendingString:@"/p2_loader_log.txt"];
              { CGFloat sc = UIScreen.mainScreen.nativeScale; CGSize b = gGame.bounds.size;
            p2_win_w = (int)(b.width * sc); p2_win_h = (int)(b.height * sc); p2_metal_layer = (__bridge void *)gGame.layer;
            emit([NSString stringWithFormat:@"game surface %dx%d px (landscape is locked)", p2_win_w, p2_win_h].UTF8String); }
          emit("loader started on a background thread; this screen updates while it runs");
              NSThread *t = [[NSThread alloc] initWithBlock:^{ p2_run(emit, sFw.UTF8String, sRes.UTF8String, sRep.UTF8String); }];
              t.stackSize = 16 << 20; t.name = @"p2-loader"; [t start];
          }
          @end

          int main(int argc, char **argv) { @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AD"); } }
          EOF_MAIN_M
          APP=Payload/P2Loader.app
          mkdir -p $APP/Frameworks/P2Code.framework
          MVK_LINK=""
          if [ -d mvk/fw/MoltenVK.framework ]; then cp -R mvk/fw/MoltenVK.framework $APP/Frameworks/ && echo "MoltenVK: dynamic framework embedded";
          elif [ -f mvk/static/libMoltenVK.a ]; then MVK_LINK="-Wl,-force_load,mvk/static/libMoltenVK.a -lc++ -framework CoreGraphics -framework IOSurface"; echo "MoltenVK: static library linked";
          else echo "MoltenVK missing"; exit 1; fi
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -fobjc-arc -O1 -framework UIKit -framework Foundation -framework Metal -framework QuartzCore -framework AudioToolbox -framework AVFoundation -framework CoreGraphics $MVK_LINK main.m p2core.c p2imports.c p2stubs.s p2asm.s -o $APP/P2Loader
          cp P2Code $APP/Frameworks/P2Code.framework/P2Code
          cp p2data.bin p2relocs.bin p2names.bin p2tls.bin p2phdr.bin $APP/
          unzip -q -o ../game.apk 'assets/*' -d $APP/ && du -sh $APP/assets || echo 'no assets in apk'
          cat > $APP/Frameworks/P2Code.framework/Info.plist <<'EOF_FWPLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>P2Code</string>
          <key>CFBundleIdentifier</key><string>com.p2ios.p2code</string>
          <key>CFBundlePackageType</key><string>FMWK</string>
          <key>CFBundleName</key><string>P2Code</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>MinimumOSVersion</key><string>15.0</string>
          </dict></plist>
          EOF_FWPLIST
          cat > $APP/Info.plist <<'EOF_APPPLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>P2Loader</string>
          <key>CFBundleIdentifier</key><string>com.p2ios.loader</string>
          <key>CFBundleName</key><string>Prototype 2</string>
          <key>CFBundleDisplayName</key><string>Prototype 2</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>66</string>
          <key>CFBundleShortVersionString</key><string>1.0.7</string>
          <key>CFBundleIcons</key><dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array></dict></dict>
          <key>MinimumOSVersion</key><string>15.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
          <key>UILaunchScreen</key><dict/>
          <key>UIFileSharingEnabled</key><true/>
          <key>CADisableMinimumFrameDurationOnPhone</key><true/>
          <key>LSSupportsOpeningDocumentsInPlace</key><true/>
          </dict></plist>
          EOF_APPPLIST
          # ---- v66: app icon. Order: icon_url input, then p2-icon.png in the repo root, then the best launcher PNG inside the APK ----
          mkdir -p ../iconwork && ( . ../.venv/bin/activate && pip install -q pillow )
          ICON_SRC=""
          if [ -n "$ICON_URL" ]; then
            case "$ICON_URL" in
              *drive.google.com*) IID=$(echo "$ICON_URL" | sed -E 's#.*/d/([^/]+).*#\1#'); ( . ../.venv/bin/activate && gdown "https://drive.google.com/uc?id=$IID" -O ../iconwork/user-icon.png ) && ICON_SRC=../iconwork/user-icon.png || echo "icon_url download failed, falling back" ;;
              *) curl -fL "$ICON_URL" -o ../iconwork/user-icon.png && ICON_SRC=../iconwork/user-icon.png || echo "icon_url download failed, falling back" ;;
            esac
            [ -n "$ICON_SRC" ] && echo "ICON: using icon_url"
          fi
          if [ -z "$ICON_SRC" ] && [ -f "$GITHUB_WORKSPACE/p2-icon.png" ]; then ICON_SRC="$GITHUB_WORKSPACE/p2-icon.png"; echo "ICON: using p2-icon.png from the repo root"; fi
          cat > ../iconwork/mkicon.py <<'EOF_ICON_PY'
          import sys, os, io, zipfile
          from PIL import Image
          app, apk, src = sys.argv[1], sys.argv[2], (sys.argv[3] if len(sys.argv) > 3 else "")
          img = None
          if src and os.path.exists(src):
              img = Image.open(src)
          else:
              cands = []
              z = zipfile.ZipFile(apk)
              for n in z.namelist():
                  low = n.lower()
                  if not low.endswith(".png"): continue
                  if not any(k in low for k in ("launcher", "icon", "logo")): continue
                  try:
                      im = Image.open(io.BytesIO(z.read(n))); cands.append((n, im.size))
                  except Exception: pass
              print("ICON candidates inside the APK (name, size):")
              for n, s in sorted(cands, key=lambda c: -c[1][0] * c[1][1])[:40]: print("   ", n, s)
              def bad(n): return any(k in n.lower() for k in ("foreground", "background", "monochrome", "round", "notification", "splash"))
              good = [c for c in cands if "ic_launcher" in c[0].lower() and not bad(c[0])] or [c for c in cands if not bad(c[0])]
              if good:
                  pick = max(good, key=lambda c: c[1][0] * c[1][1]); print("ICON: picked", pick[0], pick[1])
                  img = Image.open(io.BytesIO(z.read(pick[0])))
          if img is None:
              print("ICON: nothing found. Commit a square 1024x1024 PNG named p2-icon.png to the repo root, or pass icon_url, then run again."); sys.exit(0)
          img = img.convert("RGBA"); w, h = img.size; s = min(w, h)
          img = img.crop(((w - s) // 2, (h - s) // 2, (w - s) // 2 + s, (h - s) // 2 + s))
          flat = Image.new("RGB", img.size, (0, 0, 0)); flat.paste(img, mask=img.split()[3])   # iOS icons must not be transparent
          for name, px in (("LauncherIcon.png", 1024), ("AppIcon60x60@3x.png", 180), ("AppIcon60x60@2x.png", 120)):
              flat.resize((px, px), Image.LANCZOS).save(os.path.join(app, name)); print("ICON wrote", name, px)
          EOF_ICON_PY
          ( . ../.venv/bin/activate && python3 ../iconwork/mkicon.py "$APP" ../game.apk "$ICON_SRC" ) 2>&1 | tee ../iconwork/icon.log
          rm -f "Prototype 2.ipa"
          zip -qry "Prototype 2.ipa" Payload
          ls -l "Prototype 2.ipa"
      - name: Step summary (paste this back)
        if: always()
        continue-on-error: true
        run: |
          set +e
          { echo '```'; head -c 60000 disasm/disasm.txt 2>/dev/null; echo '--- x18 uses (first 60) ---'; head -n 60 disasm/x18.txt 2>/dev/null; echo '--- dev debug-switch strings (first 700 lines) ---'; head -n 700 disasm/markers.txt 2>/dev/null; echo '```'; } >> $GITHUB_STEP_SUMMARY
          { echo '```'; cat src/prep-report.md 2>/dev/null | cut -c1-600; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Upload report (counts + short instruction snippets, no binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-prep-report
          path: src/prep-report.md
      - name: Upload IPA (contains patched game code, private repo only)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.inspect_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Prototype-2-ipa
          path: "src/Prototype 2.ipa"
          retention-days: 1
