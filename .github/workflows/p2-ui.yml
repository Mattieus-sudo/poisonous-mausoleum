              UIView *bgd = [[UIView alloc] initWithFrame:bgv.bounds]; bgd.backgroundColor = [UIColor colorWithRed:0.075 green:0.008 blue:0.018 alpha:0.28];
              bgd.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight; [bgv addSubview:bgd];

              /* One-time opening lightning strike: glow, white-hot core and screen flash. */
