              launchGlow.shadowColor = [UIColor colorWithRed:0.18 green:0.58 blue:1 alpha:1].CGColor;
              launchGlow.shadowRadius = 28;
              launchGlow.shadowOpacity = 1;
              launchGlow.opacity = 0;
              [bgv.layer addSublayer:launchGlow];

              CAShapeLayer *launchCore = [CAShapeLayer layer];
              launchCore.frame = bgv.bounds;
              launchCore.path = openingBolt.CGPath;
              launchCore.fillColor = UIColor.clearColor.CGColor;
              launchCore.strokeColor = [UIColor colorWithRed:0.88 green:0.96 blue:1 alpha:1].CGColor;
              launchCore.lineWidth = 4.5;
              launchCore.lineCap = kCALineCapRound;
              launchCore.lineJoin = kCALineJoinRound;
              launchCore.shadowColor = UIColor.whiteColor.CGColor;
              launchCore.shadowRadius = 16;
