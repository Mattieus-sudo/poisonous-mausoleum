              self.listGlass = [[UIVisualEffectView alloc] initWithEffect:p2GlassEffect()]; p2StyleGlassView(self.listGlass, 32); [self.menu addSubview:self.listGlass];

              self.icon = [[UIImageView alloc] initWithImage:[UIImage imageNamed:@"LauncherIcon"]];
              self.icon.backgroundColor = UIColor.secondarySystemFillColor; self.icon.clipsToBounds = YES; self.icon.contentMode = UIViewContentModeScaleAspectFill;
              self.icon.layer.cornerCurve = kCACornerCurveContinuous; [self.menu addSubview:self.icon];
              self.name = [self label:@"Prototype 2" size:34 weight:UIFontWeightBold color:UIColor.whiteColor];
