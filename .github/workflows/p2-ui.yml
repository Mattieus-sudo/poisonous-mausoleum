              panel.autoresizingMask = UIViewAutoresizingNone; [self.view addSubview:panel]; self.addPanel = panel;
              KeyPickerVC *kp = [KeyPickerVC new]; __weak RootVC *weakSelf = self;
              kp.onClose = ^{ [weakSelf closeAddPanel]; };
              kp.onPick = ^(int code) { if (code == CB_RSTICK) rsToggle(); else cbAdd(code, cbShort(code)); [weakSelf closeAddPanel]; };
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:kp]; nav.overrideUserInterfaceStyle = UIUserInterfaceStyleDark;
              nav.view.backgroundColor = UIColor.clearColor; nav.view.opaque = NO; nav.view.clipsToBounds = YES;
              nav.navigationBar.translucent = YES; nav.navigationBar.backgroundColor = UIColor.clearColor; nav.navigationBar.barTintColor = UIColor.clearColor;
              UINavigationBarAppearance *appearance = [UINavigationBarAppearance new]; [appearance configureWithTransparentBackground]; appearance.titleTextAttributes = @{NSForegroundColorAttributeName: UIColor.whiteColor};
              nav.navigationBar.standardAppearance = appearance; nav.navigationBar.scrollEdgeAppearance = appearance; nav.navigationBar.compactAppearance = appearance;
              [self addChildViewController:nav]; [panel.contentView addSubview:nav.view]; [nav didMoveToParentViewController:self]; self.addNav = nav;
              [self.view bringSubviewToFront:shade]; [self.view bringSubviewToFront:panel];
              [self.view setNeedsLayout]; [self.view layoutIfNeeded];
              [UIView animateWithDuration:0.2 delay:0 options:UIViewAnimationOptionCurveEaseOut animations:^{ panel.alpha = 1; if (p2HasGlass()) panel.effect = p2GlassEffect(); } completion:nil];
          }
          - (void)closeAddPanel {
              if (!self.addPanel) return;
              UIView *shade = self.addBackdrop; UIVisualEffectView *panel = self.addPanel; UINavigationController *nav = self.addNav;
              self.addBackdrop = nil; self.addPanel = nil; self.addNav = nil;
              [UIView animateWithDuration:0.16 animations:^{ panel.alpha = 0; if (p2HasGlass()) panel.effect = nil; } completion:^(BOOL done) {
                  [nav willMoveToParentViewController:nil]; [nav.view removeFromSuperview]; [nav removeFromParentViewController];
