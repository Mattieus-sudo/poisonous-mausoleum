              [launchGlow addAnimation:openingStrike forKey:@"p2-opening-lightning"];
              [launchCore addAnimation:openingStrike forKey:@"p2-opening-core"];

              CAKeyframeAnimation *openingFlash = [CAKeyframeAnimation animationWithKeyPath:@"opacity"];
              openingFlash.values = @[@0, @0.48, @0];
              openingFlash.keyTimes = @[@0, @0.16, @1];
              openingFlash.duration = 0.72;
              openingFlash.beginTime = CACurrentMediaTime() + 0.35;
