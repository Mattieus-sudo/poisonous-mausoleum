                  {"hz_off",0,"120 Hz lock OFF"}, {"seeded_nosplash",0,"first-run default (skip splash) already applied"}, {"seeded_traces_off",0,"first-run default (traces off) already applied"}, {"seeded_own_layout",0,"first-run default (own controls on) already applied"}, {"rt_render",0,"render thread real-time policy ON (6000 us budget)"}, {"hz_90",0,"display locked to 90 Hz"}, {"hz_60",0,"display locked to 60 Hz"},
