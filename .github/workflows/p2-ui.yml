                  {"qos_off",0,"thread QoS left at default"}, {"qos_initiated",0,"thread QoS USER_INITIATED"},
                  {"vk_loadop_fix_off",0,"LOAD_OP_NONE rewrite OFF"}, {"vkshot",0,"vkshot"}, {"vktrace_now",0,"VKTRACE dump now"},
                  {"settle_s6",0,"settle at state 6"}, {"swapchain_alpha_keep",0,"keep swapchain alpha"}, {"imgdelay_all",0,"image delay for all images"},
                  {"mvk_argbuf_off",0,"MoltenVK argument buffers OFF"}, {"mvk_dumpshaders",0,"MoltenVK dump shaders"},
                  {"mvk_fastmath_auto",0,"MoltenVK fast math auto"}, {"mvk_fastmath_on",0,"MoltenVK fast math ON (default since v72)"}, {"mvk_fastmath_off",0,"MoltenVK fast math OFF"}, {"shadowmin_off",0,"built-in shadow min OFF (every caster drawn)"}, {"passtime_on",0,"PASSSIG pass signature log"}, {"passskip_",1,"skip the draws of pass signature K (diagnostic)"}, {"ringsprint_",1,"stick sprints past a ring in ANY direction, radius N per mille of screen height"}, {"inputtap_on",0,"INPUTTAP log: finger movement vs what the game receives"}, {"mvk_log_info",0,"MoltenVK info logging"},
                  {"own_layout",0,"own controls on (v76)"}, {"rstick_on",0,"right camera stick added to own controls (v87)"}, {"rstick_speed_",1,"right stick: full push in percent of screen width per second (v87)"}, {"rstick_vert_",1,"right stick: up/down speed in percent (v87)"}, {"rstick_invy",0,"right stick: flip up/down (v87)"}, {"ovl_trace",0,"dev overlay measured (v75)"}, {"ovl_hide",0,"dev overlay hidden (v75)"}, {"ovl_off",0,"dev overlay builder not called (v75)"}, {"passtrace_now",0,"dev one-frame pass trace trigger (v75)"}, {"drawtrace_now",0,"dev one-frame draw trace trigger (v75)"}, {"dbgoff_",1,"dev renderer feature switched off via debugoff file (v75)"}, {"env",0,"env switch (see loader help)"}, {"nosplash",0,"skip the autosave splash and the Disclaimer (the original port credits EliteMV; credited in the launcher instead)"},
                  {"fakeaspect_",1,"fake screen aspect ratio x 10000 (loader writes Documents/fake_aspect)"}, {"touch_coalesce",0,"touch moves coalesced to one per display tick"}, {"inputtap_on",0,"INPUTTAP lines: raw finger px vs what the loader handed the game per frame (v81)"}, {"touch_trace",0,"touch trace (logs TOUCHTRACE lines while touching)"}, {"waitspin_",1,"wait spin in us"}, {"rt_render_",1,"render thread real-time policy, budget in us"}, {"imgdelay_",1,"image delay"}, {"sleepcap_",1,"guest sleep cap in us"},
                  {"hold_s5_",1,"hold at state 5"}, {"hold_s6_",1,"hold at state 6"}, {"ncpu_",1,"reported CPU count"},
