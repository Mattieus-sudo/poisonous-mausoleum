          - (void)openSettingsPanel {
              if (self.settingsPanel) return;
              p2_settings_open = 1;   /* v105: the present hook only polls p2.cfg while this is 1 */
              cbSetEdit(NO); cbReleaseAll();
              UIView *shade = [[UIView alloc] initWithFrame:self.view.bounds]; shade.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              shade.backgroundColor = [UIColor colorWithWhite:0 alpha:(p2HasGlass() ? 0.18 : 0.30)];
              UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(closeSettingsPanel)]; [shade addGestureRecognizer:tap];
              shade.alpha = 0; [self.view addSubview:shade]; self.settingsBackdrop = shade;
              UIVisualEffectView *panel = [[UIVisualEffectView alloc] initWithEffect:(p2HasGlass() ? nil : p2GlassEffect())];   /* v86: glass materializes in the animation below */
              panel.alpha = 0; p2StyleGlassView(panel, 28);
              panel.autoresizingMask = UIViewAutoresizingNone; [self.view addSubview:panel]; self.settingsPanel = panel;
              HostSettingsVC *root = [HostSettingsVC new]; __weak RootVC *weakSelf = self; root.onClose = ^{ [weakSelf closeSettingsPanel]; };
              root.onEdit = ^{ [weakSelf closeSettingsPanel]; cbSetEdit(YES); };   /* v84: straight to the game screen, no menu in between */
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:root]; nav.overrideUserInterfaceStyle = UIUserInterfaceStyleDark;
              nav.view.backgroundColor = UIColor.clearColor; nav.view.opaque = NO; nav.view.clipsToBounds = YES;
              nav.navigationBar.translucent = YES; nav.navigationBar.backgroundColor = UIColor.clearColor; nav.navigationBar.barTintColor = UIColor.clearColor;
              UINavigationBarAppearance *appearance = [UINavigationBarAppearance new]; [appearance configureWithTransparentBackground]; appearance.titleTextAttributes = @{NSForegroundColorAttributeName: UIColor.whiteColor}; appearance.largeTitleTextAttributes = @{NSForegroundColorAttributeName: UIColor.whiteColor};
              nav.navigationBar.standardAppearance = appearance; nav.navigationBar.scrollEdgeAppearance = appearance; nav.navigationBar.compactAppearance = appearance;
              [self addChildViewController:nav]; [panel.contentView addSubview:nav.view]; [nav didMoveToParentViewController:self]; self.settingsNav = nav;
              [self.view bringSubviewToFront:shade]; [self.view bringSubviewToFront:panel];
              [UIView animateWithDuration:0.22 delay:0 options:UIViewAnimationOptionCurveEaseOut animations:^{ shade.alpha = 1; panel.alpha = 1; if (p2HasGlass()) panel.effect = p2GlassEffect(); } completion:nil];
              [self.view setNeedsLayout]; [self.view layoutIfNeeded];
          }
          - (void)closeSettingsPanel {
              if (!self.settingsPanel) return;
              p2_settings_open = 0;
              UIView *shade = self.settingsBackdrop; UIVisualEffectView *panel = self.settingsPanel; UINavigationController *nav = self.settingsNav;
              [UIView animateWithDuration:0.18 animations:^{ shade.alpha = 0; panel.alpha = 0; if (p2HasGlass()) panel.effect = nil; } completion:^(BOOL done) {
                  [nav willMoveToParentViewController:nil]; [nav.view removeFromSuperview]; [nav removeFromParentViewController];
                  [panel removeFromSuperview]; [shade removeFromSuperview];
              }];
              self.settingsBackdrop = nil; self.settingsPanel = nil; self.settingsNav = nil;
          }
          - (void)doneMoving { cbSetEdit(NO); }
          - (void)cbEditChanged {   /* v84: in the editor the gear gives way to "+" and "Done" */
              self.gear.hidden = gCbEdit; self.plus.hidden = !gCbEdit; self.doneMove.hidden = !gCbEdit; self.pinch.enabled = gCbEdit;
              if (!gCbEdit) { [self closeAddPanel]; if (gCbPinch) gCbPinch = NO; }
          }
          - (void)xTapped { cbSelDelete(); }
          - (void)pinched:(UIPinchGestureRecognizer *)g {
              if (!gCbEdit) return;
              if (g.state == UIGestureRecognizerStateBegan) cbPinchBegin();
              else if (g.state == UIGestureRecognizerStateChanged) { if (gCbPinch) cbPinchApply(g.scale, NO); }
              else if (g.state == UIGestureRecognizerStateEnded || g.state == UIGestureRecognizerStateCancelled || g.state == UIGestureRecognizerStateFailed) { if (gCbPinch) cbPinchEnd(); }
          }
          - (void)openAddPanel {
              if (self.addPanel) { [self closeAddPanel]; return; }
              if (gCbList.count >= CB_MAX) {
                  UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Limit reached" message:[NSString stringWithFormat:@"You can have up to %d buttons. Delete one first.", CB_MAX] preferredStyle:UIAlertControllerStyleAlert];
                  [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]]; [self presentViewController:al animated:YES completion:nil]; return;
              }
