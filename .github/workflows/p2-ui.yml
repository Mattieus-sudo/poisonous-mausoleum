name: "P2 UI source"
# UI: the iOS settings screens, Liquid Glass loader, in-game menu and RootVC in main.m.
# Called by build-loader.yml (uses: ./.github/workflows/p2-ui.yml). It only writes source text and uploads it; the loader joins the pieces and compiles.
on:
  workflow_call:
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Write the source pieces
        run: |
          set -e
          mkdir -p parts
          cat > parts/ui_main_1.m <<'EOF_UI_MAIN_1_M'
          static UITextView *gView;
          static CADisplayLink *gHzLink;
          static NSMutableString *gFlags;
          static NSMutableString *gText;
          static BOOL gDirty, gRan;
          static NSString *sFw, *sRes, *sRep;
          static BOOL gLogVisible;   /* v101: YES only while the Live logs screen is open */
          static void emit(const char *s) {   /* always called on the main thread */
              [gText appendFormat:@"%s\n", s];
              if (gText.length > 40000) [gText deleteCharactersInRange:NSMakeRange(0, gText.length - 30000)];   /* v101: never let the text grow without bound */
              if (!gLogVisible) return;   /* v101: nobody is looking, so no UITextView rewrite and no layout */
              if (!gDirty) { gDirty = YES; dispatch_async(dispatch_get_main_queue(), ^{ gDirty = NO; gView.text = gText; [gView scrollRangeToVisible:NSMakeRange(gText.length, 0)]; }); }
          }

          /* ================= v66 settings UI (UIKit, no storyboard) =================
             A switch is one line in Documents/p2.cfg. Every control below only adds or removes such lines.
             CONFIG MODEL: behaviour changes = lines in p2.cfg (loader reads them via p2_cfg_*); host settings = the hidden Documents/.controls.cfg (hostCfgPath). Switches are never written as folders;
             the only exception is files the host reads itself (.render_scale). */
          static NSString *uiDocs(void) { cfgReady(); return p2DocsDir(); }
          static BOOL uiHas(NSString *n) { cfgReady(); return p2_cfg_has(n.UTF8String) != 0; }
          static void uiSet(NSString *n, BOOL on) {
              cfgReady();
              p2_cfg_set(n.UTF8String, on ? 1 : 0);
          }
          static BOOL uiIsNum(NSString *name, NSString *prefix) {   /* "waitspin_1000" matches prefix "waitspin_"; "imgdelay_all" does not match "imgdelay_" */
              if (![name hasPrefix:prefix] || name.length <= prefix.length) return NO;
              unichar c = [name characterAtIndex:prefix.length]; return c >= '0' && c <= '9';
          }
          static NSArray<NSString *> *uiWithPrefix(NSString *prefix) {
              NSMutableArray *r = [NSMutableArray new];
              cfgReady(); char b[300]; int it = 0;
              while (p2_cfg_next(&it, b, sizeof b)) { NSString *n = [NSString stringWithUTF8String:b]; if (n && uiIsNum(n, prefix)) [r addObject:n]; }
              return r;
          }

          /* v66: Play is refused when the game files are not where the game looks (Documents/Prototype2/game) or the engine dll is not the expected build.
             A game_folder.txt in Documents redirects the game to another folder, so the check steps aside then. */
          static BOOL uiGameFilesOK(void) {
              NSFileManager *fm = NSFileManager.defaultManager;
              if ([fm fileExistsAtPath:[uiDocs() stringByAppendingPathComponent:@"game_folder.txt"]]) return YES;
              NSString *g = [uiDocs() stringByAppendingPathComponent:@"Prototype2/game"];
              for (NSString *n in @[@"prototype2.exe", @"prototype2engine.dll", @"binkw32.dll"])
                  if (![fm fileExistsAtPath:[g stringByAppendingPathComponent:n]]) return NO;
              return [[fm attributesOfItemAtPath:[g stringByAppendingPathComponent:@"prototype2engine.dll"] error:nil] fileSize] == 17336320ULL;
          }

          typedef NS_ENUM(NSInteger, SKind) { SKSwitch, SKMenu, SKLink, SKButton, SKInfo };

          @interface SRow : NSObject
          @property (nonatomic) SKind kind;
          @property (nonatomic, copy) NSString *title, *detail;
          @property (nonatomic, copy) NSString *cfgKey;             /* switch: the p2.cfg line name (button rows: the action id) */
          @property (nonatomic) BOOL onWhenSet;                     /* switch: YES = line present means ON; NO = line present means OFF */
          @property (nonatomic, copy) NSArray<NSString *> *labels;  /* menu: label per choice */
          @property (nonatomic, copy) NSArray<NSString *> *cfgKeys; /* menu: p2.cfg line per choice, @"" = no line (the default) */
          @property (nonatomic, copy) NSString *prefix;             /* menu: also clear every <prefix><digits> line */
          @property (nonatomic) BOOL hz;                            /* menu: apply the display lock right away */
          @property (nonatomic, copy) NSString *hostMod;            /* menu: a 2-choice row (0 = off, 1 = on) that flips this mod's "mod <name>" line in Documents/.controls.cfg instead of a p2.cfg line */
          @end
          @implementation SRow @end

          static SRow *sSwitch(NSString *t, NSString *d, NSString *cfgKey, BOOL onWhenSet) {
              SRow *r = [SRow new]; r.kind = SKSwitch; r.title = t; r.detail = d; r.cfgKey = cfgKey; r.onWhenSet = onWhenSet; return r;
          }
          static SRow *sMenu(NSString *t, NSString *d, NSArray *labels, NSArray *cfgKeys, NSString *prefix) {
              SRow *r = [SRow new]; r.kind = SKMenu; r.title = t; r.detail = d; r.labels = labels; r.cfgKeys = cfgKeys; r.prefix = prefix; return r;
          }
          static SRow *sModMenu(NSString *t, NSString *d, NSArray *labels, NSString *modName) {
              SRow *r = [SRow new]; r.kind = SKMenu; r.title = t; r.detail = d; r.labels = labels; r.cfgKeys = @[@"", @""]; r.hostMod = modName; return r;
          }
          static SRow *sPlain(SKind k, NSString *t, NSString *d) { SRow *r = [SRow new]; r.kind = k; r.title = t; r.detail = d; return r; }
          static SRow *sBtn(NSString *t, NSString *action) { SRow *r = sPlain(SKButton, t, @""); r.cfgKey = action; return r; }
          static unsigned long long uiDirSize(NSString *path) {
              NSFileManager *fm = NSFileManager.defaultManager; unsigned long long tot = 0;
              for (NSString *sub in [fm enumeratorAtPath:path]) tot += [[fm attributesOfItemAtPath:[path stringByAppendingPathComponent:sub] error:nil] fileSize];
              return tot;
          }
          /* v83: the Android host reads these exact controls.cfg directives in android_main.
             Keep the file as the source of truth; the host parses these settings at next launch. */
          static NSString *hostCfgPath(void) { return [uiDocs() stringByAppendingPathComponent:@".controls.cfg"]; }
          static NSArray<NSString *> *hostCfgLines(void) {
              NSString *raw = [NSString stringWithContentsOfFile:hostCfgPath() encoding:NSUTF8StringEncoding error:nil];
              return raw.length ? [raw componentsSeparatedByCharactersInSet:[NSCharacterSet newlineCharacterSet]] : @[];
          }
          static NSString *hostCfgValue(NSString *key, NSString *fallback) {
              NSString *prefix = [key stringByAppendingString:@" "];
              for (NSString *line in hostCfgLines()) if ([line hasPrefix:prefix]) return [[line substringFromIndex:prefix.length] stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
              return fallback;
          }
          static BOOL hostCfgSet(NSString *key, NSString *value) {
              NSString *prefix = [key stringByAppendingString:@" "];
              NSMutableArray<NSString *> *lines = [NSMutableArray array]; BOOL replaced = NO;
              for (NSString *line in hostCfgLines()) {
                  if ([line hasPrefix:prefix]) { if (!replaced) [lines addObject:[prefix stringByAppendingString:value]]; replaced = YES; }
                  else if (line.length) [lines addObject:line];
              }
              if (!replaced) [lines addObject:[prefix stringByAppendingString:value]];
              NSString *out = [[lines componentsJoinedByString:@"\n"] stringByAppendingString:@"\n"];
              return [out writeToFile:hostCfgPath() atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static BOOL hostCfgRemove(NSString *key) {
              NSString *prefix = [key stringByAppendingString:@" "];
              NSMutableArray<NSString *> *lines = [NSMutableArray array];
              for (NSString *line in hostCfgLines()) if (![line hasPrefix:prefix] && line.length) [lines addObject:line];
              NSString *out = lines.count ? [[lines componentsJoinedByString:@"\n"] stringByAppendingString:@"\n"] : @"";
              return [out writeToFile:hostCfgPath() atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          /* Render scale (v104): the host reads ONLY Documents/.render_scale (30..100) at launch. The launcher writes that file and nothing else: no controls.cfg "screen" line (the host never read it),
             no p2.cfg entry. A leftover renderscale_N line in p2.cfg would make the loader overwrite this file at the next start, and the loader's .render_scale.p2auto marker would make it delete
             the file, so both are cleared here. */
          static NSString *hostScreenPath(void) { return [uiDocs() stringByAppendingPathComponent:@".render_scale"]; }
          static NSString *hostScreenMarker(void) { return [uiDocs() stringByAppendingPathComponent:@".render_scale.p2auto"]; }
          /* iPhone model preset (v106, replaces the Android "gfx" presets): the loader writes .render_scale + the .p2auto marker at every start unless the person picked a value. */
          static BOOL hostScreenIsAuto(void) {
              if (uiWithPrefix(@"renderscale_").count) return NO;   /* an explicit p2.cfg line wins */
              return ![NSFileManager.defaultManager fileExistsAtPath:hostScreenPath()] || [NSFileManager.defaultManager fileExistsAtPath:hostScreenMarker()];
          }
          static NSString *hostDeviceName(void) { char nm[64] = {0}; int sc = 0, sh = 0; p2_device_preset(&sc, &sh, nm, sizeof nm); return [NSString stringWithUTF8String:nm]; }
          static int hostDeviceScale(void) { int sc = 67, sh = 1024; p2_device_preset(&sc, &sh, NULL, 0); return sc; }
          static NSString *hostScreenValue(void) {
              NSString *raw = [NSString stringWithContentsOfFile:hostScreenPath() encoding:NSUTF8StringEncoding error:nil];
              NSString *t = [raw stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
              return t.length ? t : [NSString stringWithFormat:@"%d", hostDeviceScale()];   /* no file yet = what the loader will write for this model at the next start */
          }
          static BOOL hostScreenSet(NSString *v) {
              cfgReady();
              for (NSString *f in uiWithPrefix(@"renderscale_")) uiSet(f, NO);
              if ([v isEqualToString:@"auto"]) {   /* back to the iPhone model preset: drop the file and the marker, the loader writes both again at the next start */
                  [NSFileManager.defaultManager removeItemAtPath:hostScreenPath() error:nil];
                  [NSFileManager.defaultManager removeItemAtPath:hostScreenMarker() error:nil];
                  return YES;
              }
              [NSFileManager.defaultManager removeItemAtPath:hostScreenMarker() error:nil];
              return [[v stringByAppendingString:@"\n"] writeToFile:hostScreenPath() atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static NSArray<NSString *> *hostModNames(void) {
              NSString *dir = [uiDocs() stringByAppendingPathComponent:@"Mods"];
              NSArray *all = [NSFileManager.defaultManager contentsOfDirectoryAtPath:dir error:nil];
              NSMutableArray *mods = [NSMutableArray array];
              for (NSString *name in all) { BOOL isDir = NO; NSString *path = [dir stringByAppendingPathComponent:name];
                  if (![name hasPrefix:@"."] && [NSFileManager.defaultManager fileExistsAtPath:path isDirectory:&isDir] && isDir) [mods addObject:name];
              }
              return [mods sortedArrayUsingSelector:@selector(localizedStandardCompare:)];
          }
          static BOOL hostModEnabled(NSString *name) {
              NSString *wanted = [@"mod " stringByAppendingString:name];
              for (NSString *line in hostCfgLines()) if ([line isEqualToString:wanted]) return YES;
              return NO;
          }
          static BOOL hostSetModEnabled(NSString *name, BOOL enabled) {
              NSMutableArray<NSString *> *lines = [NSMutableArray array];
              for (NSString *line in hostCfgLines()) if (![line hasPrefix:@"mod "] && line.length) [lines addObject:line];
              NSMutableArray<NSString *> *enabledNames = [NSMutableArray array];
              for (NSString *mod in hostModNames()) if (([mod isEqualToString:name] ? enabled : hostModEnabled(mod))) [enabledNames addObject:mod];
              for (NSString *mod in enabledNames) [lines addObject:[@"mod " stringByAppendingString:mod]];
              NSString *out = [[lines componentsJoinedByString:@"\n"] stringByAppendingString:@"\n"];
              return [out writeToFile:hostCfgPath() atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }

          /* v105: flip ONE mod line (no other line and no other mod is touched, and it does not matter whether the mod's folder exists yet). */
          static BOOL hostSetModLine(NSString *name, BOOL enabled) {
              NSString *wanted = [@"mod " stringByAppendingString:name];
              NSMutableArray<NSString *> *lines = [NSMutableArray array];
              for (NSString *line in hostCfgLines()) if (line.length && ![line isEqualToString:wanted]) [lines addObject:line];
              if (enabled) [lines addObject:wanted];
              NSString *out = lines.count ? [[lines componentsJoinedByString:@"\n"] stringByAppendingString:@"\n"] : @"";
              return [out writeToFile:hostCfgPath() atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          /* v105: mods that ship inside the app (repo folder p2-mods/ -> <app>/bundled-mods). Each item (a mod folder, or a file such as the how-to text) is copied into Documents/Mods
             ONLY if nothing with that name is there yet: an existing copy, including one the person edited, is never overwritten, and mods the person added themselves are never touched. */
          static void hostSeedBundledMods(void) {
              NSFileManager *fm = NSFileManager.defaultManager;
              NSString *src = [NSBundle.mainBundle.resourcePath stringByAppendingPathComponent:@"bundled-mods"];
              NSArray *items = [fm contentsOfDirectoryAtPath:src error:nil]; if (!items.count) return;
              NSString *dst = [uiDocs() stringByAppendingPathComponent:@"Mods"];
              [fm createDirectoryAtPath:dst withIntermediateDirectories:YES attributes:nil error:nil];
              for (NSString *name in items) {
                  if ([name hasPrefix:@"."]) continue;
                  NSString *to = [dst stringByAppendingPathComponent:name];
                  if ([fm fileExistsAtPath:to]) continue;
                  [fm copyItemAtPath:[src stringByAppendingPathComponent:name] toPath:to error:nil];
              }
          }
          /* v105: the mod loader is ON by default. No "modloader" line yet (first launch) = write "modloader 1"; once the line exists (the Mod loader switch in the game settings writes 1 or 0) it is never touched here. */
          static void hostSeedModLoader(void) {
              for (NSString *line in hostCfgLines()) if ([line hasPrefix:@"modloader "]) return;
              hostCfgSet(@"modloader", @"1");
          }

          /* ---- live log screen: reuses the one text view that emit() already feeds ---- */
          @interface LogVC : UIViewController @end
          @implementation LogVC
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"Live logs"; self.view.backgroundColor = UIColor.blackColor;
              gView.frame = self.view.bounds; gView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              if (gRan) {   /* v101: the game is running, L() was not feeding the screen: show the last 30 KB of the log file */
                  NSFileHandle *fh = [NSFileHandle fileHandleForReadingAtPath:sRep];
                  if (fh) { unsigned long long sz = [fh seekToEndOfFile]; unsigned long long from = sz > 30000 ? sz - 30000 : 0; [fh seekToFileOffset:from]; NSData *d = [fh readDataToEndOfFile]; [fh closeFile];
                      NSString *t = [[NSString alloc] initWithData:d encoding:NSUTF8StringEncoding]; if (!t) t = [[NSString alloc] initWithData:d encoding:NSISOLatin1StringEncoding];
                      if (from > 0) { NSRange nl = [t rangeOfString:@"\n"]; if (nl.location != NSNotFound) t = [t substringFromIndex:nl.location + 1]; }
                      if (t) gText = [t mutableCopy]; }
              }
              gView.hidden = NO; gView.text = gText; [self.view addSubview:gView];
              [gView scrollRangeToVisible:NSMakeRange(gText.length, 0)];
              gLogVisible = YES; p2_set_emit_live(1);   /* v101: from now on new lines are forwarded until this screen closes */
          }
          - (void)viewDidDisappear:(BOOL)animated { [super viewDidDisappear:animated]; gLogVisible = NO; if (gRan) p2_set_emit_live(0); }
          - (void)viewWillAppear:(BOOL)animated { [super viewWillAppear:animated]; [self.navigationController setNavigationBarHidden:NO animated:animated]; }
          @end

          /* ---- the settings list ---- */
          @interface SettingsVC : UITableViewController
          @property (nonatomic, copy) NSArray<NSArray<SRow *> *> *rows;
          @property (nonatomic, copy) NSArray<NSString *> *heads;
          @property (nonatomic, copy) void (^onHz)(void);
          @property (nonatomic, copy) void (^onLogs)(void);
          @property (nonatomic, copy) BOOL (^isRunning)(void);
          @property (nonatomic, strong) NSMutableSet<NSNumber *> *openSections;   /* dropdown sections currently expanded */
          @end
          @implementation SettingsVC
          - (instancetype)init {
              self = [super initWithStyle:UITableViewStyleInsetGrouped];
              self.title = @"Settings";
              self.openSections = [NSMutableSet new];
              self.heads = @[@"Game", @"Performance", @"Diagnostics", @"Experiments", @""];
              self.rows = @[
                  @[ sMenu(@"Display refresh rate", @"Locks the screen to this rate. Applies immediately.",
                           @[@"iOS decides", @"60 Hz", @"90 Hz", @"120 Hz (default)"], @[@"hz_off", @"hz_60", @"hz_90", @""], nil),
                     sModMenu(@"Controller", @"Optional. Game looks for a controller at any time, this option just chooses between Xbox and PlayStation style controls",
                           @[@"Xbox", @"PlayStation"], @"Playstation Buttons"),
                      ],
                  @[ sMenu(@"Wait spin", @"How long a game thread busy-waits before sleeping. Longer reacts faster but uses more CPU, battery and heat.",
                           @[@"250 us (default)", @"1000 us", @"2000 us", @"4000 us"], @[@"", @"waitspin_1000", @"waitspin_2000", @"waitspin_4000"], @"waitspin_"),
                     sMenu(@"Thread priority", @"Tells iOS how urgent the game's threads are. The default is the highest class.",
                           @[@"Highest (default)", @"High", @"iOS default"], @[@"", @"qos_initiated", @"qos_off"], nil),
                     sMenu(@"Shadow casters", @"Which size objects cast shadows. Auto picks a number for your iPhone model. Higher numbers skip smaller objects for better performance.",
                   @[@"Auto (iPhone model preset)", @"Skip under 4096", @"Skip under 1024", @"Skip under 512", @"Skip under 256", @"Skip under 64", @"Skip all shadow casters", @"Cast all"],
                   @[@"", @"setenv_P2RE_VKSHADOWMIN=4096", @"setenv_P2RE_VKSHADOWMIN=1024", @"setenv_P2RE_VKSHADOWMIN=512", @"setenv_P2RE_VKSHADOWMIN=256", @"setenv_P2RE_VKSHADOWMIN=64", @"setenv_P2RE_VKSHADOWMIN=40000000", @"shadowmin_off"], @"setenv_P2RE_VKSHADOWMIN=") ],
                  @[ sSwitch(@"Render thread trace", @"Records what the render thread waits for. Measurement only, may cost a little speed. Turn on when sending logs.", @"rbtrace_on", YES),
                     sSwitch(@"Wait trace", @"Records how long each game thread is blocked. Measurement only.", @"waittrace_on", YES),
                     sSwitch(@"Texture trace", @"Hashes texture uploads to catch broken textures. Probably the costliest trace.", @"textrace_on", YES),
                     sSwitch(@"Code sampler", @"Samples where game code is running about 100 times a second. Can cost fps.", @"pcprof_on", YES),
                     sSwitch(@"Touch trace", @"Once a second while you touch the screen, logs how many touch moves iOS delivered, how long handing them to the game took, and the real display refresh interval (shows if iOS changes the refresh rate while you touch). Measurement only.", @"touch_trace", YES) ],
                  @[ sMenu(@"Screen aspect ratio", @"Makes the game see a screen of this shape. Its resolution list follows it (16:9 offers 1280x720). A different shape than your real screen may show black bars or stretch; try it and look.",
                           @[@"Off (screen's real shape, default)", @"16:9", @"16:10", @"3:2", @"4:3"], @[@"", @"fakeaspect_17778", @"fakeaspect_16000", @"fakeaspect_15000", @"fakeaspect_13333"], @"fakeaspect_"),
                     sSwitch(@"Audio off", @"Turns the game's audio off.", @"audio_off", YES),
                     sSwitch(@"GPU Pass Timer", @"Turns on the GPU pass timer. Writes 'vkpddi gpu:' lines to p2.log. Applies at the next start. Small overhead.", @"setenv_P2RE_VKGPUTIME", YES) ],
                  @[ sBtn(@"Clear caches", @"caches"), sBtn(@"Reset to defaults", @"reset") ],
              ];
              return self;
          }
          - (void)viewDidLoad { [super viewDidLoad]; self.tableView.tableHeaderView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 1, 28)];   /* a little room above the first dropdown */
              self.tableView.estimatedRowHeight = 60; self.tableView.rowHeight = UITableViewAutomaticDimension;
              self.tableView.backgroundColor = UIColor.clearColor; }   /* v86: sits on the loader's glass card */
          - (void)viewWillAppear:(BOOL)animated { [super viewWillAppear:animated]; [self.navigationController setNavigationBarHidden:(self.navigationController.viewControllers.count == 1) animated:animated]; [self.tableView reloadData]; }
          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tv { return (NSInteger)self.rows.count; }
          - (BOOL)collapsible:(NSInteger)s { return s < (NSInteger)self.rows.count - 1; }   /* every section except the last (Maintenance) is a dropdown */
          - (BOOL)expanded:(NSInteger)s { return ![self collapsible:s] || [self.openSections containsObject:@(s)]; }
          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return [self expanded:s] ? (NSInteger)self.rows[s].count : 0; }
          - (void)headerTapped:(UITapGestureRecognizer *)g {
              NSNumber *k = @(g.view.tag);
              if ([self.openSections containsObject:k]) [self.openSections removeObject:k]; else [self.openSections addObject:k];
              [self.tableView reloadSections:[NSIndexSet indexSetWithIndex:(NSUInteger)g.view.tag] withRowAnimation:UITableViewRowAnimationFade];
          }
          - (CGFloat)tableView:(UITableView *)tv heightForHeaderInSection:(NSInteger)s { return self.heads[s].length ? 52 : 16; }
          - (UIView *)tableView:(UITableView *)tv viewForHeaderInSection:(NSInteger)s {
              if (!self.heads[s].length) return nil;
              UIView *v = [[UIView alloc] initWithFrame:CGRectMake(0, 0, tv.bounds.size.width, 52)];
              UILabel *l = [[UILabel alloc] initWithFrame:CGRectMake(20, 14, tv.bounds.size.width - 40, 30)];
              l.text = self.heads[s]; l.font = [UIFont systemFontOfSize:22 weight:UIFontWeightSemibold]; l.textColor = UIColor.secondaryLabelColor;
              l.autoresizingMask = UIViewAutoresizingFlexibleWidth; [v addSubview:l];
              if ([self collapsible:s]) {
                  l.frame = CGRectMake(20, 14, tv.bounds.size.width - 80, 30);
                  UIImageView *ch = [[UIImageView alloc] initWithImage:[UIImage systemImageNamed:[self expanded:s] ? @"chevron.down" : @"chevron.right"]];
                  ch.tintColor = UIColor.secondaryLabelColor; ch.contentMode = UIViewContentModeCenter;
                  ch.frame = CGRectMake(tv.bounds.size.width - 56, 14, 36, 30); ch.autoresizingMask = UIViewAutoresizingFlexibleLeftMargin;
                  [v addSubview:ch];
                  v.tag = s; v.isAccessibilityElement = YES; v.accessibilityLabel = self.heads[s]; v.accessibilityTraits = UIAccessibilityTraitButton;
                  [v addGestureRecognizer:[[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(headerTapped:)]];
              }
              return v;
          }
          - (NSString *)tableView:(UITableView *)tv titleForFooterInSection:(NSInteger)s {
              if (![self expanded:s]) return nil;
          if (s == 1) return @"Changes apply the next time the app starts: fully close it (swipe it away) and open it again. Only the display refresh rate applies right away.";
              if (s == 4) return @"Clear caches deletes the spirv and vkpddi_cache folders (the shader and pipeline caches). Try it if the game crashes or looks wrong after an update. They are rebuilt on the next start, so that launch can take longer. Your game files are not touched.";
              if (s == 3) return @"Screen aspect ratio applies the next time the app starts: fully close it and open it again, then pick the resolution in the game's own Options > Video menu. Off removes the fake_aspect file only if the launcher made it.";
              if (s == 2) return @"Traces are off by default and only measure. Turn them on when you need to send logs.";
              return nil;
          }
          - (NSInteger)currentIndex:(SRow *)r {   /* -1 = a custom p2.cfg line the list does not offer */
              if (r.hostMod.length) return hostModEnabled(r.hostMod) ? 1 : 0;   /* the mod's own state in the loader is the choice */
              for (NSInteger i = 0; i < (NSInteger)r.cfgKeys.count; i++) if (r.cfgKeys[i].length && uiHas(r.cfgKeys[i])) return i;
              if (r.prefix.length && uiWithPrefix(r.prefix).count) return -1;
              for (NSInteger i = 0; i < (NSInteger)r.cfgKeys.count; i++) if (!r.cfgKeys[i].length) return i;
              return 0;
          }
          - (void)choose:(SRow *)r index:(NSInteger)i {
              if (r.hostMod.length) {   /* Xbox = mod off, PlayStation = mod on (and the loader itself is switched on so it takes effect); nothing else changes */
                  if (i == 1) hostCfgSet(@"modloader", @"1");
                  hostSetModLine(r.hostMod, i == 1);
                  return;
              }
              for (NSString *f in r.cfgKeys) if (f.length) uiSet(f, NO);
              if (r.prefix.length) for (NSString *f in uiWithPrefix(r.prefix)) uiSet(f, NO);
              if (r.cfgKeys[i].length) uiSet(r.cfgKeys[i], YES);
              if (r.hz && self.onHz) self.onHz();
          }
          - (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
              SRow *r = self.rows[ip.section][ip.row];
              UITableViewCell *c = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:nil];
              c.selectionStyle = UITableViewCellSelectionStyleNone; c.backgroundColor = [UIColor colorWithWhite:1 alpha:0.07];
              c.textLabel.text = r.title; c.textLabel.font = [UIFont systemFontOfSize:17]; c.textLabel.numberOfLines = 0;
              c.detailTextLabel.text = r.detail.length ? r.detail : nil; c.detailTextLabel.numberOfLines = 0;
              c.detailTextLabel.font = [UIFont systemFontOfSize:13]; c.detailTextLabel.textColor = UIColor.secondaryLabelColor;
              if (r.kind == SKSwitch) {
                  UISwitch *s = [UISwitch new]; BOOL has = uiHas(r.cfgKey); s.on = r.onWhenSet ? has : !has;
