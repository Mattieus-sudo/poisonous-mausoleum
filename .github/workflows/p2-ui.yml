          - (void)hzTick:(CADisplayLink *)l { tcTick(l); }   /* v69: still no real work unless touch_trace or touch_coalesce is on; the link mainly tells iOS which refresh rate this app wants */
          - (void)publishFlags { if (gFlags.length > 1000) [gFlags deleteCharactersInRange:NSMakeRange(1000, gFlags.length - 1000)]; p2_boot_flags = strdup(gFlags.UTF8String); }
          - (void)startHz {
              cfgReady();
              NSInteger maxHz = UIScreen.mainScreen.maximumFramesPerSecond;
              p2_set_tick(1.0 / (double)(maxHz > 0 ? maxHz : 60));   /* the loader needs the screen refresh period (right camera stick) */
              float want = 120;
              BOOL off = p2_cfg_has("hz_off");
              if (p2_cfg_has("hz_90")) want = 90;
              if (p2_cfg_has("hz_60")) want = 60;
              if (off) { [self note:"HZ: hz_off entry present, display rate left to iOS"]; [self publishFlags]; return; }
              if (maxHz < 120 && want > maxHz) { [self note:[NSString stringWithFormat:@"HZ: display tops out at %ld Hz, nothing to lock (need a ProMotion screen)", (long)maxHz].UTF8String]; [self publishFlags]; return; }
              gHzLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(hzTick:)];
              gHzLink.preferredFrameRateRange = CAFrameRateRangeMake(want, want, want);
              p2_set_tick(1.0 / (double)want);
              [gHzLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              [self note:[NSString stringWithFormat:@"HZ: locked display to %.0f Hz (screen max %ld Hz, CADisableMinimumFrameDurationOnPhone set). p2.cfg lines: hz_off, hz_90, hz_60", want, (long)maxHz].UTF8String]; [self publishFlags];
          }
          - (void)applicationDidReceiveMemoryWarning:(UIApplication *)a { p2_note("iOS: MEMORY WARNING received"); }
