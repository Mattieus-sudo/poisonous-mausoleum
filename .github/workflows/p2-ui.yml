              self.ver = [self label:[NSString stringWithFormat:@"Version %@", v ? v : @"?"] size:17 weight:UIFontWeightRegular color:UIColor.secondaryLabelColor];
              UIButtonConfiguration *cf = p2GlassButtonConfig(YES) ?: [UIButtonConfiguration filledButtonConfiguration];   /* v86: tinted Liquid Glass Play button (iOS 26), filled before that */
              cf.cornerStyle = UIButtonConfigurationCornerStyleCapsule; cf.baseBackgroundColor = [UIColor colorWithRed:0.62 green:0.12 blue:0.17 alpha:1]; cf.baseForegroundColor = UIColor.whiteColor;
              self.play = [UIButton buttonWithConfiguration:cf primaryAction:nil];
              [self setPlayTitle:@"Play"];
              [self.play addTarget:self action:@selector(playTapped) forControlEvents:UIControlEventTouchUpInside]; [self.menu addSubview:self.play];
              self.credit = [self label:@"iOS port by Lestat\nOriginal port by EliteMV\nNot for sale. Free to distribute with credits." size:12 weight:UIFontWeightRegular color:UIColor.secondaryLabelColor];

              SettingsVC *sv = [SettingsVC new]; sv.onHz = self.onHz;
