              UIBezierPath *openingBolt = p2BuildOpeningBolt(bgv.bounds.size.width, bgv.bounds.size.height);
              launchGlow.path = openingBolt.CGPath;
              launchGlow.fillColor = UIColor.clearColor.CGColor;
