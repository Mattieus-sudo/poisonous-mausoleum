          /* settings cog: bottom left, nudged in from the corner */
          self.plus.frame = CGRectMake(gi.left + 10 + 108, gi.top + 10, 40, 40);   /* + / Done stay top-left, shifted right about 2/3 inch (~108 pt); the gear is hidden while editing */
          self.doneMove.frame = CGRectMake(CGRectGetMaxX(self.plus.frame) + 10, gi.top + 12, 84, 36);
