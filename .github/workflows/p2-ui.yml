          gCbHost = [[CbHost alloc] initWithFrame:self.view.bounds]; gCbHost.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight; gCbHost.backgroundColor = UIColor.clearColor;
          [self.view insertSubview:gCbHost belowSubview:self.menu];
