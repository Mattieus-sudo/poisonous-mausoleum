          /* ---- v103: one-time (and idempotent) clean-up of everything the older builds left in Documents. Runs at every launch before any screen reads a setting:
             flag folders -> lines of p2.cfg; the loader-made render_scale / waitspin / fake_aspect files and their .p2auto markers -> removed (the loader remakes them hidden in .p2);
             the Android host's controls.cfg -> lines of p2.cfg; Documents/Mods -> Prototype2/Mods. Left alone on purpose: own_layout (a folder that holds your layout file), layouts/, camera.txt,
             custom_buttons.txt, button_icons/, the game folder and the caches. ---- */
          static NSMutableString *gMigNote;
          static void migNote(NSString *t) { if (!gMigNote) gMigNote = [NSMutableString new]; [gMigNote appendFormat:@"%@\n", t]; }
          static BOOL p2IsFlagName(NSString *n) {
              static NSSet<NSString *> *bools;
              if (!bools) bools = [NSSet setWithArray:@[
                  @"audio_off", @"auto_exit", @"drawtrace_now", @"env", @"futex_off", @"gpuhud_est", @"gpuhud_off", @"hz_60", @"hz_90", @"hz_off", @"imgdelay_all", @"inputtap_on", @"mvk_argbuf_off", @"mvk_dumpshaders",
                  @"mvk_fastmath_auto", @"mvk_fastmath_off", @"mvk_fastmath_on", @"mvk_log_info", @"nosplash", @"ovl_hide", @"ovl_off", @"ovl_trace", @"pan_clock_off", @"pan_smooth_off", @"passtime_on", @"passtrace_now",
                  @"pcprof_on", @"qos_initiated", @"qos_off", @"rbtrace_off", @"rstick_invy", @"rstick_on", @"rt_render", @"settle_s6", @"shadowmin_off", @"swapchain_alpha_keep", @"textrace_off", @"threaddump_on",
                  @"touch_coalesce", @"touch_trace", @"vk_loadop_fix_off", @"vkshot", @"vktrace_now", @"waittrace_off",
                  @"dontcare_auto", @"hold_off", @"menu_auto_off", @"menu_cursor_off", @"menu_force", @"menu_wheel_inv", @"menu_wheel_off", @"metalfx_on", @"mvk_perf_log", @"mvk_prefill_on", @"mvk_syncsubmit_off",
                  @"snapshot_off", @"swipe_classic", @"cmdline", @"portoff"]];
              if ([bools containsObject:n]) return YES;
              if (([n hasPrefix:@"setenv_"] || [n hasPrefix:@"dbgoff_"]) && n.length > 7) return YES;
              if ([n hasPrefix:@"rtdump_ps="] && n.length > 10) return YES;
              if (p2IsNum(n, @"dc_") || p2IsNum(n, @"dcx_")) return YES;
              for (NSString *p in p2NumPrefixes()) if (p2IsNum(n, p)) return YES;
              return NO;
          }
          static void p2MigrateFlags(void) {
              NSFileManager *fm = NSFileManager.defaultManager; NSString *d = p2Docs(); int n = 0;
              for (NSString *nm in [fm contentsOfDirectoryAtPath:d error:nil]) {
                  if ([nm hasPrefix:@"."] || !p2IsFlagName(nm) || [nm rangeOfCharacterFromSet:NSCharacterSet.whitespaceCharacterSet].location != NSNotFound) continue;
                  if (!p2CfgSet(nm, YES)) continue;   /* could not write p2.cfg: leave the folder alone */
                  if ([fm removeItemAtPath:[d stringByAppendingPathComponent:nm] error:nil]) n++;
              }
              if (n) migNote([NSString stringWithFormat:@"MIGRATE: %d flag folder(s) turned into lines of p2.cfg and removed", n]);
          }
          static void p2MigrateRootFiles(void) {
              NSFileManager *fm = NSFileManager.defaultManager; NSString *d = p2Docs();
              NSArray *pairs = @[@[@"render_scale", @"screen"], @[@"waitspin", @"waitspin_"], @[@"fake_aspect", @"fakeaspect_"]];
              for (NSArray *pr in pairs) {
                  NSString *f = [d stringByAppendingPathComponent:pr[0]], *mk = [f stringByAppendingString:@".p2auto"]; BOOL isDir = NO;
                  if (![fm fileExistsAtPath:f isDirectory:&isDir]) { [fm removeItemAtPath:mk error:nil]; continue; }
                  if (isDir) continue;
                  if (![fm fileExistsAtPath:mk]) {   /* made by hand, not by the loader: keep its value as a p2.cfg line unless one is there already */
                      NSString *t = [[NSString stringWithContentsOfFile:f encoding:NSUTF8StringEncoding error:nil] stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
                      int v = [pr[0] isEqualToString:@"fake_aspect"] ? (int)lround(t.doubleValue * 10000.0) : t.intValue;
                      if ([pr[0] isEqualToString:@"render_scale"]) { if (!hostCfgValue(@"screen", nil) && ![p2CfgWithPrefix(@"renderscale_") count] && v >= 30 && v <= 100) hostCfgSet(@"screen", [NSString stringWithFormat:@"%d", v]); }
                      else if (t.length && ![p2CfgWithPrefix(pr[1]) count]) p2CfgSet([NSString stringWithFormat:@"%@%d", pr[1], v], YES);
                  }
                  [fm removeItemAtPath:f error:nil]; [fm removeItemAtPath:mk error:nil];
              }
              [fm removeItemAtPath:[d stringByAppendingPathComponent:@"P2_SWITCHES.txt"] error:nil];   /* the loader now writes it into logs/ */
              /* the Android host's controls.cfg: its known settings become plain lines, anything else a "host ..." line */
              NSString *cc = [d stringByAppendingPathComponent:@"controls.cfg"];
              NSString *txt = [NSString stringWithContentsOfFile:cc encoding:NSUTF8StringEncoding error:nil];
              if (txt) {
                  NSArray *hk = @[@"upscale", @"gfx", @"gfxmanual", @"potato", @"quality", @"screen", @"fpscap", @"camera", @"modloader", @"mod", @"heatguard"];
                  NSMutableArray<NSString *> *all = [p2CfgRaw() mutableCopy]; NSMutableSet *keys = [NSMutableSet new], *lines = [NSMutableSet new]; int added = 0;
                  for (NSString *ln in all) { NSString *k, *v; if (p2CfgSplit(ln, &k, &v)) { [keys addObject:k]; [lines addObject:[ln stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet]]; } }
                  for (NSString *ln0 in [txt componentsSeparatedByCharactersInSet:NSCharacterSet.newlineCharacterSet]) {
                      NSString *k, *v; if (!p2CfgSplit(ln0, &k, &v)) continue;
                      NSString *ln = [ln0 stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet], *out = nil;
                      if ([hk containsObject:k]) { if ([k isEqualToString:@"mod"] ? ![lines containsObject:ln] : ![keys containsObject:k]) out = ln; }
                      else { NSString *h = [@"host " stringByAppendingString:ln]; if (![lines containsObject:h]) out = h; }
                      if (out) { [all addObject:out]; [lines addObject:out]; added++; }
                  }
                  if (p2CfgWrite(all)) { [fm removeItemAtPath:cc error:nil]; migNote([NSString stringWithFormat:@"MIGRATE: controls.cfg folded into p2.cfg (%d line(s) added)", added]); }
              }
              /* mods: Documents/Mods -> Documents/Prototype2/Mods (merged, a mod that is already in the new folder is left alone) */
              NSString *om = [d stringByAppendingPathComponent:@"Mods"], *nm = [d stringByAppendingPathComponent:@"Prototype2/Mods"]; BOOL dir = NO;
              if ([fm fileExistsAtPath:om isDirectory:&dir] && dir) {
                  [fm createDirectoryAtPath:nm withIntermediateDirectories:YES attributes:nil error:nil];
                  int moved = 0;
                  for (NSString *c in [fm contentsOfDirectoryAtPath:om error:nil]) {
                      NSString *src = [om stringByAppendingPathComponent:c], *dst = [nm stringByAppendingPathComponent:c];
                      if (![fm fileExistsAtPath:dst] && [fm moveItemAtPath:src toPath:dst error:nil]) moved++;
                  }
                  if (![[fm contentsOfDirectoryAtPath:om error:nil] count]) [fm removeItemAtPath:om error:nil];
                  if (moved) migNote([NSString stringWithFormat:@"MIGRATE: %d item(s) of Documents/Mods moved to Documents/Prototype2/Mods", moved]);
              }
          }
          static void p2MigrateAll(void) {
              p2MigrateFlags();
              p2MigrateRootFiles();
          }
          @interface AD : UIResponder <UIApplicationDelegate>
          @property(strong, nonatomic) UIWindow *window;
          @end
          @implementation AD
          @synthesize window = _window;
          - (void)note:(const char *)s { emit(s); if (!gFlags) gFlags = [NSMutableString new]; [gFlags appendFormat:@"%s\n", s]; }
          - (void)startFlags {
              static const struct { const char *n; int pre; const char *m; } K[] = {
                  {"hz_off",0,"120 Hz lock OFF"}, {"rt_render",0,"render thread real-time policy ON (6000 us budget)"}, {"hz_90",0,"display locked to 90 Hz"}, {"hz_60",0,"display locked to 60 Hz"},
                  {"waittrace_off",0,"WAITTRACE recording OFF"}, {"rbtrace_off",0,"RBTRACE (render-thread trace + GPU timing) OFF"}, {"gpuhud_off",0,"GPU % for the dev HUD OFF"}, {"threaddump_on",0,"timed THREADDUMP at 20/45/90 s ON"}, {"gpuhud_est",0,"GPU % estimated from RBTRACE timing (not the Apple counter)"},
                  {"textrace_off",0,"TEXTRACE + UPLOADGAP OFF"}, {"maxlod_",1,"sampler max-LOD cap (maxlod_0 = full-size level only; read at launch)"},
                  {"pcprof_on",0,"PC sampler ON"}, {"futex_off",0,"real futex OFF"}, {"audio_off",0,"audio OFF"}, {"auto_exit",0,"auto exit"},
                  {"qos_off",0,"thread QoS left at default"}, {"qos_initiated",0,"thread QoS USER_INITIATED"},
                  {"vk_loadop_fix_off",0,"LOAD_OP_NONE rewrite OFF"}, {"vkshot",0,"vkshot"}, {"vktrace_now",0,"VKTRACE dump now"},
                  {"settle_s6",0,"settle at state 6"}, {"swapchain_alpha_keep",0,"keep swapchain alpha"}, {"imgdelay_all",0,"image delay for all images"},
                  {"mvk_argbuf_off",0,"MoltenVK argument buffers OFF"}, {"mvk_dumpshaders",0,"MoltenVK dump shaders"},
                  {"mvk_fastmath_auto",0,"MoltenVK fast math auto"}, {"mvk_fastmath_on",0,"MoltenVK fast math ON (default since v72)"}, {"mvk_fastmath_off",0,"MoltenVK fast math OFF"}, {"shadowmin_off",0,"built-in shadow min OFF (every caster drawn)"}, {"passtime_on",0,"PASSSIG pass signature log"}, {"passskip_",1,"skip the draws of pass signature K (diagnostic)"}, {"ringsprint_",1,"stick sprints past a ring in ANY direction, radius N per mille of screen height"}, {"inputtap_on",0,"INPUTTAP log: finger movement vs what the game receives"}, {"mvk_log_info",0,"MoltenVK info logging"},
                  {"own_layout",0,"own controls on (v76)"}, {"rstick_on",0,"right camera stick added to own controls (v87)"}, {"rstick_speed_",1,"right stick: full push in percent of screen width per second (v87)"}, {"rstick_vert_",1,"right stick: up/down speed in percent (v87)"}, {"rstick_invy",0,"right stick: flip up/down (v87)"}, {"ovl_trace",0,"dev overlay measured (v75)"}, {"ovl_hide",0,"dev overlay hidden (v75)"}, {"ovl_off",0,"dev overlay builder not called (v75)"}, {"passtrace_now",0,"dev one-frame pass trace trigger (v75)"}, {"drawtrace_now",0,"dev one-frame draw trace trigger (v75)"}, {"dbgoff_",1,"dev renderer feature switched off via debugoff file (v75)"}, {"env",0,"env switch (see loader help)"}, {"nosplash",0,"skip the autosave splash and the Disclaimer (the original port credits EliteMV; credited in the launcher instead)"},
                  {"fakeaspect_",1,"fake screen aspect ratio x 10000 (loader writes Documents/fake_aspect)"}, {"touch_coalesce",0,"touch moves coalesced to one per display tick (ignored while smooth panning is on)"}, {"pan_smooth_off",0,"smooth camera panning OFF: every touch move goes to the game raw (v81)"}, {"pan_lag_",1,"smooth panning: fixed lag in ms instead of the measured one (v81)"}, {"pan_clock_off",0,"steady pan clock OFF: camera steps follow the real time the game thread drains, as in v81 (v82)"}, {"inputtap_on",0,"INPUTTAP lines: raw finger px vs what the loader handed the game per frame (v81)"}, {"touch_trace",0,"touch trace (logs TOUCHTRACE lines while touching)"}, {"waitspin_",1,"wait spin in us"}, {"rt_render_",1,"render thread real-time policy, budget in us"}, {"imgdelay_",1,"image delay"}, {"sleepcap_",1,"guest sleep cap in us"},
                  {"hold_s5_",1,"hold at state 5"}, {"hold_s6_",1,"hold at state 6"}, {"ncpu_",1,"reported CPU count"},
                  {"pdelay_",1,"present delay"}, {"pthrottle_",1,"present throttle"}, {"setenv_",1,"sets an env var for the game"},
              };
          int n = 0;
          static NSArray<NSString *> *host;
          if (!host) host = @[@"upscale", @"gfx", @"gfxmanual", @"potato", @"quality", @"screen", @"fpscap", @"camera", @"modloader", @"mod", @"heatguard", @"host", @"renderscale", @"fakeaspect"];
          [self note:"FLAGS (lines of Documents/p2.cfg when the app started):"];
          for (NSString *ln in p2CfgRaw()) {
              NSString *k, *v; if (!p2CfgSplit(ln, &k, &v)) continue;
              const char *c = k.UTF8String, *meaning = NULL;
              for (size_t i = 0; i < sizeof K / sizeof K[0]; i++) {
                  size_t nl = strlen(K[i].n);
                  if (K[i].pre ? strncmp(c, K[i].n, nl) == 0 : strcmp(c, K[i].n) == 0) { meaning = K[i].m; break; }
              }
              if (!meaning && [host containsObject:k]) meaning = "host setting (handed to the Android host through the hidden controls.cfg) or a number the loader turns into a file";
              [self note:[NSString stringWithFormat:@"  %@  ->  %s", v.length ? [NSString stringWithFormat:@"%@ %@", k, v] : k, meaning ? meaning : "not a known switch (ignored)"].UTF8String]; n++;
          }
          if (!n) [self note:"  (no flag lines)"];
              [self note:"  no line = defaults: 120 Hz lock on, RBTRACE on, WAITTRACE on, waitspin 1000 us, QoS interactive, rt_render off, futex on, LOAD_OP rewrite on"];
          }
          - (void)hzTick:(CADisplayLink *)l { tcTick(l); }   /* v69: still no real work unless touch_trace or touch_coalesce is on; the link mainly tells iOS which refresh rate this app wants */
          - (void)publishFlags { if (gFlags.length > 1000) [gFlags deleteCharactersInRange:NSMakeRange(1000, gFlags.length - 1000)]; p2_boot_flags = strdup(gFlags.UTF8String); }
          - (void)startHz {
              NSInteger maxHz = UIScreen.mainScreen.maximumFramesPerSecond;
              p2_set_tick(1.0 / (double)(maxHz > 0 ? maxHz : 60));   /* v82: the pan clock steps in whole screen refreshes */
              float want = 120;
              BOOL off = p2CfgHas(@"hz_off");
              if (p2CfgHas(@"hz_90")) want = 90;
              if (p2CfgHas(@"hz_60")) want = 60;
              if (off) { [self note:"HZ: hz_off line present, display rate left to iOS"]; [self publishFlags]; return; }
              if (maxHz < 120 && want > maxHz) { [self note:[NSString stringWithFormat:@"HZ: display tops out at %ld Hz, nothing to lock (need a ProMotion screen)", (long)maxHz].UTF8String]; [self publishFlags]; return; }
              gHzLink = [CADisplayLink displayLinkWithTarget:self selector:@selector(hzTick:)];
              gHzLink.preferredFrameRateRange = CAFrameRateRangeMake(want, want, want);
              p2_set_tick(1.0 / (double)want);
              [gHzLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
              [self note:[NSString stringWithFormat:@"HZ: locked display to %.0f Hz (screen max %ld Hz, CADisableMinimumFrameDurationOnPhone set). p2.cfg lines: hz_off, hz_90, hz_60", want, (long)maxHz].UTF8String]; [self publishFlags];
          }
          - (void)applicationDidReceiveMemoryWarning:(UIApplication *)a { p2_note("iOS: MEMORY WARNING received"); }
          - (void)applicationWillResignActive:(UIApplication *)a { p2_note("iOS: app will resign active (home gesture, control centre or a system overlay)"); p2_set_paused(1); }   /* v102: stop submitting GPU work before iOS takes it away */
          - (void)applicationDidBecomeActive:(UIApplication *)a { p2_set_paused(0); }
          - (void)applicationDidEnterBackground:(UIApplication *)a {
              p2_note("iOS: app entered the background");
              p2_set_paused(1);
              if (gRan) for (int i = 0; i < 30 && p2_parked_threads() < 1; i++) usleep(10000);   /* v102: give the render thread up to 300 ms to reach the gate */
          }
          - (void)applicationWillTerminate:(UIApplication *)a { p2_note("iOS: applicationWillTerminate"); }
          - (void)applyHz { gTcLink = NO; tcFlush(); [gHzLink invalidate]; gHzLink = nil; [self startHz]; }
          - (BOOL)application:(UIApplication *)a didFinishLaunchingWithOptions:(NSDictionary *)o {
              gText = [NSMutableString string];
              p2MigrateAll();   /* v103: before anything reads a setting */
              { NSUserDefaults *ud = NSUserDefaults.standardUserDefaults;   /* nosplash is ON by default: create the folder once, on the first launch of v66; after that the user's choice sticks */
                if (![ud boolForKey:@"nosplash_seeded"]) { uiSet(@"nosplash", YES); [ud setBool:YES forKey:@"nosplash_seeded"]; }
                if (![ud boolForKey:@"traces_off_seeded"]) { uiSet(@"rbtrace_off", YES); uiSet(@"waittrace_off", YES); uiSet(@"textrace_off", YES); [ud setBool:YES forKey:@"traces_off_seeded"]; } }
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              gView = [[UITextView alloc] initWithFrame:CGRectZero];
              gView.editable = NO; gView.selectable = YES; gView.font = [UIFont fontWithName:@"Menlo" size:10]; gView.backgroundColor = UIColor.blackColor; gView.textColor = UIColor.greenColor;
              gGame = [[GameView alloc] initWithFrame:UIScreen.mainScreen.bounds];
              CAMetalLayer *ml = (CAMetalLayer *)gGame.layer; ml.device = MTLCreateSystemDefaultDevice(); ml.pixelFormat = MTLPixelFormatBGRA8Unorm;
              ml.contentsScale = UIScreen.mainScreen.nativeScale; gGame.backgroundColor = UIColor.blackColor; gGame.multipleTouchEnabled = YES; gGame.userInteractionEnabled = YES;
              RootVC *vc = [RootVC new]; vc.game = gGame;
              vc.onPlay = ^{ [self run]; };
              vc.onHz = ^{ [self applyHz]; };
              self.window.rootViewController = vc; [self.window makeKeyAndVisible]; if (gMigNote.length) [self note:[gMigNote stringByTrimmingCharactersInSet:NSCharacterSet.newlineCharacterSet].UTF8String]; [self startFlags]; [self startHz]; return YES;
          }
          - (void)run {
              if (gRan) { emit("(already ran in this launch: close the app from the app switcher and open it again to repeat)"); return; }
              gRan = YES;
              NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];
              sFw = [[NSBundle mainBundle].privateFrameworksPath stringByAppendingString:@"/P2Code.framework/P2Code"];
              sRes = [NSBundle mainBundle].resourcePath;
              sRep = [docs stringByAppendingString:@"/logs/p2_loader_log.txt"];   /* v103: every log lives in Documents/logs (the previous run in logs/prev) */
              [NSFileManager.defaultManager createDirectoryAtPath:[docs stringByAppendingString:@"/logs"] withIntermediateDirectories:YES attributes:nil error:nil];
              { CGFloat sc = UIScreen.mainScreen.nativeScale; CGSize b = gGame.bounds.size;
            p2_win_w = (int)(b.width * sc); p2_win_h = (int)(b.height * sc); p2_metal_layer = (__bridge void *)gGame.layer;
            emit([NSString stringWithFormat:@"game surface %dx%d px (landscape is locked)", p2_win_w, p2_win_h].UTF8String); }
          emit("loader started on a background thread; this screen updates while it runs");
              NSThread *t = [[NSThread alloc] initWithBlock:^{ p2_run(emit, sFw.UTF8String, sRes.UTF8String, sRep.UTF8String); }];
              t.stackSize = 16 << 20; t.name = @"p2-loader"; [t start];
              p2_set_emit_live(0);   /* v101: the game is starting, the launcher screen is hidden: L() writes the log file only and leaves the main thread alone */
          }
