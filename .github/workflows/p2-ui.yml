              BOOL land = b.size.width > b.size.height;
              CGRect panel, list;
              if (land) { CGFloat pw = MAX(280, floor(b.size.width * 0.34)); panel = CGRectMake(si.left, si.top, pw - si.left, b.size.height - si.top - si.bottom); list = CGRectMake(pw, 0, b.size.width - pw, b.size.height); }
              else { CGFloat ph = 330; panel = CGRectMake(0, si.top, b.size.width, ph); list = CGRectMake(0, si.top + ph, b.size.width, b.size.height - si.top - ph); }
              {   /* v86: the two glass cards; the left card replaces the plain panel rectangle for centring the icon, name and Play */
                  CGFloat gm = 12, top = MAX(si.top, gm), bot = MAX(si.bottom, gm), left = MAX(si.left, gm), right = MAX(si.right, gm);
                  CGRect pc, lc;
                  if (land) {
                      CGFloat pw = panel.origin.x + panel.size.width;
                      pc = CGRectMake(left, top, pw - left - gm / 2, b.size.height - top - bot);
                      lc = CGRectMake(pw + gm / 2, top, b.size.width - pw - gm / 2 - right, b.size.height - top - bot);
                  } else {
                      pc = CGRectMake(gm, top, b.size.width - 2 * gm, panel.size.height);
                      lc = CGRectMake(gm, CGRectGetMaxY(pc) + gm, b.size.width - 2 * gm, b.size.height - CGRectGetMaxY(pc) - gm - bot);
                  }
                  self.panelGlass.frame = pc; self.listGlass.frame = lc;
                  self.nav.view.frame = CGRectMake(0, 0, lc.size.width, lc.size.height);
                  panel = pc; list = lc;
              }
              CGFloat pad = 24, w = panel.size.width - 2 * pad, iconS = land ? 128 : 88, btnW = MIN(w, 320), btnH = 54;
              CGSize ns = [self.name sizeThatFits:CGSizeMake(w, CGFLOAT_MAX)], vs = [self.ver sizeThatFits:CGSizeMake(w, CGFLOAT_MAX)];
              CGSize cs = [self.credit sizeThatFits:CGSizeMake(w, CGFLOAT_MAX)];
              CGFloat total = iconS + 14 + ns.height + 4 + vs.height + 18 + btnH + 14 + cs.height;
              CGFloat y = panel.origin.y + MAX(8, (panel.size.height - total) / 2), cx = panel.origin.x + panel.size.width / 2;
