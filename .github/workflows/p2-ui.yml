          - (void)playTapped {
              if (!self.started && !uiGameFilesOK()) {
                  UIAlertController *al = [UIAlertController alertControllerWithTitle:@"Game files not found" message:@"Game files not found or hashes don't match the expected version. Unpacked game files go in On My iPhone > Prototype 2 > Prototype2 > game, so that prototype2.exe, prototype2engine.dll, woi.rcf, etc. all land in /game/." preferredStyle:UIAlertControllerStyleAlert];
                  [al addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
                  [self presentViewController:al animated:YES completion:nil]; return;
              }
              if (!self.started) { self.started = YES; [self setPlayTitle:@"Resume"]; if (self.onPlay) self.onPlay(); }
              self.menu.hidden = YES; [self syncCb]; [self setNeedsStatusBarAppearanceUpdate]; [self setNeedsUpdateOfHomeIndicatorAutoHidden];
