              [bolt addLineToPoint:CGPointMake(bgv.bounds.size.width * 0.42, bgv.bounds.size.height)];
              [bolt moveToPoint:CGPointMake(bgv.bounds.size.width * 0.23, bgv.bounds.size.height * 0.18)];
              [bolt addLineToPoint:CGPointMake(bgv.bounds.size.width * 0.10, bgv.bounds.size.height * 0.30)];
              [bolt moveToPoint:CGPointMake(bgv.bounds.size.width * 0.34, bgv.bounds.size.height * 0.44)];
              [bolt addLineToPoint:CGPointMake(bgv.bounds.size.width * 0.50, bgv.bounds.size.height * 0.38)];
              UIBezierPath *bolt2 = [bolt copy], *bolt3 = [bolt copy];
              [bolt2 applyTransform:CGAffineTransformMake(0.92, 0.08, -0.06, 1.0, bgv.bounds.size.width * 0.11, bgv.bounds.size.height * 0.02)];
              [bolt3 applyTransform:CGAffineTransformMake(1.08, -0.05, 0.04, 0.94, -bgv.bounds.size.width * 0.08, bgv.bounds.size.height * 0.04)];
              arc.path = bolt.CGPath; arc.strokeEnd = 0; [bgv.layer addSublayer:arc];
              NSArray<UIBezierPath *> *lightningPaths = @[bolt, bolt2, bolt3];
              /* Keep the opening strike unchanged; begin recurring lightning after it completes. */
              __weak CAShapeLayer *weakArc = arc;
              __weak UIView *weakBG = bgv;
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.65 * NSEC_PER_SEC)),
                             dispatch_get_main_queue(), ^{
