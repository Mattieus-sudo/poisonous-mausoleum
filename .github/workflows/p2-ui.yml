          }
          - (void)syncCb { gCbHost.hidden = !self.menu.hidden; if (!gCbHost.hidden) { [self.view bringSubviewToFront:gCbHost]; for (CbButton *b in gCbList) [b place]; } }
          - (void)viewDidLayoutSubviews {
