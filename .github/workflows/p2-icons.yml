name: "P2 icons source"
# ICONS: button pictures and captions. Maps a button's key to a game action (Left Click = Attack 1, Right Click = Attack 2 "Heavy", Space = Jump ...), draws that action's PNG and a small caption under the button.
# Called by build-loader.yml (uses: ./.github/workflows/p2-icons.yml). It packs the PNGs of the repo folder p2-icons/ and writes ico_main.m; the loader joins the pieces, copies icons/ into the app and compiles.
on:
  workflow_call:
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the PNGs
        run: |
          set -e
          mkdir -p parts/icons
          cat > pack_icons.py <<'EOF_PACK_PY'
          import glob, os, re
          from PIL import Image
          KNOWN = ['border', 'lstick', 'rstick', 'attack1', 'attack2', 'target', 'jump', 'sprint', 'autosprint', 'walk', 'block', 'hunt', 'shapeshift', 'heller_form', 'power_wheel', 'grab', 'devastator', 'bio_bomb', 'pack_leader', 'pack_attack', 'skip', 'confirm', 'pause', 'up', 'down', 'left', 'right']
          MAXPX = 256   # a button is at most about 150 px on screen, 256 keeps it sharp on a 3x display
          got = []
          for f in sorted(glob.glob("p2-icons/*.png")):
              name = os.path.splitext(os.path.basename(f))[0]   # the file name is kept exactly as you wrote it (capitals too); the loader finds it without caring about case
              if not re.fullmatch(r"[A-Za-z0-9_]+", name): print("SKIP (use letters, 0-9 and _ only):", f); continue
              im = Image.open(f).convert("RGBA")
              if max(im.size) > MAXPX: im.thumbnail((MAXPX, MAXPX), Image.LANCZOS)
              im.save("parts/icons/%s.png" % name, optimize=True); got.append(name.lower())
              print("PACKED %-14s %dx%d%s" % (name, im.size[0], im.size[1], "" if name.lower() in KNOWN or name.lower().startswith("key_") else "   (custom name: use it with 'map KEY %s' in icon_map.txt)" % name))
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as s:
              s.write("### Button icons\n\n")
              for a in KNOWN: s.write("- %s `%s.png`\n" % ("OK" if a in got else "missing", a))
              extra = [g for g in got if g not in KNOWN]
              if extra: s.write("- extra: " + ", ".join("`%s.png`" % g for g in extra) + "\n")
          print("icons packed:", len(got), "| actions without a PNG keep the text label:", [a for a in KNOWN if a not in got])
          EOF_PACK_PY
          python3 -m pip install -q pillow
          python3 pack_icons.py
      - name: Write the source piece
        run: |
          set -e
          mkdir -p parts
          cat > parts/ico_main.m <<'EOF_ICO_MAIN_M'
          /* ---- ICONS: button pictures and captions. A button (own_layout or custom) whose key is a known game action draws that action's PNG instead of the key name, with a small caption under it
             (Attack 2 reads "Heavy"). Nothing else about the button changes: same key, same hit circle, same Move mode.
             The action table below is the game's own binding list (Options > Keyboard) with its default keys. Rebound a key in the game? Add "bind ACTION KEY" to icon_map.txt.
             Where the PNG comes from (first hit wins):
               1. Documents/button_icons/key_XX.png        one picture for one exact key (XX = scancode in hex, 101 = Left Click, 102 = Right Click)
               2. Documents/button_icons/<name>.png        <name> = the action id (attack2, jump, grab ...) or what icon_map.txt says; Files-app drops win over the build
               3. <app>/icons/<name>.png                   the p2-icons folder of the repo, packed in by p2-icons.yml; v106: also copied into Documents/button_icons on launch (see icoSeed), so 1 and 2 normally hit those copies
             icon_map.txt (Documents/button_icons/, written the first time) lines:  map KEY name | map KEY none | bind ACTION KEY | caption KEY text | caption KEY none | captions 0/1 | picture inside/alone
             picture inside (default) = the picture sits inside the circle of the button. picture alone = no circle behind it; in Move mode the yellow ring comes back so the button can be found and dragged. A pressed button is drawn a little smaller and dimmer.
             Everything is read once at launch, so relaunch after changing a file. ---- */
          typedef struct { const char *id, *name, *cap; int dik; const char *ctx; } IcoAct;   /* v97: ctx = the layout this action applies in: NULL any, "video" only there, "!video" everywhere but there */
          static const IcoAct kAct[] = {
              {"attack1", "Attack 1", "Attack", 0x101}, {"attack2", "Attack 2", "Heavy", 0x102}, {"target", "Target", "Target", 0x13}, {"jump", "Jump", "Jump", 0x39},
              {"sprint", "Sprint", "Sprint", 0x2A}, {"autosprint", "Auto-sprint", "Auto-sprint", 0x2C}, {"walk", "Walk", "Walk", 0x38}, {"block", "Block", "Block", 0x1D},
              {"hunt", "Hunt", "Hunt", 0x10}, {"shapeshift", "Shapeshift", "Shapeshift", 0x21}, {"heller_form", "Heller form", "Heller", 0x22}, {"power_wheel", "Power wheel", "Powers", 0x04},
              {"grab", "Grab / Hijack", "Grab", 0x12}, {"devastator", "Devastator", "Devastator", 0x2F}, {"bio_bomb", "Bio-bomb", "Bio-bomb", 0x2D}, {"pack_leader", "Pack leader", "Pack leader", 0x30},
              {"pack_attack", "Pack attack / Center camera", "Pack attack", 0x2E}, {"skip", "Skip cutscene", "Skip", 0x32, "video"}, {"map", "Map", "Map", 0x32, "!video"},
              {"confirm", "Confirm (Enter)", "", 0x1C}, {"pause", "Pause (Esc)", "", 0x01}, {"up", "Up", "", 0xC8}, {"down", "Down", "", 0xD0}, {"left", "Left", "", 0xCB}, {"right", "Right", "", 0xCD},
          };
          #define ICO_NACT ((int)(sizeof kAct / sizeof kAct[0]))
          static int gIcoBind[32];                                          /* icon_map.txt "bind": ACTION -> key, 0 = the default key */
          static NSMutableDictionary<NSNumber *, NSString *> *gIcoMap;      /* "map": key -> picture name */
          static NSMutableDictionary<NSNumber *, NSString *> *gIcoCap;      /* "caption": key -> text ("none" = no caption) */
          static NSMutableDictionary<NSNumber *, id> *gIcoCache;            /* key -> UIImage, or NSNull when there is none */
          static BOOL gIcoFlat = NO, gIcoCaps = YES, gIcoInit;   /* v96: NO = the picture sits INSIDE the circle of the button (the default); "picture alone" in icon_map.txt takes the circle away */
          static NSString *icoDir(void) { return [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0] stringByAppendingPathComponent:@"button_icons"]; }
          static NSString *icoFindCI(NSString *dir, NSString *name) {   /* the file whose name matches ignoring capitals, or nil: Key_2a.png, KEY_2A.png and key_2A.png are all the same picture */
              for (NSString *f in [NSFileManager.defaultManager contentsOfDirectoryAtPath:dir error:nil])
                  if ([f.pathExtension caseInsensitiveCompare:@"png"] == NSOrderedSame && [f.stringByDeletingPathExtension caseInsensitiveCompare:name] == NSOrderedSame) return [dir stringByAppendingPathComponent:f];
              return nil;
          }
          /* ---- v106: SEED button_icons. Every PNG the build ships (<app>/icons) is also copied into Documents/button_icons so the player sees the exact file names in the Files app and can replace them.
             .shipped remembers a fingerprint of each copy: a file still identical to what we copied is refreshed when a new build ships a new picture; a file the player replaced or edited is never overwritten;
             a file the player deleted stays deleted (the bundled picture still draws, see icoLoadDisk). README.txt is rewritten at every launch from the action table. ---- */
          static uint64_t icoHash(NSData *d) { uint64_t h = 1469598103934665603ULL; const uint8_t *b = (const uint8_t *)d.bytes; for (NSUInteger i = 0; i < d.length; i++) { h ^= b[i]; h *= 1099511628211ULL; } return h; }
          static BOOL gIcoSeeded;
          static void icoSeed(void) {
              if (gIcoSeeded) return; gIcoSeeded = YES;
              NSFileManager *fm = NSFileManager.defaultManager; NSString *d = icoDir(), *src = [NSBundle.mainBundle.resourcePath stringByAppendingPathComponent:@"icons"];
              [fm createDirectoryAtPath:d withIntermediateDirectories:YES attributes:nil error:nil];
              NSString *rec = [d stringByAppendingPathComponent:@".shipped"];
              NSMutableDictionary<NSString *, NSString *> *old = [NSMutableDictionary new], *now = [NSMutableDictionary new];   /* name.png (lowercase) -> fingerprint */
              for (NSString *ln in [[NSString stringWithContentsOfFile:rec encoding:NSUTF8StringEncoding error:nil] componentsSeparatedByString:@"\n"]) { NSArray<NSString *> *w = [ln componentsSeparatedByString:@" "]; if (w.count == 2) old[w[0]] = w[1]; }
              NSMutableSet<NSString *> *inBuild = [NSMutableSet new];
              for (NSString *f in [fm contentsOfDirectoryAtPath:src error:nil]) {
                  if ([f.pathExtension caseInsensitiveCompare:@"png"] != NSOrderedSame) continue;
                  NSData *nd = [NSData dataWithContentsOfFile:[src stringByAppendingPathComponent:f]]; if (!nd) continue;
                  NSString *key = f.lowercaseString, *nh = [NSString stringWithFormat:@"%016llx", (unsigned long long)icoHash(nd)], *oh = old[key];
                  [inBuild addObject:key];
                  NSString *have = icoFindCI(d, f.stringByDeletingPathExtension);   /* any capitalisation of the same name */
                  if (!have) {
                      if (oh) now[key] = oh;   /* we copied it before and the player deleted it: leave it deleted */
                      else if ([nd writeToFile:[d stringByAppendingPathComponent:f] atomically:YES]) now[key] = nh;   /* first launch: copy */
                  } else {
                      NSData *hd = [NSData dataWithContentsOfFile:have]; NSString *eh = hd ? [NSString stringWithFormat:@"%016llx", (unsigned long long)icoHash(hd)] : nil;
                      if (eh && [eh isEqualToString:nh]) now[key] = nh;   /* identical to the shipped one: ours */
                      else if (eh && oh && [eh isEqualToString:oh]) { if ([nd writeToFile:have atomically:YES]) now[key] = nh; else now[key] = oh; }   /* untouched since we copied it, the build has a new picture: refresh */
                      else if (oh) now[key] = oh;   /* the player's own version of a shipped name: keep it, do not touch it */
                  }
              }
              for (NSString *key in old) if (![inBuild containsObject:key]) {   /* the build dropped this picture: remove our untouched copy, keep anything the player changed */
                  NSString *have = icoFindCI(d, key.stringByDeletingPathExtension); NSData *hd = have ? [NSData dataWithContentsOfFile:have] : nil;
                  if (hd && [[NSString stringWithFormat:@"%016llx", (unsigned long long)icoHash(hd)] isEqualToString:old[key]]) [fm removeItemAtPath:have error:nil];
              }
              NSMutableString *rs = [NSMutableString new];
              for (NSString *k in [now.allKeys sortedArrayUsingSelector:@selector(compare:)]) [rs appendFormat:@"%@ %@\n", k, now[k]];
              [rs writeToFile:rec atomically:YES encoding:NSUTF8StringEncoding error:nil];
              NSMutableString *rd = [NSMutableString stringWithString:@"BUTTON ICONS - how to replace them\n\nThe PNG files in this folder are the pictures drawn on your touch buttons. Replace any of them with your own and relaunch the game.\n\n1) Keep the file name exactly (capitals do not matter). The name decides which button gets the picture:\n"];
              for (int i = 0; i < ICO_NACT; i++) { const char *cx = kAct[i].ctx; NSString *where = !cx ? @"" : cx[0] == '!' ? [NSString stringWithFormat:@", every layout except %s", cx + 1] : [NSString stringWithFormat:@", %s layout only", cx]; [rd appendFormat:@"     %-16s %s  (default key %X%@)\n", [[NSString stringWithFormat:@"%s.png", kAct[i].id] UTF8String], kAct[i].name, kAct[i].dik, where]; }
              [rd appendString:@"\n   Overlays: border.png = ring drawn around every button picture; Lstick.png = left-stick sprint border; Rstick.png = right-stick knob.\n\n2) One picture for ONE exact key, whatever the action: key_XX.png where XX is the DirectInput scancode in hex (key_101.png = Left Click, key_102.png = Right Click, key_39.png = Space).\n   Only in one layout: key_XX_LAYOUT.png, e.g. key_32_video.png (layouts: foot, vehicle, menu, video ...).\n\n3) Any other name works too (letters, digits and _ only) once icon_map.txt points a key at it:  map 2A mything  uses mything.png for key 2A. See the comments at the top of icon_map.txt for bind / map / caption / captions / picture.\n\nTips: square PNG with a transparent background, about 256x256 px (bigger is shrunk). Delete a file here to go back to the built-in picture. Files you replace or edit are never overwritten by app updates; files you leave alone are refreshed when an update ships a new picture.\n"];
              [rd writeToFile:[d stringByAppendingPathComponent:@"README.txt"] atomically:YES encoding:NSUTF8StringEncoding error:nil];
          }
          static NSMutableDictionary<NSString *, id> *gIcoLoadCache;   /* name -> UIImage, or NSNull for "no such picture". icoLoad used to hit the disk (up to 4 file lookups and 2 directory listings, plus a PNG decode) on every call, and ownRefresh calls it several times for every touch event on the main thread: that stalled UIKit and delayed touchesEnded (a released stick kept turning the camera). Pictures are read once per launch ("Relaunch after a change"). */
          static UIImage *icoLoadDisk(NSString *name);
          static UIImage *icoLoad(NSString *name) {
              if (!name) return nil;
              icoSeed();   /* v106: the bundled pictures are copied into Documents/button_icons before the first lookup */
              if (!gIcoLoadCache) gIcoLoadCache = [NSMutableDictionary new];
              id c = gIcoLoadCache[name]; if (c) return c == NSNull.null ? nil : c;
              UIImage *im = icoLoadDisk(name); gIcoLoadCache[name] = im ? (id)im : (id)NSNull.null; return im;
          }
          static UIImage *icoLoadDisk(NSString *name) {
              UIImage *im = [UIImage imageWithContentsOfFile:[icoDir() stringByAppendingPathComponent:[name stringByAppendingString:@".png"]]];
              if (!im) { NSString *p = [NSBundle.mainBundle pathForResource:name ofType:@"png" inDirectory:@"icons"]; if (p) im = [UIImage imageWithContentsOfFile:p]; }
              if (!im) { NSString *p = icoFindCI(icoDir(), name); if (p) im = [UIImage imageWithContentsOfFile:p]; }
              if (!im) { NSString *p = icoFindCI([NSBundle.mainBundle.resourcePath stringByAppendingPathComponent:@"icons"], name); if (p) im = [UIImage imageWithContentsOfFile:p]; }
              return im;
          }
          static int icoActDik(int i) { return gIcoBind[i] ? gIcoBind[i] : kAct[i].dik; }
          static int icoNorm(int dik) { return dik == 0x36 ? 0x2A : dik == 0x9D ? 0x1D : dik == 0xB8 ? 0x38 : dik; }   /* right Shift / Ctrl / Alt count as the left one */
          static NSString *icoCtx(void);   /* v97: defined in the layouts piece, the layout in use right now (foot, vehicle, menu, video ...) */
          static BOOL icoActOn(int i) { const char *c = kAct[i].ctx; if (!c) return YES; NSString *cur = icoCtx().lowercaseString; return c[0] == '!' ? ![cur isEqualToString:@(c + 1)] : [cur isEqualToString:@(c)]; }
          static int icoActFor(int dik) { dik = icoNorm(dik); for (int i = 0; i < ICO_NACT; i++) if (icoActDik(i) == dik && icoActOn(i)) return i; return -1; }
          static NSMutableDictionary<NSString *, NSString *> *gIcoMapC, *gIcoCapC;   /* v97: "ctx:key" -> picture name / caption, from map@ctx and caption@ctx lines */
          static NSString *gIcoCacheCtx;
          static NSString *icoCK(int dik) { return [NSString stringWithFormat:@"%@:%d", icoCtx().lowercaseString, dik]; }
          static void icoInit(void) {
              if (gIcoInit) return; gIcoInit = YES;
              icoSeed();
              gIcoMap = [NSMutableDictionary new]; gIcoCap = [NSMutableDictionary new]; gIcoCache = [NSMutableDictionary new]; gIcoMapC = [NSMutableDictionary new]; gIcoCapC = [NSMutableDictionary new];
              NSFileManager *fm = NSFileManager.defaultManager; NSString *d = icoDir(), *f = [d stringByAppendingPathComponent:@"icon_map.txt"];
              [fm createDirectoryAtPath:d withIntermediateDirectories:YES attributes:nil error:nil];   /* so the folder shows up in the Files app */
              if (![fm fileExistsAtPath:f]) [@"# button icons and captions. KEY = DirectInput scancode in hex (101 = Left Click, 102 = Right Click).\n# Optional overlays: border.png (outside every button icon); Lstick.png (left-stick sprint border); Rstick.png (right-stick moving knob).\n# Pictures: drop <action>.png (attack1 attack2 target jump sprint autosprint walk block hunt shapeshift heller_form power_wheel grab devastator bio_bomb pack_leader pack_attack skip confirm pause up down left right)\n# into this folder, or key_XX.png for one exact key. Relaunch after a change.\n# bind ACTION KEY      the game's key for an action if you rebound it, e.g.  bind grab 12\n# map KEY name         use name.png for this key (map KEY none = keep the text label)\n# caption KEY text     the small text under the button (caption KEY none = no caption)\n# map@LAYOUT KEY name / caption@LAYOUT KEY text   the same, but only in that layout (foot, vehicle, menu, video ...), e.g.  caption@video 32 Skip  and  map@foot 32 map\n# key_XX_LAYOUT.png   a picture for one exact key in one layout, e.g. key_32_video.png\n# captions 0           no captions at all\n# picture alone       no circle behind the picture (default: picture inside, in the circle)\npicture inside\ncaptions 1\n" writeToFile:f atomically:YES encoding:NSUTF8StringEncoding error:nil];
              NSString *txt = [NSString stringWithContentsOfFile:f encoding:NSUTF8StringEncoding error:nil];
              for (NSString *ln in [txt componentsSeparatedByCharactersInSet:NSCharacterSet.newlineCharacterSet]) {
                  if ([ln hasPrefix:@"#"]) continue;
                  NSMutableArray<NSString *> *w = [NSMutableArray new];
                  for (NSString *s in [ln componentsSeparatedByCharactersInSet:NSCharacterSet.whitespaceCharacterSet]) if (s.length) [w addObject:s];
                  if (w.count < 2) continue;
                  unsigned v = 0; NSString *cmd = w[0], *cx = nil; NSRange at = [cmd rangeOfString:@"@"];
                  if (at.location != NSNotFound) { cx = [cmd substringFromIndex:at.location + 1].lowercaseString; cmd = [cmd substringToIndex:at.location]; }   /* v97: map@video 32 skip, caption@foot 32 Map */
                  if ([cmd isEqualToString:@"picture"]) gIcoFlat = [w[1] isEqualToString:@"alone"];   /* the old "flat" line is ignored on purpose: older icon_map.txt files have "flat 1" in them */
                  else if ([cmd isEqualToString:@"captions"]) gIcoCaps = w[1].intValue != 0;
                  else if (w.count >= 3 && [cmd isEqualToString:@"map"]) { if ([[NSScanner scannerWithString:w[1]] scanHexInt:&v]) { if (cx) gIcoMapC[[NSString stringWithFormat:@"%@:%u", cx, v]] = w[2].lowercaseString; else gIcoMap[@(v)] = w[2].lowercaseString; } }
                  else if (w.count >= 3 && [cmd isEqualToString:@"caption"]) { if ([[NSScanner scannerWithString:w[1]] scanHexInt:&v]) { NSString *tx = [[w subarrayWithRange:NSMakeRange(2, w.count - 2)] componentsJoinedByString:@" "]; if (cx) gIcoCapC[[NSString stringWithFormat:@"%@:%u", cx, v]] = tx; else gIcoCap[@(v)] = tx; } }
                  else if (w.count >= 3 && [cmd isEqualToString:@"bind"]) { if ([[NSScanner scannerWithString:w[2]] scanHexInt:&v]) for (int i = 0; i < ICO_NACT; i++) if (strcmp(kAct[i].id, w[1].lowercaseString.UTF8String) == 0) gIcoBind[i] = (int)v; }
              }
          }
          static UIImage *icoForDik(int dik) {
              icoInit(); { NSString *cc = icoCtx(); if (![cc isEqualToString:gIcoCacheCtx ?: @""]) { [gIcoCache removeAllObjects]; gIcoCacheCtx = cc; } }   /* v97: a layout switch drops the cache, the same key can have another picture there */
              NSNumber *k = @(dik); id c = gIcoCache[k]; if (c) return c == NSNull.null ? nil : c;
              UIImage *im = icoLoad([NSString stringWithFormat:@"key_%02X_%@", dik, icoCtx().lowercaseString]);   /* v97: key_32_video.png wins over key_32.png in the video layout */
              if (!im) im = icoLoad([NSString stringWithFormat:@"key_%02X", dik]);
              if (!im) {
                  NSString *name = gIcoMapC[icoCK(dik)] ?: gIcoMap[k]; int a = icoActFor(dik);
                  if (!name && a >= 0) name = @(kAct[a].id);
                  if (name && ![name isEqualToString:@"none"]) im = icoLoad(name);
              }
              gIcoCache[k] = im ? (id)im : (id)NSNull.null; return im;
          }
          static NSString *icoCaption(int dik) {   /* the small text under a button, nil = none */
              icoInit(); if (!gIcoCaps) return nil;
              NSString *o = gIcoCapC[icoCK(dik)] ?: gIcoCap[@(dik)]; if (o) return [o.lowercaseString isEqualToString:@"none"] ? nil : o;
              int a = icoActFor(dik); return a >= 0 && kAct[a].cap[0] ? @(kAct[a].cap) : nil;
          }
          static UIImage *icoThumb(int dik) {   /* a 28 pt picture for the + list rows */
              UIImage *im = icoForDik(dik); if (!im) return nil;
              UIGraphicsImageRenderer *r = [[UIGraphicsImageRenderer alloc] initWithSize:CGSizeMake(28, 28)];
              return [[r imageWithActions:^(UIGraphicsImageRendererContext *x) { [im drawInRect:CGRectMake(0, 0, 28, 28)]; }] imageWithRenderingMode:UIImageRenderingModeAlwaysOriginal];
          }
          /* own_layout buttons are CALayers: the picture is a sublayer named "icon" (the key name, sublayer "label", is hidden when there is one), the caption a sublayer named "cap" under the circle. */
          static void icoDressLayer(CALayer *l, int dik) {
              UIImage *border = icoLoad(@"border");
              if (border) {
                  CALayer *b = [CALayer layer]; b.name = @"iconBorder"; b.contents = (__bridge id)border.CGImage;
                  b.contentsGravity = kCAGravityResizeAspect; b.contentsScale = border.scale; b.frame = l.bounds;
                  [l addSublayer:b]; l.borderWidth = 0; l.backgroundColor = UIColor.clearColor.CGColor;
                  l.shadowOpacity = 0; l.shadowRadius = 0; l.shadowPath = nil;
              }
              UIImage *im = icoForDik(dik);
              if (im) {
                  CALayer *ic = [CALayer layer]; ic.name = @"icon"; ic.contents = (__bridge id)im.CGImage; ic.contentsGravity = kCAGravityResizeAspect; ic.contentsScale = im.scale; [l addSublayer:ic];
                  for (CALayer *s in l.sublayers) if ([s.name isEqualToString:@"label"]) s.hidden = YES;
              }
              BOOL suppressLegacyText = dik == 0x39 || dik == 0x01 || dik == 0x1C;
              NSString *cap = suppressLegacyText ? nil : icoCaption(dik);
              if (cap) {
                  CATextLayer *t = [CATextLayer layer]; t.name = @"cap"; t.string = cap; t.font = (__bridge CFTypeRef)[UIFont systemFontOfSize:10 weight:UIFontWeightBold]; t.fontSize = 10; t.alignmentMode = kCAAlignmentCenter; t.foregroundColor = [UIColor colorWithWhite:1 alpha:0.9].CGColor;
                  t.contentsScale = UIScreen.mainScreen.scale; t.shadowColor = UIColor.blackColor.CGColor; t.shadowOpacity = 1; t.shadowRadius = 2; t.shadowOffset = CGSizeZero; [l addSublayer:t];
              }
              if (suppressLegacyText) for (CALayer *s in l.sublayers) if ([s.name isEqualToString:@"label"] || [s.name isEqualToString:@"cap"]) s.hidden = YES;
          }
          static void icoLayoutLayer(CALayer *l) {
              CGFloat w = l.bounds.size.width, h = l.bounds.size.height;
              for (CALayer *s in l.sublayers) {
                  if ([s.name isEqualToString:@"iconBorder"]) s.frame = l.bounds;
                  else if ([s.name isEqualToString:@"icon"]) { CGFloat k = 0.75; s.bounds = CGRectMake(0, 0, w * k, h * k); s.position = CGPointMake(w / 2, h / 2); }   /* inside the circle: 66 percent, the square that fits the circle */
                  else if ([s.name isEqualToString:@"cap"]) s.frame = CGRectMake(-w * 0.3, h + 1, w * 1.6, 14);
              }
          }
          static void icoRefreshLayer(CALayer *l, BOOL down, BOOL edit, BOOL sel) {
              CALayer *ic = nil; for (CALayer *s in l.sublayers) if ([s.name isEqualToString:@"icon"]) ic = s;
              if (!ic) return;
              BOOL hasBorder = NO; for (CALayer *s in l.sublayers) if ([s.name isEqualToString:@"iconBorder"]) hasBorder = YES;
              if (hasBorder) l.borderWidth = edit && sel ? 3 : 0;
              if (gIcoFlat) { l.backgroundColor = hasBorder ? UIColor.clearColor.CGColor : nil; l.borderWidth = hasBorder ? (edit && sel ? 3 : 0) : (edit ? (sel ? 3 : 2) : 0); }
              [CATransaction begin]; [CATransaction setDisableActions:YES];
              ic.opacity = down ? 0.65f : 1.0f; ic.transform = down ? CATransform3DMakeScale(0.9, 0.9, 1) : CATransform3DIdentity;
              [CATransaction commit];
          }
          EOF_ICO_MAIN_M
      - name: Upload the pieces
        uses: actions/upload-artifact@v4
        with:
          name: p2-src-icons
          path: parts/
          if-no-files-found: error
