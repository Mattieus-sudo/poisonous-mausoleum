          }
          static void w_end_renderpass(void *cb) { tCur = NULL; gR_rpend(cb); }
          static void w_draw(void *cb, unsigned a, unsigned b, unsigned c, unsigned d) { pr_draw(); gR_draw(cb, a, b, c, d); }
          static void w_drawi(void *cb, unsigned a, unsigned b, unsigned c, int d, unsigned e) { pr_draw(); gR_drawi(cb, a, b, c, d, e); }
          static void w_svp(void *cb, unsigned f, unsigned n, const VkVp *v) { if (n && v) { tVp = v[0]; tVpOK = 1; } gR_svp(cb, f, n, v); }
