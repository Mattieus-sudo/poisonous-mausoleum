          static void w_begin_rendering(void *cb, const VkRI *ri) {
              PRec *r = pr_new(1, ri->w, ri->h, ri->nColor);
              for (unsigned i = 0; i < ri->nColor && i < 3 && ri->pColor; i++) att_fill(&r->c[i], &ri->pColor[i]);
              if (ri->pDepth) att_fill(&r->d, ri->pDepth);
              if (gLoadFix < 0) { gLoadFix = mk_has("vk_loadop_fix_off") ? 0 : 1; L("VKTRACE LOAD_OP_NONE/STORE_OP_NONE -> LOAD/STORE rewrite: %s", gLoadFix ? "ON (folder vk_loadop_fix_off turns it off)" : "off"); }
              if (gLoadFix && ri->nColor <= 8) {
                  int need = 0; VkRAI col[8], dep, stc; VkRI c2 = *ri;
                  for (unsigned i = 0; i < ri->nColor && ri->pColor; i++) { col[i] = ri->pColor[i]; if (col[i].loadOp == LOADOP_NONE) { col[i].loadOp = 0; need = 1; } if (col[i].storeOp == STOREOP_NONE) { col[i].storeOp = 0; need = 1; } }
                  if (ri->pDepth) { dep = *ri->pDepth; if (dep.loadOp == LOADOP_NONE) { dep.loadOp = 0; need = 1; } if (dep.storeOp == STOREOP_NONE) { dep.storeOp = 0; need = 1; } c2.pDepth = &dep; }
                  if (ri->pStencil) { stc = *ri->pStencil; if (stc.loadOp == LOADOP_NONE) { stc.loadOp = 0; need = 1; } if (stc.storeOp == STOREOP_NONE) { stc.storeOp = 0; need = 1; } c2.pStencil = &stc; }
                  if (need) { c2.pColor = ri->pColor ? col : NULL; if (gLoadFixed++ < 3) L("VKTRACE rewrote a NONE load/store op in a %ux%u pass", ri->w, ri->h); gR_begin(cb, &c2); return; }
              }
              gR_begin(cb, ri);
          }
          static void w_end_rendering(void *cb) { tCur = NULL; gR_end(cb); }
          static void w_begin_renderpass(void *cb, const VkRPBI *bi, int contents) {
              PRec *r = pr_new(2, bi->w, bi->h, 0); r->nRaw = bi->nClear > 2 ? 2 : bi->nClear;
              if (bi->pClear) for (unsigned i = 0; i < r->nRaw * 4; i++) r->raw[i] = bi->pClear[i];
