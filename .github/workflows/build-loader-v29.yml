          /* ---- v18: game files. The runtime looks in Android paths (/storage/emulated/0/Prototype2/game, /sdcard/p2 ...) and in <externalFilesDir>/game_folder.txt.
             We map the Android storage roots onto the app's Documents folder (visible in the Files app) and convert stat/fstat/readdir to the Bionic layouts. ---- */
          static char gDocs[1100];
          static const char *fixp(const char *in, char *out, size_t n) {
              static int logged; static const char *pre[] = {"/storage/emulated/0", "/storage/emulated/legacy", "/storage/self/primary", "/sdcard", "/mnt/sdcard"};
              if (!in || !gDocs[0] || !okptr((uint64_t)in)) return in;
              for (unsigned i = 0; i < sizeof pre / sizeof pre[0]; i++) {
                  size_t l = strlen(pre[i]);
                  if (!strncmp(in, pre[i], l) && (in[l] == 0 || in[l] == '/')) { snprintf(out, n, "%s%s", gDocs, in + l); if (logged++ < 12) L("PLAT path %s -> %s", in, out); return out; }
              }
              return in;
          }
          static int bio_oflags(int f);
          static void st_to_bionic(const struct stat *s, uint8_t *o) {
              memset(o, 0, 128);
              *(uint64_t *)(o + 0) = (uint64_t)s->st_dev; *(uint64_t *)(o + 8) = s->st_ino; *(uint32_t *)(o + 16) = s->st_mode; *(uint32_t *)(o + 20) = s->st_nlink;
              *(uint32_t *)(o + 24) = s->st_uid; *(uint32_t *)(o + 28) = s->st_gid; *(uint64_t *)(o + 32) = (uint64_t)s->st_rdev; *(int64_t *)(o + 48) = s->st_size;
              *(int32_t *)(o + 56) = s->st_blksize; *(int64_t *)(o + 64) = s->st_blocks;
          #ifdef __APPLE__
              *(int64_t *)(o + 72) = s->st_atimespec.tv_sec; *(int64_t *)(o + 80) = s->st_atimespec.tv_nsec; *(int64_t *)(o + 88) = s->st_mtimespec.tv_sec;
              *(int64_t *)(o + 96) = s->st_mtimespec.tv_nsec; *(int64_t *)(o + 104) = s->st_ctimespec.tv_sec; *(int64_t *)(o + 112) = s->st_ctimespec.tv_nsec;
          #else
              *(int64_t *)(o + 72) = s->st_atim.tv_sec; *(int64_t *)(o + 80) = s->st_atim.tv_nsec; *(int64_t *)(o + 88) = s->st_mtim.tv_sec;
              *(int64_t *)(o + 96) = s->st_mtim.tv_nsec; *(int64_t *)(o + 104) = s->st_ctim.tv_sec; *(int64_t *)(o + 112) = s->st_ctim.tv_nsec;
          #endif
          }
          static int sh_stat(const char *p, void *out) {
              static int logged; char b[1100]; const char *q = fixp(p, b, sizeof b); struct stat s; int r = stat(q, &s);
              if (r == 0) st_to_bionic(&s, (uint8_t *)out);
              if (logged++ < 30) L("PLAT stat(%s) -> %d%s", okptr((uint64_t)q) ? q : "?", r, r == 0 ? ((s.st_mode & S_IFMT) == S_IFDIR ? " dir" : " file") : "");
              return r;
          }
          static int sh_fstat(int fd, void *out) { struct stat s; int r = fstat(fd, &s); if (r == 0) st_to_bionic(&s, (uint8_t *)out); return r; }
          static int sh_access(const char *p, int m) { char b[1100]; return access(fixp(p, b, sizeof b), m); }
          static void *sh_fopen(const char *p, const char *m) {
              static int logged; char b[1100]; const char *q = fixp(p, b, sizeof b); void *f = fopen(q, m);
              if (logged++ < 20) L("PLAT fopen(%s, %s) -> %p", okptr((uint64_t)q) ? q : "?", okptr((uint64_t)m) ? m : "?", f); return f;
          }
          static void *sh_opendir(const char *p) {
              static int logged; char b[1100]; const char *q = fixp(p, b, sizeof b); void *d = opendir(q);
              if (logged++ < 20) L("PLAT opendir(%s) -> %p", okptr((uint64_t)q) ? q : "?", d); return d;
          }
          static void *sh_readdir_g(void *d) {                /* Bionic dirent: d_ino@0 d_off@8 d_reclen@16 d_type@18 d_name@19 */
              static __thread uint8_t de[19 + 256 + 5]; struct dirent *e = readdir((DIR *)d); if (!e) return NULL;
              memset(de, 0, sizeof de); *(uint64_t *)de = e->d_ino; *(uint16_t *)(de + 16) = sizeof de; de[18] = e->d_type; strncpy((char *)de + 19, e->d_name, 255); return de;
          }
          static int sh_mkdir(const char *p, int m) { char b[1100]; return mkdir(fixp(p, b, sizeof b), (mode_t)m); }
          static int sh_rmdir(const char *p) { char b[1100]; return rmdir(fixp(p, b, sizeof b)); }
          static int sh_unlink(const char *p) { char b[1100]; return unlink(fixp(p, b, sizeof b)); }
          static int sh_remove(const char *p) { char b[1100]; return remove(fixp(p, b, sizeof b)); }
          static int sh_rename(const char *a, const char *c) { char b1[1100], b2[1100]; return rename(fixp(a, b1, sizeof b1), fixp(c, b2, sizeof b2)); }
          static int sh_open(const char *p, int f, int mode) {
