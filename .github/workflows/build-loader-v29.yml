          static void sh_sincos(double x, double *s, double *c) { *s = __builtin_sin(x); *c = __builtin_cos(x); }
          static int sh_cpucount(size_t sz, const void *set) { int n = 0; const uint8_t *p = set; for (size_t i = 0; i < sz; i++) n += __builtin_popcount(p[i]); return n ? n : 1; }
