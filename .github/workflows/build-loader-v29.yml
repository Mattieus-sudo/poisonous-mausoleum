          #define GUARD(label, stmt) do { gStage = (label); gStageSeq++; if (sigsetjmp(gJ, 1) == 0) { gGuardTh = pthread_self(); gGuard = 1; stmt; gGuard = 0; L("  %s: returned", label); gStage = "(between steps)"; gStageSeq++; } \
              else L("  %s: CRASHED sig=%d fault=0x%llx pc=elf+0x%llx", label, (int)gCrashSig, (unsigned long long)gCrashFault, (unsigned long long)(gCrashPc - (uint64_t)code)); } while (0)
