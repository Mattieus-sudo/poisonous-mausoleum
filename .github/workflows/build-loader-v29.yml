              if (gTlsImg && P2_TLS_FILESZ >= 32) L("  block head matches PT_TLS image: %s", memcmp(a - d[1], gTlsImg, 32) ? "NO" : "yes");
              pthread_t th; pthread_create(&th, NULL, tls_thread, d); pthread_join(th, NULL);
