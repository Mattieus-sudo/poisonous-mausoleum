          static int sh_ioctl(int fd, unsigned long req, long arg) { (void)fd; (void)req; (void)arg; errno = ENOTTY; return -1; }
          /* ---- v17: Vulkan. The guest dlopen()s libvulkan.so and dlsym()s its entry points. We hand it a token that routes to MoltenVK, and
             intercept the few calls whose Android flavour MoltenVK does not have (android surface, layers, unsupported extensions). Vulkan's C ABI is the
             same on Android and Darwin arm64 (no variadics, structs by pointer), so everything else is passed straight through. ---- */
          void *p2_metal_layer;                       /* CAMetalLayer*, set by the app on the main thread before p2_run */
          static char gVkTok[8];                      /* the handle the guest sees for "libvulkan.so" */
