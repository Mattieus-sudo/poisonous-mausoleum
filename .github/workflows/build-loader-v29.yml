          /* ---- v20: make deaths visible. Alternate signal stack per thread (a stack overflow on a game or fiber stack otherwise kills the process with no log line),
             exit() logging, and a memory telemetry line every 2 s (iOS kills apps that exceed their memory limit without any signal). ---- */
          static void p2_altstack(void) { stack_t ss; ss.ss_sp = malloc(1 << 16); ss.ss_size = 1 << 16; ss.ss_flags = 0; if (ss.ss_sp) sigaltstack(&ss, NULL); }
          typedef struct { void *(*fn)(void *); void *arg; } TArg;
          static void *thr_tramp(void *p) { TArg a = *(TArg *)p; free(p); p2_altstack(); return a.fn(a.arg); }
          /* ---- v22: full crash context. v21 crashed with sig=10 fault=0x7800000000 (= the guest base, i.e. guest address 0) at elf+0x5367168; the line alone cannot say
             which register held the null or what the instruction was. This dumps every register, the instruction words around pc (read straight from the loaded
             code, so they can be disassembled offline), the stack words at sp and a frame-pointer chain as elf offsets. Every read goes through vm_read_overwrite so a bad
             pointer cannot fault inside the handler. ---- */
          /* ---- v23: ring buffer of FAILED low-level calls (mmap/mprotect/munmap/madvise), with the caller's elf offset, dumped inside the CRASH output so the last
             call that returned an error before the crash is visible without log spam. Lock-free: slot index from an atomic add, entries are plain stores. ---- */
          typedef struct { const char *n; long ret; int err; unsigned long a0, a1; unsigned long lr; unsigned seq; } RbEnt;
          static RbEnt gRb[64]; static volatile unsigned gRbN;
          static void rb_note(const char *n, long ret, unsigned long a0, unsigned long a1, void *lr) {
              unsigned i = __sync_fetch_and_add(&gRbN, 1); RbEnt *e = &gRb[i & 63];
              e->n = n; e->ret = ret; e->err = errno; e->a0 = a0; e->a1 = a1; e->lr = (unsigned long)lr; e->seq = i;
          }
          static int safe_rd(uint64_t a, void *buf, size_t n) {
              vm_size_t got = 0; return a > 0x1000 && vm_read_overwrite(mach_task_self(), (vm_address_t)a, n, (vm_address_t)buf, &got) == KERN_SUCCESS && got == n;
          }
          static void dump_w(const char *m, int n) { write(gFd, m, n); fsync(gFd); if (gFd2 >= 0) { write(gFd2, m, n); fsync(gFd2); } }
          /* ---- v24: dump guest memory (the game's 32-bit address space) as dwords, read through vm_read_overwrite so a bad address cannot fault inside the handler ---- */
          static void dump_guest(const char *label, uint32_t gaddr, int ndw) {
              char b[200]; uint32_t w[64]; int n, ln; if (ndw > 64) ndw = 64;
              if (!safe_rd(0x7800000000ULL + gaddr, w, (size_t)ndw * 4)) { n = snprintf(b, sizeof b, " %s: guest 0x%x unreadable\n", label, gaddr); dump_w(b, n); return; }
              n = snprintf(b, sizeof b, " %s (guest 0x%x, dwords, 8 per line):\n", label, gaddr); dump_w(b, n);
              for (int i = 0; i < ndw; i += 8) {
                  ln = snprintf(b, sizeof b, "  %08x:", gaddr + (uint32_t)i * 4);
                  for (int j = i; j < i + 8 && j < ndw; j++) ln += snprintf(b + ln, sizeof b - ln, " %08x", w[j]);
                  b[ln++] = '\n'; dump_w(b, ln);
              }
          }
          static void dump_ctx(void *ctx, void *fault) {
          #if defined(__APPLE__) && defined(__arm64__)
              ucontext_t *uc = (ucontext_t *)ctx; char b[400]; int n, ln = 0;
              uint64_t pc = __darwin_arm_thread_state64_get_pc(uc->uc_mcontext->__ss), sp = __darwin_arm_thread_state64_get_sp(uc->uc_mcontext->__ss);
              uint64_t fp = __darwin_arm_thread_state64_get_fp(uc->uc_mcontext->__ss), lr = __darwin_arm_thread_state64_get_lr(uc->uc_mcontext->__ss);
              for (int i = 0; i < 29; i++) {
                  ln += snprintf(b + ln, sizeof b - ln, " x%d=%llx", i, (unsigned long long)uc->uc_mcontext->__ss.__x[i]);
                  if (i % 6 == 5 || i == 28) { b[ln++] = '\n'; dump_w(b, ln); ln = 0; }
              }
              n = snprintf(b, sizeof b, " fp=%llx lr=%llx sp=%llx pc=%llx\n", (unsigned long long)fp, (unsigned long long)lr, (unsigned long long)sp, (unsigned long long)pc); dump_w(b, n);
              if ((uint64_t)fault >= 0x7800000000ULL && (uint64_t)fault < 0x7900000000ULL) {
                  n = snprintf(b, sizeof b, " fault 0x%llx is guest address 0x%llx (guest base 0x7800000000)\n", (unsigned long long)(uint64_t)fault, (unsigned long long)((uint64_t)fault - 0x7800000000ULL)); dump_w(b, n);
              }
              if (pc >= gBase && pc - gBase < 0x5b2c000ULL) {                      /* code size = data-code delta of this build (SHA-locked) */
                  uint32_t w[20]; uint64_t a0 = (pc - 64) & ~3ULL;
                  if (safe_rd(a0, w, sizeof w)) {
                      n = snprintf(b, sizeof b, " code words from elf+0x%llx (pc is word #16):\n ", (unsigned long long)(a0 - gBase)); dump_w(b, n); ln = 0;
                      for (int i = 0; i < 20; i++) { ln += snprintf(b + ln, sizeof b - ln, " %08x", w[i]); if (i % 5 == 4) { b[ln++] = '\n'; dump_w(b, ln); ln = 0; } }
                  }
              }
              /* v23: 40 words starting at lr-0x40 (the call that produced the value and the code after it) */
              if (lr >= gBase && lr - gBase < 0x5b2c000ULL) {
                  uint32_t w2[40]; uint64_t a1 = (lr - 0x40) & ~3ULL;
                  if (safe_rd(a1, w2, sizeof w2)) {
                      n = snprintf(b, sizeof b, " lr-side code words from elf+0x%llx (lr is word #16):\n ", (unsigned long long)(a1 - gBase)); dump_w(b, n); ln = 0;
                      for (int i = 0; i < 40; i++) { ln += snprintf(b + ln, sizeof b - ln, " %08x", w2[i]); if (i % 5 == 4) { b[ln++] = '\n'; dump_w(b, ln); ln = 0; } }
                  }
              }
              /* v23: what is guest page 0 and the pages around it (protection, max protection, mapped or not) */
              {
                  static const uint64_t probe[] = {0x7800000000ULL, 0x7800004000ULL, 0x7800010000ULL};
                  for (int i = 0; i < 3; i++) {
                      vm_address_t ra = (vm_address_t)probe[i]; vm_size_t rs = 0; vm_region_basic_info_data_64_t bi; mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64; mach_port_t on = 0;
                      kern_return_t kr = vm_region_64(mach_task_self(), &ra, &rs, VM_REGION_BASIC_INFO_64, (vm_region_info_t)&bi, &cnt, &on);
                      if (kr != KERN_SUCCESS) n = snprintf(b, sizeof b, " region at 0x%llx: vm_region_64 failed %d\n", (unsigned long long)probe[i], kr);
                      else n = snprintf(b, sizeof b, " region for 0x%llx: starts 0x%llx size 0x%llx prot %d max %d (1=r 2=w 4=x) %s\n", (unsigned long long)probe[i], (unsigned long long)ra, (unsigned long long)rs, bi.protection, bi.max_protection,
                                        (uint64_t)ra > probe[i] ? "(this address is NOT in a region; next region shown)" : "(mapped)");
                      dump_w(b, n);
                  }
              }
              {
                  unsigned tot = gRbN, cnt2 = tot < 64 ? tot : 64;
                  n = snprintf(b, sizeof b, " failed low-level calls (last %u of %u, newest last):\n", cnt2, tot); dump_w(b, n);
                  for (unsigned k = 0; k < cnt2; k++) {
                      RbEnt *e = &gRb[(tot - cnt2 + k) & 63];
                      n = snprintf(b, sizeof b, "  #%u %s(a=0x%lx, b=0x%lx) -> %ld errno %d from elf+0x%lx\n", e->seq, e->n ? e->n : "?", e->a0, e->a1, e->ret, e->err, e->lr - (unsigned long)gBase); dump_w(b, n);
                  }
              }
              /* v24: the allocator arena at guest 0x11008574 (limit at -4, top at 0, high-water at -0xc), the guest Cpu struct (x19 in the crashing function) and the guest stack around ESP */
              dump_guest("ARENA struct", 0x11008540, 24);
              {
                  uint32_t c[12]; uint64_t cpu = uc->uc_mcontext->__ss.__x[19];
                  if (safe_rd(cpu, c, sizeof c)) {
                      n = snprintf(b, sizeof b, " Cpu@x19=%llx: c0(eax)=%08x c1=%08x c2=%08x c3=%08x c4(esp)=%08x c5=%08x c6=%08x c7=%08x\n", (unsigned long long)cpu, c[0], c[1], c[2], c[3], c[4], c[5], c[6], c[7]); dump_w(b, n);
                      dump_guest("guest stack from ESP-0x40", c[4] - 0x40, 40);
                  } else { n = snprintf(b, sizeof b, " Cpu@x19=%llx unreadable\n", (unsigned long long)cpu); dump_w(b, n); }
              }
              uint64_t st[12]; if (safe_rd(sp, st, sizeof st)) {
                  ln = snprintf(b, sizeof b, " stack @sp:"); for (int i = 0; i < 12; i++) ln += snprintf(b + ln, sizeof b - ln, " %llx", (unsigned long long)st[i]);
                  b[ln++] = '\n'; dump_w(b, ln);
              }
              ln = snprintf(b, sizeof b, " frame chain (elf offsets):");
              for (int i = 0; i < 14; i++) {
                  uint64_t fr[2]; if (!safe_rd(fp, fr, sizeof fr)) break;
                  ln += snprintf(b + ln, sizeof b - ln, " %llx", (unsigned long long)(fr[1] - gBase));
                  if (fr[0] <= fp) break; fp = fr[0];
              }
              b[ln++] = '\n'; dump_w(b, ln);
          #else
              (void)ctx; (void)fault;
          #endif
          }

          static void crash(int sig, siginfo_t *si, void *ctx) {
              char b[300]; uint64_t pc = 0, lr = 0;
          #if defined(__APPLE__) && defined(__arm64__)
              ucontext_t *uc = (ucontext_t *)ctx;
              pc = __darwin_arm_thread_state64_get_pc(uc->uc_mcontext->__ss);
              lr = __darwin_arm_thread_state64_get_lr(uc->uc_mcontext->__ss);
          #endif
              if (gGuard && pthread_equal(pthread_self(), gGuardTh)) { gGuard = 0; gCrashSig = sig; gCrashPc = pc; gCrashFault = (uint64_t)si->si_addr; siglongjmp(gJ, 1); }
              int n = snprintf(b, sizeof b, "\nCRASH (thread %llx, stage %s) sig=%d fault=%p pc=0x%llx (elf+0x%llx) lr=0x%llx (elf+0x%llx)\n", (unsigned long long)(uintptr_t)pthread_self(), (const char *)gStage, sig, si->si_addr,
                               (unsigned long long)pc, (unsigned long long)(pc - gBase), (unsigned long long)lr, (unsigned long long)(lr - gBase));
              write(gFd, b, n); fsync(gFd); if (gFd2 >= 0) { write(gFd2, b, n); fsync(gFd2); } dump_ctx(ctx, si->si_addr); _exit(139);
          }


          /* ---- v13: real implementations for imports Darwin lacks or implements differently ---- */
          static void *slurp(const char *dir, const char *name, size_t *len);
          static void *gPhdr;
          static int okptr(uint64_t p) { return p > 0x100000 && p < 0x800000000000ULL; }
          static void sh_abort_msg(const char *m) { L("ANDROID ABORT MESSAGE: %s", okptr((uint64_t)m) ? m : "(bad pointer)"); }
          static unsigned long sh_getauxval(unsigned long t) {
