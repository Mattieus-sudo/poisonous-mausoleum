          /* open/fcntl/ioctl: mode / arg come in registers on Android, so plain C parameters read them correctly */
          static int bio_oflags(int f) {
              int d = f & 3;
              if (f & 0x40) d |= O_CREAT; if (f & 0x80) d |= O_EXCL; if (f & 0x200) d |= O_TRUNC; if (f & 0x400) d |= O_APPEND;
              if (f & 0x800) d |= O_NONBLOCK; if (f & 0x4000) d |= O_DIRECTORY; if (f & 0x8000) d |= O_NOFOLLOW; if (f & 0x80000) d |= O_CLOEXEC;
