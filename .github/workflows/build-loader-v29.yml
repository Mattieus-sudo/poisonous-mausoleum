                  if (thread_suspend(th[i]) != KERN_SUCCESS) continue;
                  arm_thread_state64_t st; mach_msg_type_number_t sc = ARM_THREAD_STATE64_COUNT;
                  if (thread_get_state(th[i], ARM_THREAD_STATE64, (thread_state_t)&st, &sc) == KERN_SUCCESS) {
                      e->ok = 1; e->pc = __darwin_arm_thread_state64_get_pc(st); e->lr = __darwin_arm_thread_state64_get_lr(st); e->sp = __darwin_arm_thread_state64_get_sp(st);
                      uint64_t fp = __darwin_arm_thread_state64_get_fp(st);
                      for (int k = 0; k < TD_CH; k++) { uint64_t fr[2]; if (!safe_rd(fp, fr, sizeof fr)) break; e->ch[e->nch++] = fr[1]; if (fr[0] <= fp) break; fp = fr[0]; }
                  }
                  thread_resume(th[i]); cnt++;
              }
              L("THREADDUMP (%s): %d threads, looper polls %d (with a source %d), game exit requested %s", why, cnt, gPollCalls, gPollIdent, gExitReq ? "yes" : "no");
              for (int i = 0; i < cnt; i++) {
                  TdEnt *e = &gTd[i]; char nm[40] = "?", b[1000]; int ln;
                  pthread_t pt = pthread_from_mach_thread_np(e->port); if (pt) pthread_getname_np(pt, nm, sizeof nm);
                  if (!e->ok) { L("  T%d [%s] state unreadable", i, nm); continue; }
                  char a[120], c[120]; td_fmt(a, sizeof a, e->pc); td_fmt(c, sizeof c, e->lr);
                  ln = snprintf(b, sizeof b, "  T%d [%s] pc %s lr %s sp %llx chain:", i, nm, a, c, (unsigned long long)e->sp);
                  for (int k = 0; k < e->nch && ln < (int)sizeof b - 130; k++) { td_fmt(a, sizeof a, e->ch[k]); ln += snprintf(b + ln, sizeof b - ln, " %s", a); }
                  L("%s", b);
              }
          #else
              (void)why;
          #endif
          }
          static void *td_thread(void *p) {
              (void)p; int t = 0, lastpoll = -1, still = 0, fired = 0;
              for (;;) {
                  sleep(1); t++;
                  int pc = gPollCalls; if (pc == lastpoll) still++; else { still = 0; fired = 0; } lastpoll = pc;
                  if (t == 20 || t == 45 || t == 90) dump_threads("timed");
                  else if (still >= 5 && !fired) { fired = 1; dump_threads("no looper poll for 5 s"); }
                  if (t >= 180) break;
              }
              return NULL;
          }
