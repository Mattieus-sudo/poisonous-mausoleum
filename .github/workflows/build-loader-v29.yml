              if (img_find((uint64_t)(uintptr_t)s->imageView, &e)) {
                  a->fmt = e.fmt; a->w = e.w; a->h = e.h;
                  if (e.img && img_find(e.img, &ie)) { a->w = ie.w; a->h = ie.h; a->usage = ie.usage; }
              }
          }
          static void pr_draw(void) {
              __sync_fetch_and_add(&gDrawTot, 1); PRec *r = tCur; if (!r) { __sync_fetch_and_add(&gDrawOut, 1); return; }
              unsigned k = r->draws++; if (k == 0 || k == 49) {
                  PSt *s = &r->s[k ? 1 : 0]; s->ok = 1; if (tVpOK) s->vp = tVp; if (tScOK) memcpy(s->sc, tSc, sizeof s->sc);
                  s->cull = tCull; s->front = tFront; s->dt = tDT; s->dw = tDW; s->dop = tDop;
              }
          }

          /* real MoltenVK entry points, filled in when the game asks for the name (see trace_override) */
          static void (*gR_begin)(void *, const VkRI *), (*gR_end)(void *);
          static void (*gR_rpbegin)(void *, const VkRPBI *, int), (*gR_rpend)(void *);
          static void (*gR_draw)(void *, unsigned, unsigned, unsigned, unsigned), (*gR_drawi)(void *, unsigned, unsigned, unsigned, int, unsigned);
          static void (*gR_svp)(void *, unsigned, unsigned, const VkVp *), (*gR_svpc)(void *, unsigned, const VkVp *);
          static void (*gR_ssc)(void *, unsigned, unsigned, const int *), (*gR_sscc)(void *, unsigned, const int *);
          static void (*gR_cull)(void *, unsigned), (*gR_front)(void *, int), (*gR_dt)(void *, unsigned), (*gR_dw)(void *, unsigned), (*gR_dop)(void *, int);
          static int (*gR_cimg)(void *, const VkICI2 *, const void *, uint64_t *), (*gR_cview)(void *, const VkIVCI *, const void *, uint64_t *);
