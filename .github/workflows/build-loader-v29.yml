          static ssize_t sh_write_chk(int fd, const void *b, size_t n, size_t bos) { (void)bos; return write(fd, b, n); }
          static ssize_t sh_pread_chk(int fd, void *b, size_t n, off_t o, size_t bos) { (void)bos; return pread(fd, b, n, o); }
