          struct bio_phdr_info { uint64_t addr; const char *name; const void *phdr; uint16_t phnum; uint64_t adds, subs; size_t tls_modid; void *tls_data; };
          static int sh_dl_iterate_phdr(int (*cb)(struct bio_phdr_info *, size_t, void *), void *data) {
