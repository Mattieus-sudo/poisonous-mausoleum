              if (slot < 0) for (int i = 0; i < LSRC_MAX; i++) if (l->s[i].fd < 0) { slot = i; break; }
              if (logged++ < 12) L("PLAT ALooper_addFd fd=%d ident=%d events=%d cb=%p data=%p -> slot %d", fd, ident, events, (void *)cb, data, slot);
              if (slot < 0) return -1;
