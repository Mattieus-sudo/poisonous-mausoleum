          typedef struct { char name[256]; unsigned spec; } VkExtP;
          /* ---- v29: MoltenVK switches + a Vulkan render-pass trace. Since v28 the game runs, input works, and the UI, loading art, map and pause menu draw, but the
             3D world is black (about 40-48k draws/s, 0 pipeline failures, so the draws exist). The renderer is closed code, so the only places we can look are
             (1) MoltenVK's own settings and its warnings/errors and (2) the Vulkan calls the game makes on the way to MoltenVK.
             SWITCHES are folders (or files) with these exact names in the app's Documents folder: make a New Folder in the Files app. Read at the moment the game
             loads Vulkan, so create/delete them while the app is closed. The loader also writes Documents/P2_SWITCHES.txt listing them. ---- */
          static int mk_has(const char *name) { char p[1200]; struct stat st; if (!gDocs[0]) return 0; snprintf(p, sizeof p, "%s/%s", gDocs, name); return stat(p, &st) == 0; }
          static void mk_eat(const char *name) { char p[1200]; if (!gDocs[0]) return; snprintf(p, sizeof p, "%s/%s", gDocs, name); rmdir(p); unlink(p); }
          static void mvk_env_setup(void) {
              static int done; if (done) return; done = 1;
              char p[1200], dump[1200] = "";
              { snprintf(p, sizeof p, "%s/P2_SWITCHES.txt", gDocs); FILE *f = fopen(p, "w");
                if (f) { fputs(
                  "P2 loader v29 switches. Create a NEW FOLDER with the exact name in this Documents folder (Files app > On My iPhone > P2Loader). Close the app first.\n\n"
                  "mvk_fastmath_on     MoltenVK shader fast-math ON (MoltenVK's own default). v29 default is OFF (an experiment: fast-math can turn NaN/Inf into black).\n"
                  "mvk_fastmath_auto   fast-math ON except for shaders that ask for strict NaN/Inf handling.\n"
                  "mvk_argbuf_off      do not use Metal argument buffers.\n"
                  "mvk_dumpshaders     write every SPIR-V and converted Metal shader to Documents/mvk_shaders (big; only for a short run).\n"
                  "mvk_log_info        MoltenVK logs info messages too (default: errors and warnings only) into mvk_stderr.log.\n"
                  "vk_loadop_fix_off   do NOT rewrite Vulkan LOAD_OP_NONE / STORE_OP_NONE to LOAD / STORE (v29 default rewrites them; see VKTRACE lines).\n"
                  "vktrace_now         while the game runs: create this folder (switch app, make it, come back). The next frame boundary prints a VKTRACE\n"
                  "                    dump of that frame's render passes and the loader deletes the folder again, so you can repeat it.\n\n"
                  "Log files: p2_loader_log.txt (VKTRACE / MVKENV lines), mvk_stderr.log (MoltenVK's own messages).\n", f); fclose(f); } }
              snprintf(p, sizeof p, "%s/mvk_stderr.log", gDocs);
              int fd = open(p, O_WRONLY | O_CREAT | O_TRUNC, 0644); if (fd >= 0) { dup2(fd, 2); close(fd); }
              int fm = mk_has("mvk_fastmath_on") ? 1 : mk_has("mvk_fastmath_auto") ? 2 : 0;
              setenv("MVK_CONFIG_FAST_MATH_ENABLED", fm == 1 ? "1" : fm == 2 ? "2" : "0", 1);
              setenv("MVK_CONFIG_LOG_LEVEL", mk_has("mvk_log_info") ? "3" : "2", 1);
              int ab = mk_has("mvk_argbuf_off"); if (ab) setenv("MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS", "0", 1);
              int ds = mk_has("mvk_dumpshaders"); if (ds) { snprintf(dump, sizeof dump, "%s/mvk_shaders", gDocs); mkdir(dump, 0755); setenv("MVK_CONFIG_SHADER_DUMP_DIR", dump, 1); }
              L("MVKENV fast_math=%d log_level=%s argbuf_off=%d dumpshaders=%d stderr->mvk_stderr.log (%s)", fm, mk_has("mvk_log_info") ? "3" : "2", ab, ds, fd >= 0 ? "ok" : "FAILED");
          }

          typedef struct { int sType; const void *pNext; void *imageView; int imageLayout, resolveMode; void *resolveImageView; int resolveImageLayout, loadOp, storeOp; float clr[4]; } VkRAI;
          typedef struct { int sType; const void *pNext; unsigned flags; int x, y; unsigned w, h, layers, viewMask, nColor; const VkRAI *pColor, *pDepth, *pStencil; } VkRI;
          typedef struct { int sType; const void *pNext; void *renderPass, *framebuffer; int x, y; unsigned w, h, nClear; const float *pClear; } VkRPBI;
          typedef struct { int sType; const void *pNext; unsigned flags; void *image; int viewType, format; } VkIVCI;
          typedef struct { int sType; const void *pNext; unsigned flags; int imageType, format; unsigned w, h, d, mips, layers; int samples, tiling; unsigned usage; } VkICI2;
          typedef struct { float x, y, w, h, mn, mx; } VkVp;
          #define LOADOP_NONE 1000400000
          #define STOREOP_NONE 1000301000

          /* image / view table: handle -> format, size, (for views) the image. Never shrinks; a reused handle overwrites its entry. */
          typedef struct { uint64_t k; int fmt; unsigned w, h, usage; uint64_t img; } ImgE;
          #define IMG_N 32768
          static ImgE *gImgT; static volatile int gImgLk; static unsigned gImgCnt; static int gImgFull;
          static void img_lock(void) { while (__atomic_exchange_n(&gImgLk, 1, __ATOMIC_ACQUIRE)) sched_yield(); }
          static void img_unlock(void) { __atomic_store_n(&gImgLk, 0, __ATOMIC_RELEASE); }
          static unsigned img_hash(uint64_t k) { return (unsigned)((k >> 4) * 0x9E3779B1u) & (IMG_N - 1); }
          static void img_put(uint64_t k, const ImgE *e) {
              if (!k) return;
              img_lock();
              if (!gImgT) gImgT = calloc(IMG_N, sizeof(ImgE));
              if (gImgT) {
                  unsigned h = img_hash(k), t = 0; while (gImgT[h].k && gImgT[h].k != k && t++ < IMG_N) h = (h + 1) & (IMG_N - 1);
                  if (gImgT[h].k == k || gImgCnt < IMG_N * 3 / 4) { if (!gImgT[h].k) gImgCnt++; gImgT[h] = *e; gImgT[h].k = k; }
                  else if (!gImgFull) { gImgFull = 1; L("VKTRACE image table full (%u entries): later images will show fmt -1", gImgCnt); }
              }
              img_unlock();
          }
          static int img_find(uint64_t k, ImgE *out) {
              int ok = 0; if (!k) return 0;
              img_lock();
              if (gImgT) { unsigned h = img_hash(k), t = 0; while (gImgT[h].k && t++ < IMG_N) { if (gImgT[h].k == k) { *out = gImgT[h]; ok = 1; break; } h = (h + 1) & (IMG_N - 1); } }
              img_unlock(); return ok;
          }

          typedef struct { int used, fmt; unsigned w, h, usage; int load, store; float clr[4]; } PAtt;
          typedef struct { char ok; VkVp vp; int sc[4]; int cull, front, dt, dw, dop; } PSt;
          typedef struct { unsigned seq, frame, w, h, nColor, draws; unsigned char kind; PAtt c[3], d; float raw[8]; unsigned nRaw; PSt s[2]; } PRec;
          #define PR_N 2048
          static PRec gPR[PR_N]; static volatile unsigned gPRn, gFrame, gDrawTot, gDrawOut;
          static __thread PRec *tCur; static __thread VkVp tVp; static __thread int tVpOK, tScOK, tSc[4], tCull = -1, tFront = -1, tDT = -1, tDW = -1, tDop = -1;
          static PRec *pr_new(int kind, unsigned w, unsigned h, unsigned nc) {
