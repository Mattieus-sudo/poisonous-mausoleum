          static int sh_alog_print(REGS) { MKSRC(s, 3); char b[1024]; b[0] = 0; uint64_t sl_[NSLOT + 2]; memset(sl_, 0, sizeof sl_); bio_slots(safe_s(x2), &s, sl_); vsnprintf(b, sizeof b, safe_s(x2), AS_VA(sl_)); alog(x0, (uint64_t)x1, b); return 1; }
          static int sh_alog_vprint(int prio, const char *tag, const char *f, BioVa *va) { VSRC(s, va); char b[1024]; b[0] = 0; uint64_t sl_[NSLOT + 2]; memset(sl_, 0, sizeof sl_); bio_slots(safe_s((uint64_t)f), &s, sl_); vsnprintf(b, sizeof b, safe_s((uint64_t)f), AS_VA(sl_)); alog(prio, (uint64_t)tag, b); return 1; }
