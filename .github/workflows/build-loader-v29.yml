              else L("GUEST %s(linux sig %d, handler %s, flags 0x%x)", via, sig, hv == 0 ? "SIG_DFL" : hv == 1 ? "SIG_IGN" : "other", flags);
          }
          static int sh_sigaction(int sig, const struct bio_sa *act, struct bio_sa *old) {
