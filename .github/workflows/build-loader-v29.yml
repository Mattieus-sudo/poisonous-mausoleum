          /* ---- v14: Bionic pthread/clock/mmap/sysconf ABI differences ---- */
          static int tr_err(int r) { switch (r) { case 60: return 110; case 11: return 35; case 35: return 11; } return r; }  /* Darwin -> Linux errno */
          /* ---- v15: Darwin sync objects are found through a 32-bit index kept at guest+4.
             Bionic mutex/cond/rwlock are int32 arrays (4-byte aligned). The v14 design kept a 64-bit pointer at +8 and used 8-byte atomics on it,
             which raise SIGBUS when the guest object is not 8-byte aligned. A 32-bit slot at +4 is always aligned. ---- */
          #define SO_CH 1024
          #define SO_PER 4096
          static void *volatile *gSoTab[SO_CH];
          static uint32_t gSoNext = 1, gSoFree;
          static pthread_mutex_t gSoLock = PTHREAD_MUTEX_INITIALIZER;
          static void *volatile *so_slot(uint32_t idx) {
              uint32_t c = idx / SO_PER;
              if (c >= SO_CH) return NULL;
              void *volatile *t = __atomic_load_n(&gSoTab[c], __ATOMIC_ACQUIRE);
              return t ? &t[idx % SO_PER] : NULL;
          }
          static void *so_get(uint32_t idx) { void *volatile *s = so_slot(idx); return s ? (void *)*s : NULL; }
          static uint32_t so_alloc(void *p) {
              uint32_t idx; pthread_mutex_lock(&gSoLock);
              if (gSoFree) { idx = gSoFree; gSoFree = (uint32_t)(uintptr_t)*so_slot(idx); }
              else {
                  idx = gSoNext;
                  uint32_t c = idx / SO_PER;
                  if (c >= SO_CH) { pthread_mutex_unlock(&gSoLock); return 0; }
                  if (!gSoTab[c]) { void *volatile *t = calloc(SO_PER, sizeof(void *)); __atomic_store_n(&gSoTab[c], t, __ATOMIC_RELEASE); }
                  gSoNext++;
              }
              *so_slot(idx) = p;
              pthread_mutex_unlock(&gSoLock);
              return idx;
          }
          static void so_release(uint32_t idx) {
              pthread_mutex_lock(&gSoLock);
              *so_slot(idx) = (void *)(uintptr_t)gSoFree; gSoFree = idx;
              pthread_mutex_unlock(&gSoLock);
          }
          static void *lazy_obj(uint8_t *g, size_t sz, void (*init)(void *, uint8_t *)) {
              uint32_t *slot = (uint32_t *)(g + 4); uint32_t v = __atomic_load_n(slot, __ATOMIC_ACQUIRE);
              if (v) return so_get(v);
              void *p = calloc(1, sz); init(p, g);
              uint32_t idx = so_alloc(p);
              if (!idx) { L("sync-object table full"); _exit(5); }
              uint32_t e = 0;
              if (!__atomic_compare_exchange_n(slot, &e, idx, 0, __ATOMIC_ACQ_REL, __ATOMIC_ACQUIRE)) { so_release(idx); free(p); return so_get(e); }
              return p;
          }
          static void mx_init(void *p, uint8_t *g) {
              pthread_mutexattr_t a; pthread_mutexattr_init(&a); int ty = (*(uint32_t *)g >> 14) & 3;
              if (ty == 1) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE); else if (ty == 2) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
              pthread_mutex_init(p, &a); pthread_mutexattr_destroy(&a);
          }
