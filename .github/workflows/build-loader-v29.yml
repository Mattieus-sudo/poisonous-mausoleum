              if (gFd >= 0) { write(gFd, b, strlen(b)); write(gFd, "\n", 1); fsync(gFd); }
              if (gFd2 >= 0) { write(gFd2, b, strlen(b)); write(gFd2, "\n", 1); fsync(gFd2); }
