          static void *tp_thread(void *a) {
              uint64_t v, ro; (void)a;
              __asm__ volatile("mrs %0, tpidr_el0" : "=r"(v)); __asm__ volatile("mrs %0, tpidrro_el0" : "=r"(ro));
              L("  [other thread] TPIDR_EL0=0x%llx TPIDRRO_EL0=0x%llx", (unsigned long long)v, (unsigned long long)ro);
              uint64_t m = 0x2222222222222222ULL, bad = 0;
              __asm__ volatile("msr tpidr_el0, %0" :: "r"(m));
              for (int i = 0; i < 20; i++) { usleep(10000); __asm__ volatile("mrs %0, tpidr_el0" : "=r"(v)); if (v != m) bad++; }
              L("  [other thread] kept its own value over 20 sleeps: %s", bad ? "NO" : "yes");
              __asm__ volatile("msr tpidr_el0, xzr");
