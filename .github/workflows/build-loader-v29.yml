          #import <UIKit/UIKit.h>
          #import <Metal/Metal.h>
          #import <QuartzCore/CAMetalLayer.h>
          #include "p2core.h"

          @interface GameView : UIView @end
          @implementation GameView
          + (Class)layerClass { return [CAMetalLayer class]; }
          static void *gSlot[10];
          static int slotFor(UITouch *t, BOOL create) {
              for (int i = 0; i < 10; i++) if (gSlot[i] == (__bridge void *)t) return i;
              if (!create) return -1;
              for (int i = 0; i < 10; i++) if (!gSlot[i]) { gSlot[i] = (__bridge void *)t; return i; }
              return -1;
          }
          - (void)feed:(NSSet<UITouch *> *)ts phase:(int)ph {
              CGFloat sc = UIScreen.mainScreen.nativeScale;
              for (UITouch *t in ts) {
                  int s = slotFor(t, ph == 0); if (s < 0) continue;
                  CGPoint p = [t locationInView:self];
                  p2_touch(ph, s, (float)(p.x * sc), (float)(p.y * sc));
                  if (ph >= 2) gSlot[s] = NULL;
              }
          }
          - (void)touchesBegan:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:0]; }
          - (void)touchesMoved:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:1]; }
          - (void)touchesEnded:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:2]; }
          - (void)touchesCancelled:(NSSet<UITouch *> *)t withEvent:(UIEvent *)e { [self feed:t phase:3]; }
          @end
          static GameView *gGame;

          static UITextView *gView;
          static NSMutableString *gText;
          static BOOL gDirty, gRan;
          static NSString *sFw, *sRes, *sRep;
          static void emit(const char *s) {   /* always called on the main thread */
              [gText appendFormat:@"%s\n", s];
              if (!gDirty) { gDirty = YES; dispatch_async(dispatch_get_main_queue(), ^{ gDirty = NO; gView.text = gText; [gView scrollRangeToVisible:NSMakeRange(gText.length, 0)]; }); }
          }

          @interface AD : UIResponder <UIApplicationDelegate>
          @property(strong, nonatomic) UIWindow *window;
          @end
          @implementation AD
          @synthesize window = _window;
          - (UIButton *)btn:(NSString *)t x:(CGFloat)x sel:(SEL)s {
              UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
              [b setTitle:t forState:UIControlStateNormal]; b.frame = CGRectMake(x, 70, 120, 44);
              [b addTarget:self action:s forControlEvents:UIControlEventTouchUpInside]; return b;
          }
          - (void)applicationDidReceiveMemoryWarning:(UIApplication *)a { p2_note("iOS: MEMORY WARNING received"); }
          - (void)applicationWillResignActive:(UIApplication *)a { p2_note("iOS: app will resign active (home gesture, control centre or a system overlay)"); }
          - (void)applicationDidEnterBackground:(UIApplication *)a { p2_note("iOS: app entered the background"); }
          - (void)applicationWillTerminate:(UIApplication *)a { p2_note("iOS: applicationWillTerminate"); }
          - (BOOL)application:(UIApplication *)a didFinishLaunchingWithOptions:(NSDictionary *)o {
              gText = [NSMutableString string];
              self.window = [[UIWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              UIViewController *vc = [UIViewController new]; vc.view.backgroundColor = UIColor.blackColor;
              CGRect b = vc.view.bounds;
              gView = [[UITextView alloc] initWithFrame:CGRectMake(8, 120, b.size.width - 16, b.size.height - 130)];
              gView.editable = NO; gView.font = [UIFont fontWithName:@"Menlo" size:10]; gView.backgroundColor = UIColor.blackColor; gView.textColor = UIColor.greenColor;
              gView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
          gGame = [[GameView alloc] initWithFrame:vc.view.bounds];
          gGame.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
          CAMetalLayer *ml = (CAMetalLayer *)gGame.layer; ml.device = MTLCreateSystemDefaultDevice(); ml.pixelFormat = MTLPixelFormatBGRA8Unorm;
          ml.contentsScale = UIScreen.mainScreen.nativeScale; gGame.backgroundColor = UIColor.blackColor; gGame.multipleTouchEnabled = YES; gGame.userInteractionEnabled = YES;
          [vc.view addSubview:gGame];
              [vc.view addSubview:gView];
              [vc.view addSubview:[self btn:@"Run loader test" x:5 sel:@selector(run)]];
              [vc.view addSubview:[self btn:@"Copy report" x:130 sel:@selector(copyReport)]];
          [vc.view addSubview:[self btn:@"Game / Log" x:255 sel:@selector(toggle)]];
              self.window.rootViewController = vc; [self.window makeKeyAndVisible]; return YES;
          }
          - (void)run {
              if (gRan) { emit("(already ran in this launch: close the app from the app switcher and open it again to repeat)"); return; }
              gRan = YES;
              NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES)[0];
              NSDateFormatter *df = [NSDateFormatter new]; df.dateFormat = @"yyyyMMdd-HHmmss";
              sFw = [[NSBundle mainBundle].privateFrameworksPath stringByAppendingString:@"/P2Code.framework/P2Code"];
              sRes = [NSBundle mainBundle].resourcePath;
              sRep = [docs stringByAppendingFormat:@"/p2_loader_log_%@.txt", [df stringFromDate:NSDate.date]];
              { CGFloat sc = UIScreen.mainScreen.nativeScale; CGSize b = gGame.bounds.size;
            p2_win_w = (int)(b.width * sc); p2_win_h = (int)(b.height * sc); p2_metal_layer = (__bridge void *)gGame.layer;
            emit([NSString stringWithFormat:@"game surface %dx%d px (turn the phone to landscape BEFORE pressing Run; use Game / Log to switch views)", p2_win_w, p2_win_h].UTF8String); }
          emit("loader started on a background thread; this screen updates while it runs");
              NSThread *t = [[NSThread alloc] initWithBlock:^{ p2_run(emit, sFw.UTF8String, sRes.UTF8String, sRep.UTF8String); }];
              t.stackSize = 16 << 20; t.name = @"p2-loader"; [t start];
          }
          - (void)toggle { gView.hidden = !gView.hidden; }
          - (void)copyReport { UIPasteboard.generalPasteboard.string = gText; }
          @end

          int main(int argc, char **argv) { @autoreleasepool { return UIApplicationMain(argc, argv, nil, @"AD"); } }
          EOF_MAIN_M
          APP=Payload/P2Loader.app
          mkdir -p $APP/Frameworks/P2Code.framework
          MVK_LINK=""
          if [ -d mvk/fw/MoltenVK.framework ]; then cp -R mvk/fw/MoltenVK.framework $APP/Frameworks/ && echo "MoltenVK: dynamic framework embedded";
          elif [ -f mvk/static/libMoltenVK.a ]; then MVK_LINK="-Wl,-force_load,mvk/static/libMoltenVK.a -lc++ -framework CoreGraphics -framework IOSurface"; echo "MoltenVK: static library linked";
          else echo "MoltenVK missing"; exit 1; fi
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -fobjc-arc -O1 -framework UIKit -framework Foundation -framework Metal -framework QuartzCore $MVK_LINK main.m p2core.c p2imports.c p2stubs.s p2asm.s -o $APP/P2Loader
          cp P2Code $APP/Frameworks/P2Code.framework/P2Code
