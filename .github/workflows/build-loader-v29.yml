          #define TD_MAX 48
          #define TD_CH 14
          typedef struct { mach_port_t port; uint64_t pc, lr, sp; uint64_t ch[TD_CH]; int nch, ok; } TdEnt;
          static TdEnt gTd[TD_MAX];
          static void td_fmt(char *o, size_t n, uint64_t a) {
              if (a >= gBase && a - gBase < 0x5b2c000ULL) { snprintf(o, n, "e+%llx", (unsigned long long)(a - gBase)); return; }
              Dl_info di; if (a && dladdr((void *)a, &di) && di.dli_sname) { snprintf(o, n, "%s+%llx", di.dli_sname, (unsigned long long)(a - (uint64_t)di.dli_saddr)); return; }
              snprintf(o, n, "%llx", (unsigned long long)a);
          }
          static void dump_threads(const char *why) {
          #if defined(__APPLE__) && defined(__arm64__)
              thread_act_array_t th = NULL; mach_msg_type_number_t n = 0;
              if (task_threads(mach_task_self(), &th, &n) != KERN_SUCCESS) { L("THREADDUMP (%s): task_threads failed", why); return; }
              mach_port_t me = mach_thread_self(); int cnt = 0;
              for (mach_msg_type_number_t i = 0; i < n && cnt < TD_MAX; i++) {
                  if (th[i] == me) continue;
