name: Inspect APK v2 (deep native analysis)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Link to the APK (Google Drive share link, or a direct https link). Paste the NEW 1.0.3 link."
        required: true
        default: "https://drive.google.com/file/d/1QcHUrrsNjlb2BeH_MHkgUCuFYDbw_kzZ/view?usp=share_link"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils binutils-aarch64-linux-gnu file unzip aapt python3
          sudo apt-get install -y -q spirv-tools || echo "spirv-tools not available, SPIR-V step will be skipped"
          pip install gdown

      - name: Download APK
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          case "$APK_URL" in
            *drive.google.com*) gdown --fuzzy "$APK_URL" -O game.apk ;;
            *) curl -L --fail -o game.apk "$APK_URL" ;;
          esac
          ls -la game.apk
          file game.apk
          unzip -tq game.apk | tail -1

      - name: Unzip APK
        run: |
          unzip -q game.apk -d apk
          ls -la apk/lib/arm64-v8a/

      - name: Write helper scripts
        run: |
          cat > sample.py <<'PY'
          import subprocess, shutil
          so = "apk/lib/arm64-v8a/libp2re.so"
          objdump = shutil.which("aarch64-linux-gnu-objdump") or "objdump"
          nm = subprocess.run(["nm", "-D", "-S", "--defined-only", so], capture_output=True, text=True).stdout.splitlines()
          funcs = []
          for line in nm:
              p = line.split()
              if len(p) == 4 and p[3].startswith("_Z") and "f_" in p[3] and p[3].endswith("P3Cpu"):
                  funcs.append((int(p[0], 16), int(p[1], 16), p[3]))
          funcs.sort()
          if not funcs:
              print("No sized f_*(Cpu*) exports found")
          else:
              print(f"{len(funcs)} sized f_*(Cpu*) exports; VMA range {funcs[0][0]:#x} - {funcs[-1][0]:#x}")
              sizes = sorted(f[1] for f in funcs)
              print("function size min / median / max (bytes):", sizes[0], sizes[len(sizes)//2], sizes[-1])
              mid = [f for f in funcs if 128 <= f[1] <= 768]
              for q in (0.1, 0.5, 0.9):
                  if not mid:
                      break
                  addr, size, name = mid[int(len(mid) * q)]
                  print(f"\n=== {name}  at {addr:#x}  size {size}")
                  r = subprocess.run([objdump, "-d", "--no-show-raw-insn",
                                      f"--start-address={addr:#x}", f"--stop-address={addr+size:#x}", so],
                                     capture_output=True, text=True)
                  print((r.stdout or r.stderr)[-5000:])
          PY

          cat > analyze.sh <<'EOF'
          #!/usr/bin/env bash
          # No "set -e" on purpose: keep going if one probe fails.
          SO=apk/lib/arm64-v8a/libp2re.so
          OUT=out
          mkdir -p "$OUT"
          R="$OUT/report.md"
          sec() { { echo; echo "## $1"; echo '```'; } >> "$R"; }
          end() { echo '```' >> "$R"; }

          echo "# APK static analysis v2" > "$R"
          echo "Generated: $(date -u)" >> "$R"

          sec "Identity"
          { sha256sum game.apk "$SO"; ls -l game.apk "$SO"; file "$SO";
            aapt dump badging game.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|launchable-activity)"; } >> "$R" 2>&1
          end

          unzip -l game.apk > "$OUT/apk_files.txt"
          aapt dump xmltree game.apk AndroidManifest.xml > "$OUT/manifest_xmltree.txt" 2>&1
          sec "Manifest (xmltree, first 90 lines)"
          head -90 "$OUT/manifest_xmltree.txt" >> "$R"
          end

          sec "ELF program headers (readelf -lW)"
          readelf -lW "$SO" >> "$R" 2>&1
          end

          sec "ELF section headers (readelf -SW)"
          readelf -SW "$SO" >> "$R" 2>&1
          end

          sec "ELF dynamic section (readelf -dW)  [look for RELR / ANDROID_REL packed relocs, INIT_ARRAY, FLAGS]"
          readelf -dW "$SO" >> "$R" 2>&1
          end

          sec "Relocation tables (decoded by binutils) and counts by type"
          readelf -rW "$SO" 2>/dev/null | grep "Relocation section" >> "$R"
          readelf -rW "$SO" 2>/dev/null | awk '$1 ~ /^[0-9a-f]+$/ && length($1)==16 {c[$3]++} END{for(k in c) print c[k], k}' | sort -rn >> "$R"
          end

          # Imports and exports
          nm -D --undefined-only "$SO" | awk '{print $NF}' | sort -u > "$OUT/imports.txt"
          nm -D --defined-only "$SO" | awk '{print $NF}' > "$OUT/exports_all.txt"
          grep -vE '^_Z[0-9]+f_[0-9a-f]+P3Cpu$' "$OUT/exports_all.txt" > "$OUT/exports_non_f.txt"
          c++filt < "$OUT/exports_non_f.txt" > "$OUT/exports_non_f_demangled.txt"

          sec "Import count and OS-sensitive imports (memory, signals, threads, dl, unwinding)"
          wc -l < "$OUT/imports.txt" >> "$R"
          grep -E '^(mmap|mprotect|munmap|madvise|mremap|msync|sigaction|signal|sigaltstack|sigsetjmp|siglongjmp|_setjmp|setjmp|longjmp|pthread_create|pthread_key_create|pthread_getspecific|dlopen|dlsym|dladdr|dl_iterate_phdr|__cxa_throw|__cxa_begin_catch|_Unwind_[A-Za-z_]+|__clear_cache|memfd_create|getauxval|prctl|syscall|fork|execve|__system_property_get|posix_memalign|aligned_alloc|malloc_usable_size|__errno|__stack_chk_fail|__tls_get_addr)$' "$OUT/imports.txt" >> "$R"
          end

          sec "Android NDK API imports (the platform surface to replace on iOS)"
          grep -E '^(A[A-Z][A-Za-z]+_|ANativeActivity|ANativeWindow|AAudio|ALooper|AInputQueue|AInputEvent|AMotionEvent|AKeyEvent|AConfiguration|AAsset|ASensor|AChoreographer|AHardwareBuffer|__android_log)' "$OUT/imports.txt" >> "$R"
          end

          sec "Exports: counts"
          { echo "total exports: $(wc -l < "$OUT/exports_all.txt")";
            echo "f_<addr>(Cpu*) exports: $(grep -cE '^_Z[0-9]+f_[0-9a-f]+P3Cpu$' "$OUT/exports_all.txt")";
            echo "other exports: $(wc -l < "$OUT/exports_non_f.txt")"; } >> "$R"
          end

          sec "Other exports, grouped by shape (hex runs collapsed to N), top 80"
          sed -E 's/[0-9a-fA-F]{5,}/N/g' "$OUT/exports_non_f_demangled.txt" | sort | uniq -c | sort -rn | head -80 >> "$R"
          end

          sec "Other exports, first 250 (demangled)"
          head -250 "$OUT/exports_non_f_demangled.txt" >> "$R"
          end

          # Strings
          strings -n 6 "$SO" | grep -vE '^_Z[0-9]+f_[0-9a-f]+P3Cpu$' > "$OUT/strings.txt"
          grep -E '^vk[A-Z][A-Za-z0-9]+$' "$OUT/strings.txt" | sort -u > "$OUT/vk_functions.txt"
          grep -E '^VK_[A-Za-z0-9_]+$' "$OUT/strings.txt" | sort -u > "$OUT/vk_names.txt"

          sec "Vulkan function names the runtime looks up (strings): count then list"
          wc -l < "$OUT/vk_functions.txt" >> "$R"
          cat "$OUT/vk_functions.txt" >> "$R"
          end

          sec "Vulkan extension / feature / enum names found in strings"
          cat "$OUT/vk_names.txt" | head -300 >> "$R"
          end

          sec "Renderer / platform strings (ngfx, vkpddi, p2re, NFSRE, XAudio2, XInput, Bink, Lua)"
          grep -E 'ngfx|vkpddi|p2re|NFSRE|XAudio2|XInput|bink|Bink|lua|Lua' "$OUT/strings.txt" | sort -u | head -250 >> "$R"
          end

          sec "File / path / archive hints (game data formats, folders)"
          grep -iE 'game_folder|/storage|/sdcard|/proc/|/sys/|/dev/|\.(bik|big|rcf|rcs|rcm|dll|exe|lua|ini|cfg|pak|bin|wav|ogg|xma|fsb|bnk|spv|dat)([^a-z]|$)' "$OUT/strings.txt" | sort -u | head -250 >> "$R"
          end

          sec "Memory / guest-address-space / crash-handling strings"
          grep -iE 'guest|reserve|address space|segv|sigsegv|out of memory|oom|arena|heap|mmap|jit|dynarec|interpret|trampoline|dispatch|thunk|unresolved|unimplemented|stub' "$OUT/strings.txt" | sort -u | head -250 >> "$R"
          end

          sec "Win32 API names referenced as strings (import-table style), first 300"
          grep -E '^(Get|Set|Create|Open|Close|Read|Write|Find|Load|Query|Wait|Release|Virtual|Heap|Local|Global|Tls|Fls|Enter|Leave|Initialize|Delete|Lock|Unlock|Sleep|Exit|Terminate|Output|Is|Multi|Wide|Lstr|Format|Dispatch|Peek|Translate|Register|Show|Update|Adjust|Window|Message|Direct|Co|Rtl|Nt|Xinput|X)[A-Za-z0-9]+(A|W|Ex)?$' "$OUT/strings.txt" | sort -u | head -300 >> "$R"
          end

          sec "Assets (non-shader), largest 100"
          find apk/assets -type f -not -path '*/spirv/*' -printf '%s\t%p\n' | sort -rn | head -100 >> "$R"
          end

          sec "SPIR-V shader files: suffix counts and total size"
          { ls apk/assets/spirv 2>/dev/null | sed -E 's/^[0-9a-f]+\.//' | sort | uniq -c | sort -rn; du -sh apk/assets/spirv 2>/dev/null; } >> "$R"
          end

          sec "SPIR-V capabilities / extensions / versions (sample of up to 400 shaders)"
          if command -v spirv-dis >/dev/null; then
            find apk/assets/spirv -name '*.spv' 2>/dev/null | sort | awk 'NR%7==1' | head -400 | while read -r f; do
              spirv-dis "$f" 2>/dev/null | grep -E '^(; Version|\s*OpCapability|\s*OpExtension|\s*OpMemoryModel)'
            done | sed -E 's/^ +//' | sort | uniq -c | sort -rn | head -80 >> "$R"
          else
            echo "spirv-dis not installed" >> "$R"
          fi
          end

          sec "Sample recompiled functions (disassembly)"
          python3 sample.py >> "$R" 2>&1
          end

          sec "ALL imports (full list, capped at 900)"
          head -900 "$OUT/imports.txt" >> "$R"
          end

          head -c 900000 "$R" >> "$GITHUB_STEP_SUMMARY"
          EOF

      - name: Run analysis
        run: bash analyze.sh

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: apk-inspection-v2
          path: out
          retention-days: 14
