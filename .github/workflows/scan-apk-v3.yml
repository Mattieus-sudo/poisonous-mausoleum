name: Scan APK v3 (jitless feasibility)

# Answers: can the native code be turned into a signed iOS binary with NO JIT?
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Google Drive share link of the APK
        default: 'https://drive.google.com/file/d/1cSoNW0PKW_WHhULqHcKUMzv3bOpOuPan/view?usp=share_link'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        env:
          URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          pip install gdown
          ID=$(echo "$URL" | sed -E 's#.*/d/([^/]+).*#\1#')
          gdown "https://drive.google.com/uc?id=$ID" -O game.apk
          unzip -tq game.apk > /dev/null
          unzip -o -q game.apk 'lib/arm64-v8a/libp2re.so' -d apk
          ls -l apk/lib/arm64-v8a/

      - name: Write scanner
        run: |
          cat > scan.py <<'PY_EOF'
          import struct, sys, collections, array

          path = sys.argv[1]
          d = open(path, 'rb').read()
          assert d[:4] == b'\x7fELF' and d[4] == 2, 'not ELF64'
          (e_type, e_machine, e_version, e_entry, e_phoff, e_shoff, e_flags, e_ehsize,
           e_phentsize, e_phnum, e_shentsize, e_shnum, e_shstrndx) = struct.unpack_from('<HHIQQQIHHHHHH', d, 16)
          print('machine', e_machine, '(183 = AArch64)', ' size', len(d))

          # ---- segments
          segs = []
          for i in range(e_phnum):
              p_type, p_flags, p_off, p_va, p_pa, p_fsz, p_msz, p_al = struct.unpack_from('<IIQQQQQQ', d, e_phoff + i * e_phentsize)
              segs.append(dict(type=p_type, flags=p_flags, off=p_off, va=p_va, fsz=p_fsz, msz=p_msz))
          print('\n== LOAD segments ==')
          loads = [s for s in segs if s['type'] == 1]
          for s in loads:
              f = ('R' if s['flags'] & 4 else '-') + ('W' if s['flags'] & 2 else '-') + ('X' if s['flags'] & 1 else '-')
              print('  %s va=0x%x end=0x%x filesz=0x%x memsz=0x%x' % (f, s['va'], s['va'] + s['msz'], s['fsz'], s['msz']))
          if len(loads) >= 2:
              t_end = loads[0]['va'] + loads[0]['msz']
              print('  gap between end of first segment and start of second: 0x%x' % (loads[1]['va'] - t_end))

          def seg_of(va):
              for s in loads:
                  if s['va'] <= va < s['va'] + s['msz']:
                      return s
              return None

          def kind(va):
              s = seg_of(va)
              if s is None: return 'outside'
              return 'EXEC' if s['flags'] & 1 else 'data'

          def v2o(va):
              s = seg_of(va)
              if s is None or va - s['va'] >= s['fsz']: return None
              return s['off'] + va - s['va']

          # ---- dynamic
          dyn = {}
          for s in segs:
              if s['type'] == 2:
                  o = s['off']
                  while True:
                      tag, val = struct.unpack_from('<qQ', d, o)
                      o += 16
                      if tag == 0: break
                      dyn.setdefault(tag, val)
          print('\n== dynamic ==')
          flags = dyn.get(30, 0)
          print('  DT_FLAGS=0x%x  DT_TEXTREL present: %s  (DF_TEXTREL bit: %s)' % (flags, 22 in dyn, bool(flags & 4)))

          names = {257: 'ABS64', 1025: 'GLOB_DAT', 1026: 'JUMP_SLOT', 1027: 'RELATIVE', 1031: 'TLSDESC', 1032: 'IRELATIVE', 1030: 'TLS_TPREL', 1028: 'TLS_DTPMOD', 1029: 'TLS_DTPREL'}
          print('\n== relocations: where do they point? (EXEC = would need to patch code) ==')
          def rela(tag_a, tag_s, label):
              if tag_a not in dyn: return
              o = v2o(dyn[tag_a]); n = dyn[tag_s] // 24
              c = collections.Counter()
              for i in range(n):
                  off, info, add = struct.unpack_from('<QQq', d, o + i * 24)
                  c[(names.get(info & 0xffffffff, str(info & 0xffffffff)), kind(off))] += 1
              print(' ', label, n, 'entries')
              for k, v in sorted(c.items()): print('    %-12s -> %-7s %d' % (k[0], k[1], v))
          rela(7, 8, '.rela.dyn')
          rela(23, 2, '.rela.plt')
          if 36 in dyn:
              o = v2o(dyn[36]); n = dyn[35] // 8
              words = struct.unpack_from('<%dQ' % n, d, o)
              c = collections.Counter(); nxt = 0; lo = None; hi = 0
              for w in words:
                  if w & 1 == 0:
                      c[kind(w)] += 1; lo = w if lo is None else min(lo, w); hi = max(hi, w); nxt = w + 8
                  else:
                      bits = w >> 1
                      for i in range(63):
                          if bits >> i & 1:
                              a = nxt + i * 8
                              c[kind(a)] += 1; lo = a if lo is None else min(lo, a); hi = max(hi, a)
                      nxt += 63 * 8
              print('  .relr.dyn', n, 'words ->', dict(c), 'range 0x%x..0x%x' % (lo or 0, hi))

          # ---- sections
          secs = []
          shstr_off = None
          if e_shoff:
              for i in range(e_shnum):
                  secs.append(struct.unpack_from('<IIQQQQIIQQ', d, e_shoff + i * e_shentsize))
              shstr_off = secs[e_shstrndx][4]
          def sname(n):
              e = d.index(b'\0', shstr_off + n)
              return d[shstr_off + n:e].decode()
          print('\n== sections ==')
          text = None
          for s in secs:
              nm = sname(s[0])
              if nm in ('.text', '.rodata', '.eh_frame', '.data.rel.ro', '.data', '.bss', '.tdata', '.tbss', '.init_array', '.got'):
                  print('  %-14s addr=0x%x off=0x%x size=0x%x' % (nm, s[3], s[4], s[5]))
              if nm == '.text': text = s

          # ---- scan .text
          print('\n== scanning .text for the guest-window base 0x2000000000 ==')
          def decode(N, imms, immr):
              if N: length = 6
              else:
                  v = (~imms) & 0x3f
                  if v == 0: return None
                  length = v.bit_length() - 1
                  if length < 1: return None
              esize = 1 << length; levels = esize - 1
              S = imms & levels; R = immr & levels
              if S == levels: return None
              w = (1 << (S + 1)) - 1
              elem = ((w >> R) | (w << (esize - R))) & ((1 << esize) - 1)
              val = 0
              for i in range(0, 64, esize): val |= elem << i
              return val
          assert decode(1, 0, 27) == 1 << 37
          cache = {}
          if text:
              arr = array.array('I'); arr.frombytes(d[text[4]:text[4] + text[5] - text[5] % 4])
              orr_total = 0; orr_target = 0; movz = 0; movk = 0
              big = collections.Counter()
              for w in arr:
                  if (w >> 23) == 0x164:           # ORR (immediate), 64-bit
                      key = (w >> 10) & 0x1fff
                      val = cache.get(key, -1)
                      if val == -1:
                          val = decode((w >> 22) & 1, (w >> 10) & 63, (w >> 16) & 63); cache[key] = val
                      orr_total += 1
                      if val is not None and val >= 1 << 32:
                          big[val] += 1
                      if val == 0x2000000000: orr_target += 1
                  elif (w & 0xFFFFFFE0) == 0xD2C00400: movz += 1
                  elif (w & 0xFFFFFFE0) == 0xF2C00400: movk += 1
              print('  instructions in .text:', len(arr))
              print('  ORR xd,xn,#imm (64-bit) total:', orr_total)
              print('  ORR with imm 0x2000000000 (guest base):', orr_target)
              print('  other ORR immediates >= 2^32:', {hex(k): v for k, v in big.most_common(8) if k != 0x2000000000})
              print('  movz xd,#0x20,lsl#32 :', movz, '   movk xd,#0x20,lsl#32 :', movk)
          pat = b'\x00\x00\x00\x00\x20\x00\x00\x00'
          hits = []; i = d.find(pat)
          while i != -1 and len(hits) < 40:
              hits.append(i); i = d.find(pat, i + 1)
          print('  8-byte literal 0x2000000000 in file at offsets:', [hex(h) for h in hits[:20]], '(showing up to 20 of', len(hits), ')')
          print('\nDONE')
          PY_EOF

      - name: Scan
        run: |
          set -euo pipefail
          python3 scan.py apk/lib/arm64-v8a/libp2re.so | tee scan.txt
          { echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scan-v3
          path: scan.txt
