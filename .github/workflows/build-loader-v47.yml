name: Build loader v47 (registration stub only)
# Registration-only stub on the default branch.
# The full v47 workflow lives on the chatgpt branch at this same path.
# Select "chatgpt" in the Run workflow branch selector to use the real workflow.
# This job is intentionally skipped and performs no build or repository changes.
on:
  workflow_dispatch:
permissions: {}
jobs:
  registration_only:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Intentionally do nothing
        run: echo "Registration stub only; select the chatgpt branch to run v47."
