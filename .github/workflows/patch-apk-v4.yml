name: Patch dry-run v4 (guest base 0x2000000000 -> 0x7800000000)

# Patches a COPY of the code inside the runner, verifies it, and uploads only a text report.
# The patched binary is NOT uploaded.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Google Drive share link of the APK
        default: 'https://drive.google.com/file/d/1cSoNW0PKW_WHhULqHcKUMzv3bOpOuPan/view?usp=share_link'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        env:
          URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          pip install gdown
          ID=$(echo "$URL" | sed -E 's#.*/d/([^/]+).*#\1#')
          gdown "https://drive.google.com/uc?id=$ID" -O game.apk
          unzip -tq game.apk > /dev/null
          unzip -o -q game.apk 'lib/arm64-v8a/libp2re.so' -d apk

      - name: Write patcher
        run: |
          cat > patch.py <<'PY_EOF'
          import struct, sys, collections, array, hashlib

          SRC, DST = sys.argv[1], sys.argv[2]
          OLD, NEW = 0x2000000000, 0x7800000000
          NEW_ORR_FIELD = (1 << 12) | (29 << 6) | 3      # N=1 immr=29 imms=3  -> 0x7800000000
          NEW_IMM16 = NEW >> 32                           # 0x78
          d = bytearray(open(SRC, 'rb').read())
          assert d[:4] == b'\x7fELF' and d[4] == 2
          (e_type, e_machine, e_version, e_entry, e_phoff, e_shoff, e_flags, e_ehsize,
           e_phentsize, e_phnum, e_shentsize, e_shnum, e_shstrndx) = struct.unpack_from('<HHIQQQIHHHHHH', d, 16)
          secs = [struct.unpack_from('<IIQQQQIIQQ', d, e_shoff + i * e_shentsize) for i in range(e_shnum)]
          stroff = secs[e_shstrndx][4]
          def sname(n):
              return bytes(d[stroff + n:d.index(b'\0', stroff + n)]).decode()
          text = [s for s in secs if sname(s[0]) == '.text'][0]
          T0, TN = text[4], text[5] - text[5] % 4

          def decode(N, imms, immr):
              if N: length = 6
              else:
                  v = (~imms) & 0x3f
                  if v == 0: return None
                  length = v.bit_length() - 1
                  if length < 1: return None
              esize = 1 << length; lv = esize - 1
              S = imms & lv; R = immr & lv
              if S == lv: return None
              w = (1 << (S + 1)) - 1
              e = ((w >> R) | (w << (esize - R))) & ((1 << esize) - 1)
              v = 0
              for i in range(0, 64, esize): v |= e << i
              return v
          assert decode(1, 0, 27) == OLD and decode(1, 3, 29) == NEW

          def orr_imm(w):
              if (w >> 23) != 0x164: return None
              return decode((w >> 22) & 1, (w >> 10) & 63, (w >> 16) & 63)

          words = array.array('I'); words.frombytes(bytes(d[T0:T0 + TN]))
          n = len(words)
          orr_sites = []; movz_sites = []; movk_sites = []
          for i in range(n):
              w = words[i]
              if (w >> 23) == 0x164:
                  if orr_imm(w) == OLD: orr_sites.append(i)
              elif (w & 0xFFFFFFE0) == 0xD2C00400: movz_sites.append(i)
              elif (w & 0xFFFFFFE0) == 0xF2C00400: movk_sites.append(i)
          print('ORR sites     :', len(orr_sites))
          print('movz #0x20,32 :', len(movz_sites))
          print('movk #0x20,32 :', len(movk_sites))

          # how do the movk/movz sites look? classify by the preceding instructions writing the same register
          def rd(w): return w & 31
          def is_mov_wide(w): return (w & 0x1F800000) == 0x12800000 and (w >> 31) == 1   # movn/movz/movk, 64-bit
          cls = collections.Counter(); samples = []
          for i in movk_sites + movz_sites:
              r = rd(words[i]); chain = []
              for j in range(i - 1, max(i - 6, -1), -1):
                  w = words[j]
                  if is_mov_wide(w) and rd(w) == r: chain.append(w)
                  elif rd(w) == r and not is_mov_wide(w): break
              kind = 'movz-only' if words[i] >> 29 == 0b110 else ('chain>=1 wide mov before' if chain else 'movk with no wide mov nearby')
              cls[kind] += 1
              if len(samples) < 6 and kind.startswith('movk with no'):
                  samples.append((T0 + i * 4, [words[k] for k in range(max(i - 3, 0), min(i + 3, n))]))
          print('movk/movz classification:', dict(cls))
          for off, ws in samples:
              print('  odd movk at file offset 0x%x, words:' % off, ' '.join('%08x' % x for x in ws))

          # apply the patch
          for i in orr_sites:
              words[i] = (words[i] & ~(0x1FFF << 10)) | (NEW_ORR_FIELD << 10)
          for i in movz_sites + movk_sites:
              words[i] = (words[i] & ~(0xFFFF << 5)) | (NEW_IMM16 << 5)
          d[T0:T0 + TN] = words.tobytes()
          open(DST, 'wb').write(d)

          # verify by re-reading the patched file
          p = open(DST, 'rb').read()
          w2 = array.array('I'); w2.frombytes(p[T0:T0 + TN])
          left = sum(1 for w in w2 if (w >> 23) == 0x164 and orr_imm(w) == OLD)
          now = sum(1 for w in w2 if (w >> 23) == 0x164 and orr_imm(w) == NEW)
          changed = sum(1 for a, b in zip(words, array.array('I', open(SRC, 'rb').read()[T0:T0 + TN])) if a != b)
          print('after patch: ORR old=%d new=%d, words changed=%d (expected %d)' % (left, now, changed, len(orr_sites) + len(movz_sites) + len(movk_sites)))
          outside = sum(1 for a, b in zip(p, open(SRC, 'rb').read()) if a != b)
          print('bytes differing in whole file:', outside)
          pat = struct.pack('<Q', OLD)
          rest = []; k = bytes(p).find(pat)
          while k != -1:
              nm = [sname(s[0]) for s in secs if s[4] <= k < s[4] + s[5] and s[1] != 8]
              rest.append((k, nm[0] if nm else '(no section)')); k = bytes(p).find(pat, k + 1)
          print('8-byte literal 0x2000000000 still present at', len(rest), 'places; by section:', dict(collections.Counter(x[1] for x in rest)))
          print('patched sha256:', hashlib.sha256(p).hexdigest())
          print('DONE')
          PY_EOF

      - name: Patch and verify
        run: |
          set -euo pipefail
          python3 patch.py apk/lib/arm64-v8a/libp2re.so /tmp/libp2re.patched.so | tee patch-report.txt
          { echo '```'; cat patch-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: patch-report
          path: patch-report.txt
