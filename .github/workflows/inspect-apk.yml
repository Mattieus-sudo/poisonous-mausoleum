name: Inspect APK

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive share link to the APK (must be shared as 'Anyone with the link')"
        required: true
        default: "https://drive.google.com/file/d/1QcHUrrsNjlb2BeH_MHkgUCuFYDbw_kzZ/view?usp=share_link"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils file unzip aapt
          pip install gdown

      - name: Download APK
        run: |
          gdown --fuzzy "${{ github.event.inputs.drive_url }}" -O game.apk
          ls -la game.apk
          file game.apk
          # If this says "HTML document" the Drive link isn't public or hit a quota
          unzip -tq game.apk | tail -1

      - name: Unzip APK
        run: unzip -q game.apk -d apk

      - name: Get jadx (Java/Kotlin decompiler)
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx-1.5.0.zip -d jadx

      - name: Decompile Java/Kotlin side
        continue-on-error: true
        run: |
          ./jadx/bin/jadx -d jadx_out --no-res --show-bad-code apk/classes*.dex || true
          find jadx_out -name "*.java" | wc -l

      - name: Build report
        run: |
          R=report.md
          {
            echo "# APK report"
            echo
            echo "## Size and top-level layout"
            ls -la game.apk
            echo '```'
            ls -la apk
            echo '```'
            echo
            echo "## Manifest (package, SDK, permissions, activities)"
            echo '```'
            aapt dump badging game.apk | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|native-code|uses-feature|application-label)" || true
            echo '```'
            echo
            echo "## Native libraries"
            echo '```'
            find apk/lib -type f -exec ls -la {} \; 2>/dev/null || echo "no lib/ folder"
            echo '```'
            echo
            echo "## assets/ and top-level data (first 60 entries, sorted by size)"
            echo '```'
            find apk -type f -not -path "apk/lib/*" -not -name "*.dex" -printf "%s\t%p\n" | sort -rn | head -60
            echo '```'
          } > $R

          for so in $(find apk/lib/arm64-v8a -name "*.so" 2>/dev/null); do
            {
              echo
              echo "---"
              echo "### $so"
              echo '```'
              file "$so"
              echo "--- NEEDED libraries ---"
              readelf -d "$so" 2>/dev/null | grep NEEDED
              echo "--- exported symbol count ---"
              nm -D --defined-only "$so" 2>/dev/null | wc -l
              echo "--- JNI entry points (Java_*) ---"
              nm -D --defined-only "$so" 2>/dev/null | grep " Java_" | head -40
              echo "--- engine / renderer / wrapper fingerprints in strings ---"
              strings -n 6 "$so" | grep -iE "vulkan|GLES|eglCreate|libGL|SDL_|OpenAL|AAudio|OpenSL|box64|box86|fex-?emu|wine|proton|dxvk|vkd3d|gl4es|ANGLE|mobox|winlator|unity|il2cpp|unreal|lua|havok|bink|fmod|wwise|xinput|d3d9|d3d11|kernel32|ntdll" | sort | uniq -c | sort -rn | head -40
              echo '```'
            } >> $R
          done

          # Also check 32-bit libs if present
          if [ -d apk/lib/armeabi-v7a ]; then
            { echo; echo "## armeabi-v7a libs"; echo '```'; ls -la apk/lib/armeabi-v7a; echo '```'; } >> $R
          fi

          {
            echo
            echo "## Java/Kotlin side"
            echo '```'
            find jadx_out -name "*.java" 2>/dev/null | head -80
            echo '```'
          } >> $R

          # Show in the Actions run page (limit is ~1 MB)
          head -c 900000 $R >> $GITHUB_STEP_SUMMARY

      - name: Upload report and decompiled Java
        uses: actions/upload-artifact@v4
        with:
          name: apk-inspection
          path: |
            report.md
            jadx_out
          retention-days: 14
